<script>
'use strict';
/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = {
  W: 1600, H: 900, FPS: 24,
  BOIL_FPS: 5, BOIL_AMP: 1.1, WOBBLE: 1.4,
  FLOOR: 780,
  C: { paper: '#FBF8F1', ink: '#1E1E1E', red: '#D23A3F', pencil: '#9B9B9B', hi: '#FFE066' },
  FONT_ZH: "'ZCOOL KuaiLe','Patrick Hand',sans-serif",
  FONT_MIX: "'Patrick Hand','ZCOOL KuaiLe',sans-serif",
  FONT_MONO: "'VT323','Courier New',monospace", MONO_ADV: 0.4,
  SIZE: { sub: 52, label: 40, speech: 84, mark: 84, series: 32 },
};
const C = CFG.C;
// draw-order layers
const Z = { set: 10, hi: 12, board: 14, shadow: 18, chair: 20, back: 28, body: 30, desk: 35, front: 40, fx: 50, annot: 60, stamp: 70, sub: 90 };
const RAD = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
const EASE = {
  lin: u => u,
  io: u => u * u * (3 - 2 * u),
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  back: u => { const c = 2.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};

/* =====================================================================
   NOISE / BOIL  (deterministic: static wobble per key + boil per floor(t*BOIL_FPS))
   ===================================================================== */
const HCACHE = new Map();
function hstr(s) {
  let h = HCACHE.get(s); if (h !== undefined) return h;
  h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0; HCACHE.set(s, h); return h;
}
function rnd(a, b, c) { // -> [-1, 1)
  let t = (a ^ Math.imul(b + 1, 0x9E3779B1) ^ Math.imul(c + 7, 0x85EBCA77)) >>> 0;
  t = (t + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1;
}
const BOIL = { frame: 0, amp: CFG.BOIL_AMP };
function jit(h, i, p, amp) {
  const w = CFG.WOBBLE * 0.5, b = BOIL.amp * amp, f = BOIL.frame * 2 + 1000;
  return [p[0] + rnd(h, i, 1) * w + (b ? rnd(h, i, f) * b : 0),
          p[1] + rnd(h, i, 2) * w + (b ? rnd(h, i, f + 1) * b : 0)];
}

/* =====================================================================
   DRAW LIST  (flat, keyed items; affine matrix stack; reconciled into SVG)
   ===================================================================== */
const DL = {
  items: [], m: [1, 0, 0, 1, 0, 0], st: [], used: new Map(), zoff: 0,
  reset() { this.items.length = 0; this.m = [1, 0, 0, 1, 0, 0]; this.st.length = 0; this.used.clear(); this.zoff = 0; },
  save() { this.st.push(this.m.slice()); },
  restore() { this.m = this.st.pop(); },
  mul(n) {
    const [a, b, c, d, e, f] = this.m, [A, B, Cc, D, E, F] = n;
    this.m = [a * A + c * B, b * A + d * B, a * Cc + c * D, b * Cc + d * D, a * E + c * F + e, b * E + d * F + f];
  },
  translate(x, y) { this.mul([1, 0, 0, 1, x, y]); },
  scale(sx, sy = sx) { this.mul([sx, 0, 0, sy, 0, 0]); },
  rotate(deg) { const r = deg * RAD, c = Math.cos(r), s = Math.sin(r); this.mul([c, s, -s, c, 0, 0]); },
  about(x, y, fn) { this.translate(x, y); fn(); this.translate(-x, -y); },
  tp(p) { const m = this.m; return [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]]; },
  k() { const m = this.m; return Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])); },
  add(z, key, tag, attrs, text) {
    const n = this.used.get(key) || 0; this.used.set(key, n + 1);
    if (n) key += '#' + n;
    this.items.push({ z: z + this.zoff, key, tag, attrs, text, o: this.items.length });
  },
};

/* =====================================================================
   DRAWING PRIMITIVES
   ===================================================================== */
const f1 = v => Math.round(v * 10) / 10;
function catRun(R) {
  const n = R.length; let d = '';
  if (n === 2) return `L${f1(R[1][0])} ${f1(R[1][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = R[Math.max(i - 1, 0)], p1 = R[i], p2 = R[i + 1], p3 = R[Math.min(i + 2, n - 1)];
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
}
function smoothD(P, corners, closed) {
  let d = `M${f1(P[0][0])} ${f1(P[0][1])}`;
  if (closed) {
    const n = P.length;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
    }
    return d + 'Z';
  }
  let s = 0;
  for (let i = 1; i < P.length; i++) {
    if (i === P.length - 1 || corners[i]) { d += catRun(P.slice(s, i + 1)); s = i; }
  }
  return d;
}
/** A hand-drawn stroke through local points (3rd element truthy = sharp corner).
 *  o: {z, w, color, fill, closed, draw(0..1), boil(scale), opacity, bow, noStroke, blend} */
function stroke(key, pts, o = {}) {
  if (o.draw !== undefined && o.draw <= 0.002) return;
  if (!pts || pts.length < 2) return;
  const h = hstr(key);
  let P = pts, corners = pts.map(p => !!p[2]);
  if (P.length === 2 && !o.closed) {
    const a = P[0], b = P[1], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const bow = rnd(h, 99, 5) * Math.min(3, len * 0.03) * (o.bow ?? 1);
    P = [a, [(a[0] + b[0]) / 2 - (b[1] - a[1]) / len * bow, (a[1] + b[1]) / 2 + (b[0] - a[0]) / len * bow], b];
    corners = [false, false, false];
  }
  const amp = o.boil ?? 1;
  const W = P.map((p, i) => jit(h, i, DL.tp(p), amp));
  const a = {
    d: smoothD(W, corners, o.closed), fill: o.fill || 'none',
    stroke: o.noStroke ? 'none' : (o.color || C.ink),
    'stroke-width': +((o.w || 6) * DL.k()).toFixed(2),
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.draw !== undefined && o.draw < 1) {
    a.pathLength = 1; a['stroke-dasharray'] = '1 2'; a['stroke-dashoffset'] = +(1 - o.draw).toFixed(4);
    if (a.fill !== 'none') a['fill-opacity'] = o.draw > 0.6 ? 1 : 0;
  }
  if (o.blend) a.style = 'mix-blend-mode:multiply';
  DL.add(o.z ?? Z.body, key, 'path', a);
}
/** Points on a lumpy ring. a0/sweep in degrees; rv = radius variation. */
function ringPts(key, cx, cy, rx, ry, o = {}) {
  const n = o.n || 12, a0 = (o.a0 ?? -120) * RAD, sweep = (o.sweep ?? 360) * RAD, rv = o.rv ?? 0.03;
  const h = hstr(key + '~r'), pts = [], closed = !!o.closed;
  const cnt = closed ? n : n + 1;
  for (let i = 0; i < cnt; i++) {
    const a = a0 + sweep * i / n;
    let rr = 1 + rnd(h, i % n, 3) * rv;
    if (!closed && i === cnt - 1) rr *= 0.965; // Orlin's closing tick
    pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
  }
  return pts;
}
function superPts(cx, cy, w, h, n = 20, ex = 5) { // rounded-rect-ish superellipse
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    pts.push([cx + Math.sign(c) * Math.pow(Math.abs(c), 2 / ex) * w / 2, cy + Math.sign(s) * Math.pow(Math.abs(s), 2 / ex) * h / 2]);
  }
  return pts;
}
function dot(key, p, r, color = C.ink, z = Z.front) {
  const q = DL.tp(p), k = DL.k();
  DL.add(z, key, 'circle', { cx: f1(q[0]), cy: f1(q[1]), r: +(r * k).toFixed(2), fill: color });
}
function text(key, str, x, y, o = {}) {
  const m = DL.m;
  let tf = `matrix(${m.map(v => +v.toFixed(4)).join(' ')}) translate(${f1(x)} ${f1(y)})`;
  if (o.rot) tf += ` rotate(${o.rot})`;
  if (o.scale !== undefined && o.scale !== 1) tf += ` scale(${+o.scale.toFixed(4)})`;
  // Latin letters always in Patrick Hand: ZCOOL draws O as a square, so "IMO" would read "IM口"
  const font = o.font || CFG.FONT_ZH;
  const a = { transform: tf, x: 0, y: 0, 'font-size': o.size || 40, 'font-family': font === CFG.FONT_ZH && /[A-Za-z]/.test(str) ? CFG.FONT_MIX : font,
    fill: o.color || C.ink, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central', style: 'white-space:pre' };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.halo) { a.stroke = C.paper; a['stroke-width'] = o.halo; a['stroke-linejoin'] = 'round'; a['paint-order'] = 'stroke'; }
  DL.add(o.z ?? Z.annot, key, 'text', a, str);
}
/** Rough rendered width. CJK = 1 em; Latin ≈ 0.5 em (space 0.3); in the monospace code font every Latin char = MONO_ADV em. */
function textWidth(str, size, font) {
  const mono = font === CFG.FONT_MONO;
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0x2E80 ? size : (mono ? CFG.MONO_ADV : ch === ' ' ? 0.3 : 0.5) * size;
  return w;
}
/** Pencil-scribble ground shadow. */
function shadow(key, cx, cy, w, op = 1) {
  if (op <= 0.02) return;
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) {
    const u = i / n, amp = 6 * Math.sqrt(Math.max(0, 1 - Math.pow(2 * u - 1, 2))) + 1.5;
    pts.push([cx - w / 2 + w * u, cy + (i % 2 ? amp : -amp)]);
  }
  stroke(key, pts, { z: Z.shadow, w: 2.2, color: C.pencil, opacity: 0.75 * op, boil: 0.6 });
}
/** Curved arrow with a two-stroke head; draws on with p. */
function arrow(key, from, to, o = {}) {
  const p = o.p ?? 1; if (p <= 0) return;
  const len = dist(from, to) || 1, bend = (o.bend ?? 0.18) * len;

  stroke(k + '.shade', [[-W / 2 + 12, H / 2 + 8], [W / 2 + 7, H / 2 + 6, 1], [W / 2 + 7, -H / 2 + 12]], { z: z - 0.5, w: 2.4, color: C.pencil, opacity: 0.6 * p, boil: 0.5 });
  const n = fx.lines ?? 5, top = -H / 2 + (fx.title ? 110 : 70);
  for (let i = 0; i < n; i++) {
    const y = top + i * ((H / 2 - 40 - top) / Math.max(1, n - 1));
    stroke(k + '.l' + i, [[-W / 2 + 26, y], [W / 2 - 26, y + 1]], { z: z + 0.1, w: 2, color: C.pencil, opacity: 0.5, draw: stag(p, 1, 3), boil: 0.4 });

};


/* ---------------- 奖牌 ----------------
 * { type: 'e6_medal', id, at: [x, y]（奖牌中心）| char + part（挂在某人脖子上：char: 'terry'）, r: 54, label: '铜' | '银' | '金', t0, t1, shine: [t…] }
 * 只用墨线：一个圆牌、一条 V 形挂带，中间写“铜”。 */
COMP.e6_medal = {
  draw(fx, t, F) {
    if (t < fx.t0 || (fx.t1 !== undefined && t >= fx.t1)) return;
    const kid = fx.char && CAST[fx.char] && CAST[fx.char].kid, lt = t - fx.t0, r = fx.r || (kid ? 38 : 54), k = fx.id;   // a child's medal is smaller (r 38 keeps its label readable on a phone)
    let c, neck = null;
    if (fx.char) { const a = F.anchors[fx.char]; if (!a) return; neck = [a.head[0], a.head[1] + a.r * 1.05]; c = [neck[0] + (fx.dx || 0), neck[1] + (fx.drop || (kid ? 52 : r * 1.7))]; }
    else c = fx.pos ? evalTrack(fx.pos, t) : fx.at;
    const pop = fx.t0 < 0 ? 1 : EASE.back(clamp(lt / 0.3)), z = fx.z ?? Z.front + 2;
    DL.save(); DL.about(c[0], c[1], () => DL.scale(pop));
    const top = neck || [c[0], c[1] - r * 2.2];
    stroke(k + '.rL', [[top[0] - r * 0.55, top[1]], [c[0] - r * 0.32, c[1] - r * 0.86]], { z: z - 0.1, w: 4 });
    stroke(k + '.rR', [[top[0] + r * 0.55, top[1]], [c[0] + r * 0.32, c[1] - r * 0.86]], { z: z - 0.1, w: 4 });
    stroke(k + '.disc', ringPts(k, c[0], c[1], r, r, { n: 14, closed: true }), { z, w: 5, closed: true, fill: C.paper });
    stroke(k + '.in', ringPts(k + 'i', c[0], c[1], r * 0.74, r * 0.74, { n: 12, a0: 20, sweep: 300 }), { z: z + 0.1, w: 2.4, color: C.pencil });
    text(k + '.t', fx.label || '银', c[0], c[1] + 2, { size: r * 0.95, z: z + 0.2 });
    (fx.shine || []).forEach((st, j) => {
      const u = (t - st) / 0.5; if (u < 0 || u > 1) return;
      for (let i = 0; i < 4; i++) {
        const a = (-60 + i * 40) * RAD, r0 = r * 1.25, L = r * 0.45 * Math.sin(Math.PI * u);
        stroke(k + '.sh' + j + i, [[c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0 - r * 0.3], [c[0] + Math.cos(a) * (r0 + L), c[1] + Math.sin(a) * (r0 + L) - r * 0.3]], { z, w: 4 });
      }
    });
    DL.restore();
    F.targets[k + '.c'] = c;
  },
  cues: fx => [[fx.t0, 'ding'], ...(fx.shine || []).map(s => [s, 'plip'])],
};

// 第 10 场 · 去普林斯顿（17 岁，1992 年秋）
// 事实（ep6-script.md）：1992 年秋，17 岁，拿奖学金去普林斯顿读博士；爸爸陪了头几个星期，教他开银行账户、自己洗衣服；
//   第一天在数学楼大厅看老师名单：“I recognized half the names … It was kind of intimidating.”（PAW 2019）；
//   研究生课 “did not have any homework or tests”，唯一的大考是让人害怕的资格口试（generals）。
// 演绎：地图只画两块示意的陆地和名字，飞机窗口里是小陶的小头像；名单上的名字都是铅笔涂鸦（不写真人名字），14 个里打 7 个勾 = “一半”；

// 印章：开场在中央盖 17 岁（飘带“1992 普林斯顿”），再停靠，一直留到结尾（交给第 15 场）。

// 字幕：第 6–10 句整体后移 0.6 秒（给洗衣机那一格留时间）；每句时长不变。
(() => {
  const FL = 780;
  /* ---------------- times (scene clock) ---------------- */
  const STAMP = 0.35, DOCK = 2.5;
  const T_IN = 2.65, WAVE0 = 3.15, WAVE1 = 3.95, FADE1 = 4.05;                                  // L1 0.3–4.3
  const MAP = 4.2, TAKE = 4.8, LAND = 7.0, NOTE2 = 4.95, MAP_OUT = 7.7;                          // L2 4.4–7.8
  const UNI = 7.82, UNI_SIGN = 8.2, T_W0 = 8.25, T_W1 = 9.95, LOOK = 10.1;                       // L3 7.9–11.1

  const BANK = CUT1 + 0.12, POINT = 15.6, SIGN0 = 15.85, SIGN1 = 16.55, CUT2 = 16.85;            // L5 15.2–19.0: the bank …
  const WASH = CUT2 + 0.12, PRESS_D = 17.6, PRESS_T = 18.45, CUT3 = 19.85;                        //   … and the washing machine
  const LOBBY = CUT3 + 0.12, T_W2 = 20.2, T_W3 = 21.3, LOOKUP = 21.4, BTITLE = 22.6;             // L6 20.3–24.7
  const TICK0 = 25.25, TICKD = 0.25, RECALL = 25.05, SCARY = 27.55, CUT4 = 29.95;                // L7 25.0–29.8
  const CARD = 30.3, ROW1 = 32.0, ROW2 = 33.2, CUT5 = 35.4;                                       // L8 30.5–35.3
  const DROP = 35.95, LANDS = 36.25, THUMP = 39.35, FEAR = 39.55, FADE0 = 41.2, DUR = 41.8;      // L9 35.4–39.0, L10 39.3–41.3
  const IN = 0.3;   // characters fade back in this long after a cut

  /* ---------------- layout ---------------- */
  const TX1 = 380, TX3 = 900, DX4 = 1140, BX_T = 540, BX_D = 790, WX_T = 730, WX_D = 300, LX_T = 380;
  const P0 = [330, 556], P1 = [800, 70], P2 = [1270, 268];                          // the flight
  const SIG = [[392, 562], [400, 548], [408, 560], [418, 546], [428, 561], [438, 549], [448, 559], [462, 551]];   // the signature on the form
  const BTN_D = [470, 556], BTN_T = [570, 556], DOOR = [520, 675];                    // the washing machine
  const BD = { x0: 640, x1: 1320, y0: 110, y1: 690 }, LIT = [0, 8, 2, 3, 11, 5, 13];   // the name board; 7 of 14 names light up
  const CD = { cx: 930, cy: 420, w: 560, h: 420 };                                    // the 研究生课 card
  const SG = { cx: 670, w: 840, top: 90, h: 280 };                                    // the big 资格口试 sign

  /* ---------------- helpers ---------------- */
  const box = (x0, y0, x1, y1) => [[x0, y0], [x1, y0, 1], [x1, y1, 1], [x0, y1, 1], [x0, y0, 1]];
  const fadeItems = (n0, k) => { if (k < 1) for (let i = n0; i < DL.items.length; i++) { const a = DL.items[i].attrs; a.opacity = +((a.opacity ?? 1) * Math.max(0, k)).toFixed(3); } };
  const abs = (x, y, bend = 'down') => ({ w: 1, to: 'abs', dx: x, dy: y, bend });
  const bez = (A, B, Cc, u) => [(1 - u) * (1 - u) * A[0] + 2 * u * (1 - u) * B[0] + u * u * Cc[0], (1 - u) * (1 - u) * A[1] + 2 * u * (1 - u) * B[1] + u * u * Cc[1]];
  const scrib = (k, x0, x1, y, n, o) => { const pts = []; for (let j = 0; j <= n; j++) pts.push([lerp(x0, x1, j / n), y + (j % 2 ? -6 : 5) + rnd(hstr(k), j, 3) * 2]); stroke(k, pts, o); };
  const tick = (k, c, s, o) => stroke(k, [[c[0] - 26 * s, c[1]], [c[0] - 8 * s, c[1] + 20 * s, 1], [c[0] + 30 * s, c[1] - 32 * s]], o);

  /* ---------------- generic bits ---------------- */
  /** draws `paint` from t0 and fades its own shapes out from fo over fd */
  COMP.a6_pLayer = {
    draw(fx, t, F) {
      if (t < fx.t0) return;
      const k = fx.fo !== undefined ? 1 - clamp((t - fx.fo) / (fx.fd || 0.25)) : 1; if (k <= 0) return;
      const n0 = DL.items.length;
      fx.paint(t, F, t - fx.t0);

    cues: fx => fx.sfxAt || [],
  };
  /** red-pen note (pops in, fades out) */
  COMP.a6_pNote = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const lt = t - fx.t0, k = clamp((fx.t1 - t) / 0.2), pp = EASE.back(clamp(lt / 0.2)), size = fx.size || 40, n0 = DL.items.length, lines = [].concat(fx.text);

  /** per-character opacity tracks (a character fades out at a cut, jumps while invisible, fades back in) */
  COMP.a6_pVis = {

  COMP.a6_pEnd = {

  };

  /* ---------------- character tracks shared with the props ---------------- */
  const TPOS = [[0, [TX1, FL]], [FADE1 + 0.27, [1760, FL], 0], [T_W0, [TX3, FL], T_W1 - T_W0, 'lin'],
    [CUT1 + 0.27, [BX_T, FL], 0], [CUT2 + 0.27, [WX_T, FL], 0], [CUT3 + 0.27, [-200, FL], 0], [T_W2, [LX_T, FL], T_W3 - T_W2, 'lin']];
  const VIS = {
    terry: [[0, 1], [FADE1, 0, 0.25], [FADE1 + 0.3, 1, 0], [CUT1, 0, 0.25], [CUT1 + IN, 1, 0.2], [CUT2, 0, 0.25], [CUT2 + IN, 1, 0.2], [CUT3, 0, 0.25], [CUT3 + 0.3, 1, 0]],
    dad: [[0, 1], [CUT1, 0, 0.25], [CUT1 + IN, 1, 0.2], [CUT2, 0, 0.25], [CUT2 + IN, 1, 0.2], [CUT3, 0, 0.25]],
  };
  // the suitcase: stands upright beside him (wheels at x + 150), or is dragged behind him tilted −40° (wheels at x + 210)
  const DRAG = [[0, 0], [T_W0 - 0.05, 1, 0], [T_W1, 0, 0.25]];
  const caseAt = t => { const d = evalTrack(DRAG, t), x = evalTrack(TPOS, t)[0]; return { W: [x + lerp(150, 210, d), FL - 2], rot: lerp(0, -40, d) }; };
  const HANDLE = 205;
  const handleTop = t => { const { W, rot } = caseAt(t), a = rot * RAD; return [W[0] + HANDLE * Math.sin(a), W[1] - HANDLE * Math.cos(a)]; };
  const penTip = t => pointAt(SIG, clamp((t - SIGN0) / (SIGN1 - SIGN0)));

  /* ---------------- 1 · the suitcase ---------------- */
  COMP.a6_pCase = {
    draw(fx, t) {
      if (t < T_IN || t >= CUT1 + 0.26) return;
      const vis = evalTrack(VIS.terry, t); if (vis <= 0.01) return;
      const { W, rot } = caseAt(t), pop = Math.max(0.01, EASE.back(clamp((t - T_IN) / 0.3))), n0 = DL.items.length, k = 'a6pCase', z = Z.body - 1;
      DL.save(); DL.translate(W[0], W[1]); DL.scale(pop); DL.rotate(rot);
      stroke(k + '.rl', [[-14, -140], [-14, -HANDLE]], { z: z - 0.1, w: 4 });
      stroke(k + '.rr', [[14, -140], [14, -HANDLE]], { z: z - 0.1, w: 4 });
      stroke(k + '.grip', [[-22, -HANDLE], [22, -HANDLE]], { z, w: 7 });
      stroke(k + '.body', superPts(0, -80, 96, 126, 22, 7), { z, w: 5, closed: true, fill: C.paper });
      stroke(k + '.rib0', [[-24, -136], [-24, -24]], { z: z + 0.1, w: 2.6 });
      stroke(k + '.rib1', [[24, -136], [24, -24]], { z: z + 0.1, w: 2.6 });
      [-30, 30].forEach((x, i) => stroke(k + '.wh' + i, ringPts(k + '.wh' + i, x, -9, 9, 9, { n: 8, closed: true }), { z: z + 0.1, w: 3.5, closed: true, fill: C.paper }));
      DL.restore();
      fadeItems(n0, vis);
    },
  };

  /* ---------------- 2 · the flight: 澳大利亚 → 美国 ---------------- */
  const planeU = t => EASE.io(clamp((t - TAKE) / (LAND - TAKE)));
  const mapPaint = (t, F, lt) => {

    return [BX + textWidth(L.s, WS) * u, L.y + 10 + 3 * Math.sin(t * 31)];
  };

  /* ---------------- 楼梯：四张题卡，一级比一级小、比一级简单（比喻：卡上只有铅笔“题目线”，不写真题，免得孩子去算） ---------------- */
  const STEPS = [
    { x0: 100, x1: 420, y: 420, s: 40, n: 3, len: 1 },
    { x0: 420, x1: 645, y: 505, s: 38, n: 2, len: 1 },
    { x0: 645, x1: 810, y: 590, s: 36, n: 1, len: 1 },
    { x0: 810, x1: 940, y: 675, s: 36, n: 1, len: 0.42 },
  ];
  const NOTE_ST = 31.2;                                                        // red "越来越简单" on the big first step
  const squig = (key, x0, x1, y) => { const pts = [], n = Math.max(2, Math.round((x1 - x0) / 9)); for (let i = 0; i <= n; i++) pts.push([lerp(x0, x1, i / n), y + (i % 2 ? -4.5 : 3.5) + rnd(hstr(key), i, 1) * 1.5]); return pts; };
  STEPS.forEach((st, i) => {
    st.card = [st.x0 + 10, st.y + 10, st.x1 - 10, st.y + 10 + st.s + 26];
    const [a, b, c, d] = st.card, x0 = a + 16;
    st.lines = Array.from({ length: st.n }, (_, j) => ({ pts: squig('b6g.sq' + i + j, x0, x0 + (c - a - 32) * st.len, b + (d - b) * (j + 1) / (st.n + 1)), t0: CARD_W[i] + j * 0.28 }));
  });
  const STAND = [[300, 420], [540, 505], [735, 590], [880, 675]];             // where Terry stands on each step

  /* ---------------- 记错科目的那叠题卡，和“基础题” ---------------- */
  const HOLD = [850, 400], DESKSPOT = [1000, 574], KA = 0.35;
  const stackAt = t => {                                                       // {c:[x,y], k:scale, rot}
    if (t < ASIDE) { const u = EASE.out(clamp((t - STACK0) / 0.3)); return { c: lerp2(DESKSPOT, HOLD, u), k: lerp(KA, 1, u), rot: lerp(-4, 2, u) }; }
    const u = EASE.io(clamp((t - ASIDE) / 0.45)); return { c: lerp2(HOLD, DESKSPOT, u), k: lerp(1, KA, u), rot: lerp(2, -4, u) };
  };
  const SW = 220, SH = 116, BW = 170, BH = 84, HOLD2 = [860, 405];
  const handOnStack = t => { const s = stackAt(t); return [s.c[0] + (SW / 2 - 12) * s.k, s.c[1] + 16 * s.k]; };
  const handOnBasic = () => [HOLD2[0] + BW / 2 - 12, HOLD2[1] + 14];

  /* ---------------- poses / faces ---------------- */
  const hipT = (dx, dy) => ({ w: 1, to: 'hip', dx, dy, bend: 'out' });
  Object.assign(POSE, {
    b6_gSit: { sit: 1, legScale: 1.12, thigh: 0.24, legL: [66, -60], legR: [66, -60], ikL: hipT(-30, 16), ikR: hipT(30, 16) },
    b6_gProf: { sit: 1, legScale: 0.85, thigh: 0.25, legL: [62, -57], legR: [62, -57], ikL: { w: 1, to: 'desk', dx: -44, dy: -2, bend: 'down' }, ikR: { w: 1, to: 'desk', dx: 40, dy: -2, bend: 'down' } },
    b6_gPresent: { armScale: 1.25, armR: [96, -6], armL: [16, 10], lean: -2, tilt: -4 },
    b6_gStuck: { armScale: 1.3, armR: [74, 46], armL: [14, 8], lean: 2, tilt: 5 },
    b6_gShrug: { armL: [30, 62], armR: [30, 62], tilt: 7 },
    b6_gHop: { legL: [22, -46], legR: [10, -30], armL: [64, 24], armR: [64, 24], lean: 3 },
    b6_gAnswer: { armScale: 1.3, armR: [128, 18], armL: [16, 10], lean: -2, tilt: -5 },
    b6_gEase: { armL: [8, 4], armR: [8, 4], lean: 2, tilt: 4 },
  });
  Object.assign(POSE, {
    b6_gPoint: { ...POSE.b6_gProf, lean: -4, armScale: 1.1, armL: [118, 12], ikL: { w: 0 } },
    b6_gBeckon: t => ({ ...POSE.b6_gProf, lean: -5, armScale: 1.1, armL: [62, 64 + 34 * Math.max(0, Math.sin(t * 7))], ikL: { w: 0 } }),
    b6_gHold: t => { const h = handOnStack(t); return { ...POSE.b6_gProf, lean: -4, armScale: 1.6, ikL: { w: 1, to: 'abs', dx: h[0], dy: h[1], bend: 'out' } }; },
    b6_gHoldB: () => { const h = handOnBasic(); return { ...POSE.b6_gProf, lean: -4, armScale: 1.6, ikL: { w: 1, to: 'abs', dx: h[0], dy: h[1], bend: 'out' } }; },
    b6_gTap: t => ({ ...POSE.b6_gSit, legR: [66, -60 + 16 * Math.max(0, Math.sin(t * 11))] }),
    b6_gWrite: t => { const p = nibAt(t); return { lean: 3, tilt: -3, armScale: 1.65, armL: [6, 0], ikR: { w: 1, to: 'abs', dx: p[0], dy: p[1], bend: 'down' } }; },
  });
  POSE.b6_gScratch = t => ({ ...POSE.b6_gHold(t), tilt: 9, ikR: { w: 1, to: 'head', dx: 0.95, dy: -0.85, bend: 'out' } });
  Object.assign(FACE, {
    b6_gRelief: { eyes: 'happy', mouth: 'smile', mw: 0.3, brow: 'line', browL: -12, browR: -12, browY: 0.02 },
    b6_gPhew: { lidL: 0.72, lidR: 0.72, brow: 'line', browL: -14, browR: -14, mouth: 'o' },
    b6_gKind: { mouth: 'smile', mw: 0.26, lidL: 0.14, lidR: 0.14 },

  /** a professor's pose track + nods (tilt bumps; negative = forward for someone facing left) */
  const profPose = (keys, nods) => [[0, t => {
    const p = evalTrack(keys, t, POSE, DEF_POSE);
    let b = 0; nods.forEach(([t0, n]) => { const u = (t - t0) / 0.42; if (u > 0 && u < n) b += Math.sin(Math.PI * (u % 1)); });
    return b ? { ...p, tilt: (p.tilt || 0) - 8 * b } : p;
  }]];

  /* ---------------- 房间：窗、钟、长桌、椅子、黑板、长椅、门 ---------------- */
  COMP.b6_gRoom = {
    draw(fx, t, F) {
      const k = 'b6g', z = Z.set;
      // window with falling snow
      faded(t < WIN0 ? 0 : outP(t, WIN1 + 0.3), () => {
        const { x0, y0, x1, y1 } = WIN, p = inP(t, WIN0, 0.4), mx = (x0 + x1) / 2, my = (y0 + y1) / 2;

        stroke(k + '.winV', [[mx, y0 + 4], [mx + 1, y1 - 4]], { z: z + 0.3, w: 3.5, draw: stag(p, 1, 3) });
        stroke(k + '.winH', [[x0 + 4, my], [x1 - 4, my - 1]], { z: z + 0.3, w: 3.5, draw: stag(p, 1, 3) });

        stroke(k + '.drift', [[x0 + 6, y1 - 12], [x0 + 46, y1 - 22], [x0 + 96, y1 - 14], [x0 + 150, y1 - 25], [x0 + 196, y1 - 13], [x1 - 6, y1 - 20]], { z: z + 0.2, w: 2.6, draw: stag(p, 2, 3) });
        if (p < 0.95) return;
        for (let i = 0; i < 14; i++) {

          const xx = x0 + 18 + (i * 83) % (x1 - x0 - 36) + 7 * Math.sin(t * 1.4 + i * 1.7), r = 4.5 + (i % 3);

      faded(t < CLK0 ? 0 : outP(t, OUT), () => {

        stroke(k + '.clkO', ringPts(k + '.clkO', c[0], c[1], r, r, { n: 14, a0: -110, sweep: 374, rv: 0.02 }), { z: zc, w: 5.5, fill: C.paper, draw: p });

        SPINS.forEach(([a, b], j) => {                                         // pencil blur behind the whirling minute hand
          const u = (t - a) / (b - a); if (u <= 0 || u >= 1) return;

        });
        stroke(k + '.clkH', [c, clkPt(H0 + m * 0.5, r * 0.42)], { z: zc + 0.2, w: 6 });
        stroke(k + '.clkM', [c, clkPt(m * 6, r * 0.66)], { z: zc + 0.2, w: 4.2 });
        dot(k + '.clkD', c, 4.5, C.ink, zc + 0.3);
      });
      faded(t < SPIN1[0] ? 0 : outP(t, ARC1), () => {
        const u = EASE.io(clamp((t - SPIN1[0]) / (SPIN1[1] - SPIN1[0]))), R = CLK.r + 18;
        if (u > 0.02) {

        }
      });
      // the examiners' long table
      faded(t < TAB0 ? 0 : outP(t, OUT), () => {
        const { x0, x1, top, low } = TAB, p = inP(t, TAB0, 0.4), zt = Z.desk;
        stroke(k + '.tab', superPts((x0 + x1) / 2, top + 9, x1 - x0, 20, 18, 7), { z: zt, w: 5, closed: true, fill: C.paper, draw: stag(p, 0, 3) });
        stroke(k + '.tabP', box(x0 + 14, top + 19, x1 - 14, low), { z: zt, w: 4.5, fill: C.paper, draw: stag(p, 1, 3) });
        stroke(k + '.tabL', [[x0 + 26, low], [x0 + 24, FL]], { z: zt, w: 5, draw: stag(p, 2, 3) });
        stroke(k + '.tabR', [[x1 - 26, low], [x1 - 24, FL]], { z: zt, w: 5, draw: stag(p, 2, 3) });
        if (p > 0.8) shadow(k + '.tabS', (x0 + x1) / 2, FL + 4, x1 - x0 + 30, 1);
      });
      // Terry's chair (side view: he faces right, the back is on his left)
      faded(t < CHAIR0 ? 0 : outP(t, 28.9), () => {
        const { x, seat } = CHAIR, p = inP(t, CHAIR0, 0.35), zc = Z.chair;
        stroke(k + '.chS', superPts(x, seat + 8, 96, 14, 14, 6), { z: zc, w: 5, closed: true, fill: C.paper, draw: stag(p, 0, 3) });
        stroke(k + '.chB', [[x - 44, seat + 4], [x - 50, seat - 112]], { z: zc, w: 5, draw: stag(p, 1, 3) });
        stroke(k + '.chB2', superPts(x - 49, seat - 88, 14, 50, 12, 6), { z: zc, w: 4.5, closed: true, fill: C.paper, draw: stag(p, 1, 3) });
        stroke(k + '.chL1', [[x - 40, seat + 14], [x - 44, FL]], { z: zc, w: 5, draw: stag(p, 2, 3) });
        stroke(k + '.chL2', [[x + 40, seat + 14], [x + 44, FL]], { z: zc, w: 5, draw: stag(p, 2, 3) });
      });
      // blackboard + his prepared corner of notation
      faded(t < BOARD0 ? 0 : outP(t, 28.9), () => {
        const { x0, y0, x1, y1 } = BOARD, p = inP(t, BOARD0, 0.4);
        stroke(k + '.bdO', [[x0, y0], [x1, y0, 1], [x1, y1, 1], [x0, y1, 1], [x0, y0 - 2]], { z, w: 6, draw: stag(p, 0, 3) });
        stroke(k + '.bdI', [[x0 + 14, y0 + 14], [x1 - 14, y0 + 14, 1], [x1 - 14, y1 - 14, 1], [x0 + 14, y1 - 14, 1], [x0 + 14, y0 + 12]], { z, w: 3.5, draw: stag(p, 1, 3) });
        stroke(k + '.bdT', [[x0 + 30, y1 + 12], [x1 - 30, y1 + 12]], { z, w: 5, draw: stag(p, 2, 3) });
        WL.forEach((L, i) => {
          if (t < L.t0) return;
          const n = Math.min([...L.s].length, Math.floor((t - L.t0) * CPS) + 1);
          text(k + '.wl' + i, [...L.s].slice(0, n).join(''), BX, L.y, { size: WS, anchor: 'start', z: Z.board });
        });
      });
      // corridor bench
      faded(t < BENCH0 ? 0 : outP(t, OUT), () => {
        const { x, seat } = BENCH, p = inP(t, BENCH0, 0.35), zc = Z.chair;
        stroke(k + '.bnS', superPts(x, seat + 8, 210, 16, 16, 6), { z: zc, w: 5, closed: true, fill: C.paper, draw: stag(p, 0, 2) });
        stroke(k + '.bnL1', [[x - 88, seat + 16], [x - 92, FL]], { z: zc, w: 5, draw: stag(p, 1, 2) });
        stroke(k + '.bnL2', [[x + 88, seat + 16], [x + 92, FL]], { z: zc, w: 5, draw: stag(p, 1, 2) });
        if (p > 0.8) shadow(k + '.bnSh', x, FL + 4, 230, 1);
      });
      // the door the examiners close: frame, two leaves that swing, a hanging sign
      faded(t < DOOR0 ? 0 : outP(t, OUT), () => {
        const { x0, x1, top } = DOOR, p = inP(t, DOOR0, 0.4), zd = Z.fx + 2;
        stroke(k + '.drF', [[x0, FL], [x0, top, 1], [x1, top, 1], [x1, FL]], { z: zd + 0.5, w: 6, draw: p });
        stroke(k + '.drF2', [[x0 - 16, FL], [x0 - 16, top - 16, 1], [x1 + 16, top - 16, 1], [x1 + 16, FL]], { z: zd + 0.5, w: 3, draw: stag(p, 1, 2) });
        if (t < CLOSE[0]) return;
        const W = (x1 - x0) / 2, o = doorOpen(t), vw = W * (0.13 + 0.87 * (1 - o)), sk = 16 * o;
        [[x0, 1], [x1, -1]].forEach(([hx, s], i) => {
          const fx2 = hx + s * vw, kk = k + '.leaf' + i;
          stroke(kk, [[hx, top], [fx2, top - sk, 1], [fx2, FL + sk * 0.4, 1], [hx, FL, 1], [hx, top, 1]], { z: zd, w: 5, fill: C.paper });
          const ix = u => hx + s * vw * u;
          stroke(kk + '.p1', box(Math.min(ix(0.18), ix(0.82)), top + 40, Math.max(ix(0.18), ix(0.82)), 500), { z: zd + 0.1, w: 2.6, color: C.pencil });
          stroke(kk + '.p2', box(Math.min(ix(0.18), ix(0.82)), 560, Math.max(ix(0.18), ix(0.82)), FL - 40), { z: zd + 0.1, w: 2.6, color: C.pencil });
          if (vw > 60) stroke(kk + '.kn', ringPts(kk + '.kn', ix(0.9), 530, 9, 9, { n: 8, closed: true }), { z: zd + 0.2, w: 3.5, closed: true, fill: C.paper });

      });
      // "商量中……" sign, swinging from a nail on the shut doors
      faded(t < SIGN0 ? 0 : outP(t, SIGN1, 0.25), () => {
        const lt = t - SIGN0, nail = [(DOOR.x0 + DOOR.x1) / 2, DOOR.top + 22], zs = Z.fx + 3;
        const rot = 9 * Math.exp(-3 * lt) * Math.sin(lt * 11) + 2, drop = 40 * (1 - EASE.back(clamp(lt / 0.3)));
        DL.save(); DL.translate(nail[0], nail[1] - drop); DL.rotate(rot);
        stroke(k + '.sgS', [[-96, 70], [0, 0, 1], [96, 70]], { z: zs, w: 2.6 });
        stroke(k + '.sgB', box(-128, 70, 128, 152), { z: zs, w: 4.5, fill: C.paper });
        text(k + '.sgT', '商量中……', 0, 112, { size: 42, z: zs + 0.1 });
        DL.restore();
        dot(k + '.sgN', nail, 5, C.ink, zs + 0.2);
      });
    },
    cues: () => [[WIN0, 'paper'], [TAB0, 'paper'], [CLK0, 'pop'], [SPIN1[0], 'b6_whirr'], [SPIN1[0] + 0.9, 'b6_whirr'], [BOARD0, 'paper'],
      ...WL.flatMap(L => [0, 3, 6, 9].filter(i => i < [...L.s].length).map(i => [L.t0 + i / CPS, 'chalk'])),
      [BENCH0, 'paper'], [DOOR0, 'paper'], [CLOSE[1] - 0.04, 'thud'], [SIGN0, 'paper'], [SPIN2[0], 'b6_whirr'], [SPIN2[0] + 1.2, 'b6_whirr'], [SPIN2[0] + 2.3, 'b6_whirr'],
      [OPEN[0], 'whoosh'], [CLOSE2[1] - 0.04, 'thud']],
  };
  function doorOpen(t) {                                                       // 1 = wide open, 0 = shut
    if (t < OPEN[0]) return 1 - EASE.io(clamp((t - CLOSE[0]) / (CLOSE[1] - CLOSE[0])));
    if (t < CLOSE2[0]) return EASE.out(clamp((t - OPEN[0]) / (OPEN[1] - OPEN[0])));
    return 1 - EASE.io(clamp((t - CLOSE2[0]) / (CLOSE2[1] - CLOSE2[0])));
  }

  /** chalk in Terry's hand while he writes his corner */
  COMP.b6_gChalk = {
    draw(fx, t, F) {
      if (t < WL[0].t0 - 0.2 || t >= 12.4) return;
      const a = F.anchors.terry; if (!a) return;
      const h = a.handR;

  COMP.b6_gPointer = {
    draw(fx, t, F) {
      if (t < fx.t0 || t >= fx.t1) return;
      const a = F.anchors.exam3; if (!a) return;

    },

  };
  /** the result he only half remembers: dashed, flickering squiggles with pieces missing (a pencil "?" in each gap) —
   *  no real formula, so nobody reads it as school maths he forgot */
  const FUZ = [[212, [[150, 235], [285, 372], [418, 492]]], [262, [[176, 268], [316, 412]]]]
    .flatMap(([y, segs], r) => segs.map(([a, b], j) => squig('b6g.fz' + r + j, a, b, y)));
  const FUZQ = [[260, 212], [395, 212], [292, 262], [446, 262]];
  COMP.b6_gFuzzy = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;

      });
      FUZQ.forEach(([x, y], j) => text('b6g.fzq' + j, '?', x, y, { size: 36, color: C.pencil, z: Z.fx + 0.5, opacity: op * (0.6 + 0.3 * Math.sin(t * 3 + j)), font: CFG.FONT_MIX }));
    },

  /** the three things he could not do, one card above each examiner; each gets a red ✗ */
  const ASKS = [{ s: '说准？', x: PX.exam3, who: 'exam3' }, { s: '证对？', x: 1268, who: 'stein' }, { s: '有什么用？', x: 1475, who: 'exam2' }];
  COMP.b6_gAsk = {
    draw(fx, t, F) {
      ASKS.forEach((A, i) => {
        if (t < ASK[i] || t >= C_OUT) return;
        const lt = t - ASK[i], pp = EASE.back(clamp(lt / 0.25)), w = textWidth(A.s, 38) + 36, y = 318, kk = 'b6g.ask' + i;
        faded(outP(t, C_OUT), () => {
          const a = F.anchors[A.who];
          if (a) stroke(kk + '.tl', [[A.x - 6 + (a.headTop[0] - A.x) * 0.3, y + 34], [a.headTop[0] - 4, a.headTop[1] - 24]], { z: Z.annot - 1, w: 3.5, draw: clamp(lt / 0.2) });
          DL.save(); DL.about(A.x, y, () => DL.scale(lerp(0.4, 1, pp)));
          stroke(kk, box(A.x - w / 2, y - 32, A.x + w / 2, y + 32), { z: Z.annot - 1, w: 4.5, fill: C.paper });

// 事实（ep6-script.md：斯坦悼文 2018 / A Close Call 2019）：考完以后，导师斯坦“as gently and diplomatically as possible”
//   告诉他：这次的表现让人失望，他得把数学基础打扎实。他自己的看法：这是头一回在真心想考好的考试上考砸。
//   他 2018 年写道：“This turned out to be exactly what I needed to hear; I got motivated to actually work properly
//   so as not to disappoint my advisor again.”
// 演绎：导师的话是旁白转述，所以画成两张小卡片，不做成对白气泡；斯坦只是“导师”，不画成本人的样子（打领带的老教授）。
//   长大的陶哲轩手里那张纸只代表“他写的文章”，不写标题。最后的楼梯是比喻（“聪明”的台阶到这里断了，上面一级是“用功”）。
// 开场 = 上一场结尾（只剩停靠的 18 岁印章）；结尾全部清掉，印章也收掉（第 30 场在角落重新盖 18 岁）。
(() => {
  const FL = 770, DUR = 41.3;
  /* ---------------- 布景 ---------------- */
  const DESK = { x0: 640, x1: 960, top: 600 };
  const TCH = { x: 540, seat: 655 }, SCH = { x: 1060, seat: 650 };        // Terry's chair (back on his left), the teacher's (back on his right)
  const SHELF = { x0: 1090, x1: 1370, y0: 120, y1: 330 };
  const TAO_X = 175;
  /* ---------------- 时间（场景内） ---------------- */
  const SET0 = 0.3, T_IN = 0.55, S_WALK = [1.2, 2.9], S_SIT = 3.0, GENTLE = 4.6;
  const CARD = [7.7, 11.0], DOWN = 8.3, SAD = 11.5, CARD_OUT = 14.6;
  const CLOUD0 = 15.0, OWN0 = 15.6, X0 = 18.4, CLOUD1 = 19.8;
  const A_WALK = [19.9, 21.0], WROTE0 = 21.0, LIFT = [23.0, 24.4], FIST = 28.7, NOTE1 = 32.0;
  const PAN0 = 32.35, PAN_D = 0.55, T_WALK = [32.95, 33.5];
  const HOPS = [33.75, 34.35, 34.95, 35.55], WORK0 = 36.7, EDGE = [36.75, 37.0], TEETER = [37.0, 37.7], BACK = 37.75, LB0 = 37.9, BAND0 = 38.4;
  const PAN1 = 40.55, PAN1_D = 0.5;

  /* ---------------- helpers ---------------- */
  const box = (x0, y0, x1, y1) => [[x0, y0], [x1, y0, 1], [x1, y1, 1], [x0, y1, 1], [x0, y0, 1]];
  const inP = (t, t0, d = 0.35) => EASE.out(clamp((t - t0) / d));
  const outP = (t, t1, d = 0.3) => 1 - clamp((t - (t1 - d)) / d);
  const faded = (op, fn) => {
    if (op <= 0.003) return;
    const n0 = DL.items.length; fn();
    if (op < 1) for (let i = n0; i < DL.items.length; i++) { const a = DL.items[i].attrs; a.opacity = +((a.opacity ?? 1) * op).toFixed(3); }
  };
  const hop = (t0, d, a, b, h) => t => { const u = clamp((t - t0) / d); return [lerp(a[0], b[0], u), lerp(a[1], b[1], u) - h * 4 * u * (1 - u)]; };
  const PANW = 1700;
  const officeX = t => -PANW * EASE.io(clamp((t - PAN0) / PAN_D));                   // the office slides out to the left …
  const stairX = t => t < PAN1 ? PANW * (1 - EASE.io(clamp((t - PAN0) / PAN_D)))     // … the staircase slides in from the right,
    : -PANW * EASE.io(clamp((t - PAN1) / PAN1_D));                                 // and out to the left at the end

  COMP.b6_sFade = {
    init(fx) { const c = COMP[fx.of.type]; if (c.init) c.init(fx.of); return fx; },
    draw(fx, t, F) { faded(fx.out === undefined ? 1 : 1 - clamp((t - fx.out) / (fx.fd || 0.3)), () => COMP[fx.of.type].draw(fx.of, t, F)); },
    cues: fx => { const c = COMP[fx.of.type]; return c.cues ? c.cues(fx.of) : []; },
  };
  COMP.b6_sTxt = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const lt = t - fx.t0, op = outP(t, fx.t1, 0.25) * clamp(lt / 0.08);
      text(fx.id, fx.text, fx.x, fx.y, { size: fx.size || 40, color: fx.color === 'ink' ? C.ink : C.red, z: fx.z ?? Z.annot, rot: fx.rot || 0, scale: lerp(0.5, 1, EASE.back(clamp(lt / 0.22))), opacity: op, halo: 8 });
    },
    cues: fx => [[fx.t0, fx.sfx || 'pop']],
  };

  /* ---------------- 办公室：书架、书桌、两把椅子（转场时整体往左滑走） ---------------- */
  COMP.b6_sOffice = {
    draw(fx, t) {
      if (t < SET0 || t >= PAN0 + PAN_D) return;
      const k = 'b6s.of', ox = officeX(t);
      DL.save(); DL.translate(ox, 0);
      // bookshelf on the back wall
      { const { x0, x1, y0, y1 } = SHELF, p = inP(t, SET0, 0.45), z = Z.set;
        stroke(k + '.sh', box(x0, y0, x1, y1), { z, w: 5, fill: C.paper, draw: stag(p, 0, 3) });
        [190, 260].forEach((y, i) => stroke(k + '.shL' + i, [[x0 + 4, y], [x1 - 4, y + 1]], { z: z + 0.1, w: 4, draw: stag(p, 1, 3) }));
        if (p > 0.7) {
          const rows = [[y0, 190], [190, 260], [260, y1]];
          rows.forEach(([a, b], r) => {
            let x = x0 + 14 + r * 9;
            for (let i = 0; x < x1 - 40; i++) {
              const bw = 16 + ((i * 7 + r * 5) % 4) * 5, bh = (b - a) - 10 - ((i * 5 + r * 3) % 3) * 9;
              if ((i + r) % 5 === 3) { stroke(`${k}.bk${r}.${i}`, [[x, b - 2], [x + bh * 0.42, b - 2 - bh * 0.9, 1], [x + bh * 0.42 + bw, b - 2 - bh * 0.9 + 6, 1], [x + bw, b - 2, 1]], { z: z + 0.2, w: 3, fill: C.paper }); x += bw + bh * 0.42 + 6; continue; }
              stroke(`${k}.bk${r}.${i}`, box(x, b - 2 - bh, x + bw, b - 2), { z: z + 0.2, w: 3, fill: C.paper });
              x += bw + 3;
            }
          });
        }
      }
      // desk (side view) with a few papers on it
      { const { x0, x1, top } = DESK, p = inP(t, SET0 + 0.1, 0.4), z = Z.desk;
        stroke(k + '.dk', superPts((x0 + x1) / 2, top + 9, x1 - x0, 18, 18, 7), { z, w: 5, closed: true, fill: C.paper, draw: stag(p, 0, 2) });
        stroke(k + '.dkL', [[x0 + 22, top + 18], [x0 + 20, FL]], { z, w: 5, draw: stag(p, 1, 2) });
        stroke(k + '.dkR', [[x1 - 22, top + 18], [x1 - 20, FL]], { z, w: 5, draw: stag(p, 1, 2) });
        if (p > 0.8) {

          [0, 1, 2].forEach(i => stroke(k + '.pp' + i, [[760 + i * 4, top - 2 - i * 4], [850 - i * 3, top - 2 - i * 4 + 1]], { z: z + 0.1, w: 3 }));
        }
      }
      // chairs
      [[TCH, -1], [SCH, 1]].forEach(([c, s], i) => {
        const p = inP(t, SET0 + 0.2, 0.35), z = Z.chair, kk = k + '.ch' + i;
        stroke(kk + '.s', superPts(c.x, c.seat + 8, 96, 14, 14, 6), { z, w: 5, closed: true, fill: C.paper, draw: stag(p, 0, 3) });
        stroke(kk + '.b', [[c.x + s * 44, c.seat + 4], [c.x + s * 50, c.seat - 112]], { z, w: 5, draw: stag(p, 1, 3) });
        stroke(kk + '.b2', superPts(c.x + s * 49, c.seat - 88, 14, 50, 12, 6), { z, w: 4.5, closed: true, fill: C.paper, draw: stag(p, 1, 3) });
        stroke(kk + '.l1', [[c.x - 40, c.seat + 14], [c.x - 44, FL]], { z, w: 5, draw: stag(p, 2, 3) });
        stroke(kk + '.l2', [[c.x + 40, c.seat + 14], [c.x + 44, FL]], { z, w: 5, draw: stag(p, 2, 3) });
      });
      DL.restore();
    },
    cues: () => [[SET0, 'paper'], [PAN0, 'whoosh']],
  };

  /* ---------------- 两张小卡片：转述导师的话（不是对白气泡） ---------------- */
  const CARDS = [{ s: '表现：让人失望', y: 290 }, { s: '基础：要打扎实', y: 383 }];
  COMP.b6_sCards = {
    draw(fx, t) {
      CARDS.forEach((c, i) => {
        if (t < CARD[i] || t >= CARD_OUT) return;
        const lt = t - CARD[i], pp = EASE.back(clamp(lt / 0.25)), w = textWidth(c.s, 40) + 36, x = 800, kk = 'b6s.cd' + i;
        faded(outP(t, CARD_OUT), () => {
          DL.save(); DL.about(x, c.y, () => { DL.scale(lerp(0.4, 1, pp)); DL.rotate(i ? 1.5 : -1.5); });
          stroke(kk + '.sh', [[x - w / 2 + 10, c.y + 40], [x + w / 2 + 6, c.y + 39, 1], [x + w / 2 + 6, c.y - 26]], { z: Z.annot - 1.1, w: 2.4, color: C.pencil, opacity: 0.7, boil: 0.5 });
          stroke(kk, box(x - w / 2, c.y - 33, x + w / 2, c.y + 33), { z: Z.annot - 1, w: 4.5, fill: C.paper });
          text(kk + '.t', c.s, x, c.y + 1, { size: 40, z: Z.annot - 0.9 });
          DL.restore();
        });

    },
    cues: () => CARD.map(c => [c, 'paper']),

  /** inside the thought cloud: "the exam he really wanted to do well in", with a small red ✗ */
  const EX = { c: [420, 228], w: 320, h: 150 };
  COMP.b6_sExam = {
    draw(fx, t) {
      if (t < CLOUD0 + 0.25 || t >= CLOUD1) return;
      const op = clamp((t - CLOUD0 - 0.25) / 0.2) * outP(t, CLOUD1), { c, w, h } = EX, k = 'b6s.ex', z = Z.fx + 1;
      faded(op, () => {
        stroke(k, box(c[0] - w / 2, c[1] - h / 2, c[0] + w / 2, c[1] + h / 2), { z, w: 4, fill: C.paper });
        text(k + '.t', '真心想考好的考试', c[0], c[1] - h / 2 + 32, { size: 36, z: z + 0.1 });
        [0, 1, 2].forEach(r => { const pts = [], y = c[1] + 2 + r * 26, L = r === 2 ? 120 : 190; for (let i = 0; i <= 10; i++) pts.push([c[0] - w / 2 + 28 + L * i / 10, y + (i % 2 ? -4 : 3)]); stroke(k + '.l' + r, pts, { z: z + 0.1, w: 2.6, boil: 0.6 }); });
        const xp = clamp((t - X0) / 0.16), xq = clamp((t - X0 - 0.18) / 0.16), m = [c[0] + w / 2 - 52, c[1] + 34];
        if (xp > 0) stroke(k + '.x1', [[m[0] - 24, m[1] - 24], [m[0] + 24, m[1] + 24]], { z: Z.annot, w: 7, color: C.red, draw: xp });
        if (xq > 0) stroke(k + '.x2', [[m[0] + 24, m[1] - 24], [m[0] - 24, m[1] + 24]], { z: Z.annot, w: 7, color: C.red, draw: xq });
      });
    },
    cues: () => [[X0, 'pen'], [X0 + 0.18, 'pen']],
  };
  /** the article the grown-up Tao holds (no title: only "something he wrote") */
  COMP.b6_sPaper = {
    draw(fx, t, F) {
      if (t < A_WALK[0]) return;
      const a = F.anchors.taoA; if (!a) return;
      const h = a.handR, c = [h[0] + 44, h[1] - 72], k = 'b6s.pa', z = Z.front + 1;
      DL.save(); DL.about(c[0], c[1], () => DL.rotate(4));
      stroke(k, box(c[0] - 55, c[1] - 72, c[0] + 55, c[1] + 72), { z, w: 4, fill: C.paper });
      for (let r = 0; r < 6; r++) { const pts = [], y = c[1] - 48 + r * 20, L = r === 5 ? 50 : 82; for (let i = 0; i <= 8; i++) pts.push([c[0] - 42 + L * i / 8, y + (i % 2 ? -3 : 2)]); stroke(k + '.l' + r, pts, { z: z + 0.1, w: 2.4, boil: 0.6 }); }
      DL.restore();
    },
  };

  /** two little motion lines under the fist pump */
  COMP.b6_sPump = {
    draw(fx, t, F) {
      const lt = t - FIST - 0.05; if (lt < 0 || lt > 0.95) return;
      const a = F.anchors.terry; if (!a) return;
      const h = a.handR, op = 1 - clamp((lt - 0.6) / 0.35), p = EASE.out(clamp(lt / 0.15));
      [[-12, 0], [14, 6]].forEach(([dx, dy], i) => stroke('b6s.pump' + i, [[h[0] + dx, h[1] + 24 + dy], [h[0] + dx + 3, h[1] + 42 + dy], [h[0] + dx, h[1] + 58 + dy]], { z: Z.fx, w: 3, draw: p, opacity: op, boil: 0.6 }));
    },
  };

  /* ---------------- 楼梯：“聪明”的台阶到这里断了，上面一级是“用功”（比喻） ---------------- */
  const ST = [{ x0: 240, x1: 390, y: 700 }, { x0: 390, x1: 540, y: 630 }, { x0: 540, x1: 690, y: 560 }, { x0: 690, x1: 860, y: 490 }];
  const WORK = { x0: 1140, x1: 1400, y: 350 };
  const STAND = [[315, 700], [465, 630], [615, 560], [780, 490]];
  COMP.b6_sStairs = {
    draw(fx, t) {
      if (t < PAN0 || t >= PAN1 + PAN1_D) return;
      const k = 'b6s.st', z = Z.set + 1, sx = stairX(t);
      DL.save(); DL.translate(sx, 0);
      stroke(k + '.fl', [[60, FL], [1560, FL + 1]], { z: Z.set, w: 2.2, color: C.pencil, opacity: 0.8 });
      const prof = [[ST[0].x0, FL]]; ST.forEach(s => prof.push([s.x0, s.y, 1], [s.x1, s.y, 1])); prof.push([ST[3].x1, FL, 1]);
      stroke(k, prof, { z, w: 5, fill: C.paper });
      ST.forEach((s, i) => {
        if (i) stroke(k + '.v' + i, [[s.x0, s.y + 4], [s.x0, FL - 2]], { z: z + 0.1, w: 3, color: C.pencil });
        text(k + '.t' + i, '聪明', (s.x0 + s.x1) / 2, s.y + 38, { size: 40, z: z + 0.2 });
      });
      // the broken edge: a few pencil cracks where the "smart" stairs stop
      [[0, 0], [1, 1]].forEach(([j]) => stroke(k + '.cr' + j, [[ST[3].x1 - 2, ST[3].y + 30 + j * 70], [ST[3].x1 + 12, ST[3].y + 44 + j * 70], [ST[3].x1 + 2, ST[3].y + 58 + j * 70]], { z: z + 0.1, w: 3, color: C.pencil }));
      if (t >= WORK0) {
        const p = inP(t, WORK0, 0.4), { x0, x1, y } = WORK;
        stroke(k + '.w', [[x0, FL], [x0, y, 1], [x1, y, 1], [x1, FL, 1]], { z, w: 5, fill: C.paper, draw: p });
        if (p > 0.6) text(k + '.wt', '用功', (x0 + x1) / 2, y + 46, { size: 48, z: z + 0.2, opacity: clamp((p - 0.6) / 0.3) });
        const bp = EASE.out(clamp((t - BAND0) / 0.35));
        if (bp > 0) {
          const bx0 = (x0 + x1) / 2 - 64, bx1 = lerp(bx0, (x0 + x1) / 2 + 64, bp), y0 = y + 22, y1 = y + 72, top = [], bot = [];
          for (let i = 0; i <= 8; i++) { const xx = lerp(bx0, bx1, i / 8); top.push([xx, y0 + Math.sin(i * 1.7) * 3]); bot.unshift([xx, y1 + Math.sin(i * 2.3) * 4]); }
          stroke(k + '.band', top.concat(bot), { z: Z.hi, closed: true, fill: C.hi, noStroke: true, opacity: 0.85, blend: true, boil: 0.4, w: 1 });
        }
      }
      if (t >= LB0) {
        const lt = t - LB0, sc = lerp(0.5, 1, EASE.back(clamp(lt / 0.22))), op = clamp(lt / 0.08), cx = (ST[3].x1 + WORK.x0) / 2;
        text(k + '.lb0', '光靠聪明，', cx + 10, 606, { size: 44, color: C.red, z: Z.annot, rot: -3, scale: sc, opacity: op, halo: 8 });
        text(k + '.lb1', '不够用了', cx, 662, { size: 44, color: C.red, z: Z.annot, rot: -3, scale: sc, opacity: op, halo: 8 });
      }
      DL.restore();
    },
    cues: () => [[WORK0, 'paper'], [LB0, 'pen'], [BAND0, 'swish'], [PAN1, 'whoosh']],
  };

  /* ---------------- poses / faces ---------------- */
  const hipT = (dx, dy) => ({ w: 1, to: 'hip', dx, dy, bend: 'out' });
  const SITL = { sit: 1, legScale: 1.12, thigh: 0.24, legL: [66, -60], legR: [66, -60] };
  Object.assign(POSE, {
    b6_sSit: { ...SITL, ikL: hipT(-30, 16), ikR: { w: 1, to: 'desk', dx: 0, dy: -2, bend: 'down' } },
    b6_sDown: { ...SITL, tilt: 11, lean: 4, ikL: hipT(-30, 16), ikR: { w: 1, to: 'desk', dx: -6, dy: -2, bend: 'down' } },
    b6_sSad: { ...SITL, tilt: 16, lean: 6, ikL: hipT(-28, 18), ikR: hipT(28, 18) },
    b6_sFist: { ...SITL, tilt: -2, armScale: 1.3, ikL: hipT(-34, 40), armR: [65, 88], ikR: { w: 0 } },     // fist up in front of the chest, elbow down
    b6_sProf: { ...SITL, legScale: 1.05, ikL: { w: 1, to: 'desk', dx: 0, dy: -2, bend: 'down' }, ikR: hipT(30, 16) },
    b6_sHop: { legL: [22, -46], legR: [10, -30], armL: [64, 24], armR: [64, 24], lean: 3 },
    b6_sTeeter: t => ({ lean: -5, tilt: -6, armScale: 1.1, armL: [100 + 45 * Math.sin(t * 15), 25], armR: [100 + 45 * Math.sin(t * 15 + Math.PI), 25] }),
  });
  Object.assign(POSE, {
    b6_sGentle: t => ({ ...POSE.b6_sProf, lean: -9, tilt: -4, armScale: 1.1, armL: [75, 20 + 7 * Math.sin(t * 3)], ikL: { w: 0 } }),
    b6_sNod: t => ({ ...POSE.b6_sFist, tilt: -2 + 9 * Math.max(0, Math.sin((t - FIST - 0.15) * 7)) * (t < FIST + 1.05 ? 1 : 0) }),
  });
  Object.assign(FACE, {
    b6_sSad: { lidL: 0.34, lidR: 0.34, brow: 'line', browL: -18, browR: -18, browY: 0.03, mouth: 'frown', mw: 0.22 },
    b6_sKind: { mouth: 'smile', mw: 0.24, lidL: 0.16, lidR: 0.16, brow: 'line', browL: -8, browR: -8 },
    b6_sGo: { brow: 'line', browL: 14, browR: 14, mouth: 'smile', mw: 0.32 },                       // determined smile
  });
  const taoPos = [[0, [-150, FL]], [A_WALK[0], [TAO_X, FL], A_WALK[1] - A_WALK[0], 'lin'], [PAN0, [TAO_X - PANW, FL], PAN_D, 'io']];
  const taoRead = t => { const x = evalTrack(taoPos, t)[0]; return { ...makeWalk(A_WALK[0], A_WALK[1], 5.2)(t), armL: [14, 8], ikR: { w: 1, to: 'abs', dx: x + 105, dy: 595, bend: 'down' } }; };

  defineScene({
    id: 'stein', chapter: '导师的话', dur: DUR, floor: FL,
    cast: {
      stein: { ...E6.stein, desk: [DESK.x1 - 10, DESK.top - 2] },
      terry: { ...E6.teen, desk: [DESK.x0 + 10, DESK.top - 2] },
      taoA: { ...E6.taoAdult },
    },
    order: ['stein', 'terry', 'taoA'],
    tracks: {
      terry: {
        enter: T_IN,
        pos: [[0, [TCH.x, TCH.seat]], [PAN0, [TCH.x - PANW, TCH.seat], PAN_D, 'io'],
          [T_WALK[0] - 0.02, [-130, FL], 0], [T_WALK[0], [150, FL], T_WALK[1] - T_WALK[0], 'lin'],
          [HOPS[0], hop(HOPS[0], 0.35, [150, FL], STAND[0], 60), 0],
          ...HOPS.slice(1).map((h, i) => [h, hop(h, 0.35, STAND[i], STAND[i + 1], 60), 0]),
          [EDGE[0], [835, ST[3].y], EDGE[1] - EDGE[0], 'io'], [BACK, [795, ST[3].y], 0.25, 'io'],
          [PAN1, [795 - PANW, ST[3].y], PAN1_D, 'io']],
        pose: [[0, 'b6_sSit'], [DOWN, 'b6_sDown', 0.25], [SAD, 'b6_sSad', 0.35],
          [LIFT[0], 'b6_sSit', LIFT[1] - LIFT[0], 'io'], [FIST, 'b6_sNod', 0.14, 'back'], [31.2, 'b6_sSit', 0.3],
          [T_WALK[0] - 0.02, makeWalk(T_WALK[0], T_WALK[1], 5.6), 0],
          ...HOPS.flatMap(h => [[h - 0.1, 'crouch', 0.08], [h, 'b6_sHop', 0.08], [h + 0.35, 'stand', 0.1]]),
          [TEETER[0], 'b6_sTeeter', 0.1], [TEETER[1], 'stand', 0.15], [BACK + 0.3, 'lookUp', 0.2]],
        face: [[0, 'sheepish'], [GENTLE, 'neutral', 0.1], [DOWN, 'sheepish', 0.1], [SAD, 'b6_sSad', 0.3],
          [23.6, 'neutral', 0.3], [24.6, 'focus', 0.15], [FIST, 'b6_sGo', 0.1], [31.3, 'smile', 0.15],
          [T_WALK[0], 'smile', 0], [HOPS[0], 'proud', 0.1], [EDGE[1], 'surprised', 0.06], [BACK + 0.3, 'focus', 0.12]],

    },
    cues: () => [[T.pc, 'pen'], [T.pc + 0.3, 'beep'], [10.4, 'key'], [10.55, 'key'], [10.68, 'key'], [T.off, 'tap'], [T.off + 0.05, 'zip']],
  };

  /* ---------------- ⑤ 书桌：一叠“导师给的题”；他写满一张，就放到右边，纸越堆越高 ---------------- */
  const DK = { x: 800, top: 600, sheet: [822, 577], pile: [968, 598], stack: [640, 598] };
  const PJ = [[0, -2], [5, 1.5], [-3, -1], [6, 2], [-2, -1.5], [3, 1], [-5, -2], [2, 1.5]];
  COMP.c6_dk = {
    draw(fx, t) {

        DL.restore();
      });
    },
    cues: () => [[T.desk + 0.1, 'paper'], ...PAGES.map(p => [p, 'paper']), ...[13.9, 14.3, 14.7, 15.1, 15.5, 15.9, 16.3, 16.7].map(x => [x, 'pen'])],
  };

  /* ---------------- ⑥ 每周见面：墙上的日历一周翻一页 ---------------- */
  const CAL = { x: 250, y: 175, w: 190, h: 210, band: 52 };
  COMP.c6_cal = {
    draw(fx, t) {
      if (t < T.meet || t >= T.p6 + 0.3) return;

        DL.save(); DL.translate(x - w / 2 + 30 * fall, y + band + 260 * fall); DL.rotate(16 * sw + 36 * fall); DL.translate(-(x - w / 2), -(y + band));
        stroke(k + '.old' + j, box(x - w / 2, y + band, x + w / 2, y + h), { z: z2, w: 5, fill: C.paper, opacity: op });

    },

  /* ---------------- ⑥ 文件柜：最上面的抽屉被拉开，里面是一沓沓文件 ---------------- */
  const CAB = { x0: 1315, x1: 1475, y0: 470, dh: 103 };
  const drawerU = t => EASE.out(clamp((t - T.drawer) / 0.22));
  const drawerOff = t => { const u = drawerU(t); return [-18 * u, 22 * u]; };
  const HANDLE = t => { const [ox, oy] = drawerOff(t); return [(CAB.x0 + CAB.x1) / 2 + ox, CAB.y0 + 8 + CAB.dh / 2 - 4 + oy]; };
  const INSIDE = [1352, 490];

      };

  /* ---------------- ⑥ 那篇论文：从抽屉里抽出来，递过去，他翻开就读 ---------------- */
  const HAND = [728, 626], PC6 = [645, 640];
  function paperCenter(t, F) {
    if (t < T.pick) return null;
    const s = F.anchors.stein, b = F.anchors.tMeet;
    if (t < T.give) return s ? [s.handR[0], s.handR[1] - 26] : null;
    if (t < T.take) return s ? [s.handL[0], s.handL[1] - 26] : null;
    if (!b) return null;
    return lerp2([b.handR[0] - 4, b.handR[1] - 26], PC6, EASE.io(clamp((t - T.take - 0.1) / 0.3)));
  }
  COMP.c6_pp = {
    draw(fx, t, F) {
      if (t < T.pick || t >= T.c6 + 0.3) return;
      const c = paperCenter(t, F); if (!c) return;
      const k = 'c6pp', z = Z.front + 1, s = pop(t, T.pick, 0.2), o = EASE.out(clamp((t - T.open) / 0.25)), W = 86 * (1 + o), H = 110;
      DL.save(); DL.about(c[0], c[1], () => DL.scale(s)); DL.translate(c[0], c[1]); DL.rotate(lerp(-4, 0, o));
      stroke(k + '.p', box(-W / 2, -H / 2, W / 2, H / 2), { z, w: 3.5, fill: C.paper });
      const tx = lerp(0, -43, o);
      text(k + '.t', '论文', tx, -H / 2 + 26, { size: 36, z: z + 0.1 });
      for (let i = 0; i < 4; i++) scrib(k + '.l' + i, tx - 32, tx + 32 - (i === 3 ? 22 : 0), -H / 2 + 56 + i * 12, { z: z + 0.1, w: 1.8, amp: 1.2 });
      if (o > 0.4) {
        stroke(k + '.fold', [[0, -H / 2 + 4], [0, H / 2 - 4]], { z: z + 0.1, w: 2, color: C.pencil });
        for (let i = 0; i < 6; i++) scrib(k + '.r' + i, 11, 75 - (i === 5 ? 26 : 0), -H / 2 + 18 + i * 14, { z: z + 0.1, w: 1.8, amp: 1.2, opacity: clamp((o - 0.4) / 0.4) });
      }
      DL.restore();
    },
    cues: () => [[T.pick, 'paper'], [T.take, 'paper'], [T.open, 'paper']],
  };

  /* ---------------- ⑥ 他讲的时候冒出来的小符号；老师想的时候，思考云里一个“…” ---------------- */

  /* ---------------- ⑦ 导师给的第一道题：卡片上一个大“?”；一条长长的时间箭头 ---------------- */
  const CD = { x: 420, y: 395, w: 330, h: 300 }, AR = { x0: 605, x1: 1462, y: 470 };

  COMP.c6_cd = {
    draw(fx, t) {

    cues: () => [[T.card, 'pop'], [T.card + 0.25, 'pen'], [T.arr0, 'zip'], ...TICKS.map(x => [tickT(x), 'tap']), [T.arr1 + 0.05, 'pop'], [T.check, 'ding']],
  };

  /* ---------------- ⑧ 博士帽（落到头上）和证书“1996 博士” ---------------- */
  const DIP = { w: 210, h: 92 };

      }

    cues: () => [[T.grad + 0.1, 'pop'], [T.grad + 0.55, 'plip'], [T.hop, 'tada']],
  };

/* =====================================================================
   PLAYER  — clock, controls, chapters, "think" pauses, narration sync, music
   ===================================================================== */
prepareEpisode();
const $ = id => document.getElementById(id);
const ui = { play: $('btnPlay'), restart: $('btnRestart'), scrub: $('scrub'), time: $('time'), narr: $('btnNarr'), snd: $('btnSnd'), music: $('btnMusic'),
  poster: $('poster'), think: $('think'), chapters: $('chapters'), credits: $('credits') };
const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
};
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; };
const P = { t: 0, playing: false, poster: true, waiting: null, wall0: 0, t0: 0, prev: 0, lastQ: -1, raf: 0, scene: -1, loading: false,
  narr: true, snd: true, music: true };
try { const s = JSON.parse(localStorage.getItem('taoPlayerPrefs') || 'null'); if (s) { P.narr = s.narr !== false; P.snd = s.snd !== false; P.music = s.music !== false; } } catch (e) { /* storage blocked */ }
const savePrefs = () => { try { localStorage.setItem('taoPlayerPrefs', JSON.stringify({ narr: P.narr, snd: P.snd, music: P.music })); } catch (e) { /* ignore */ } };
if (!MUSIC.available()) ui.music.hidden = true;
if (window.TAO_AUDIO && window.TAO_AUDIO.credits) { ui.credits.textContent = window.TAO_AUDIO.credits; ui.credits.hidden = false; }

ui.scrub.max = EP.dur.toFixed(2);
const CHAPS = EP.scenes.filter(sc => sc.chapter).map(sc => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'chap';
  b.innerHTML = `<span></span><span class="ct">${fmt(sc.start)}</span>`; b.firstChild.textContent = sc.chapter;
  b.addEventListener('click', () => { seek(sc.start); play(); });
  li.appendChild(b); ui.chapters.appendChild(li);
  return { sc, b };
});

/** Which music bed plays at global time t, and how far into it (beds restart at the first scene of each run). */
function musicAt(t) {
  const sc = sceneAt(Math.min(t, EP.dur - 1e-6)), key = (EP.music || {})[sc.id] || null;
  let i = sc.index;
  while (i > 0 && (EP.music || {})[EP.scenes[i - 1].id] === key) i--;
  return { key, offset: t - EP.scenes[i].start };
}
function syncMusic(force) {
  if (!P.music || !P.playing) { MUSIC.stop(); return; }
  const m = musicAt(P.t);
  if (m.key && MUSIC.ready(m.key)) MUSIC.set(m.key, m.offset, force);
}

function paint(t, force) {
  const q = Math.floor(t * CFG.FPS + 1e-6);
  if (force || q !== P.lastQ) { render(t); P.lastQ = q; }
}
function syncUI() {
  const t = P.poster ? 0 : P.t;
  ui.scrub.value = t.toFixed(2);
  ui.scrub.setAttribute('aria-valuetext', `${fmt(t)}`);
  ui.time.textContent = P.loading ? '加载声音…' : `${fmt(t)} / ${fmt(EP.dur)}`;
  ui.play.innerHTML = P.playing ? ICON.pause : ICON.play;
  ui.play.setAttribute('aria-label', P.playing ? '暂停' : '播放');
  ui.poster.hidden = !P.poster;
  ui.think.hidden = P.waiting === null || P.playing;
  ui.narr.setAttribute('aria-pressed', String(P.narr));
  ui.snd.setAttribute('aria-pressed', String(P.snd));
  ui.music.setAttribute('aria-pressed', String(P.music));
  let cur = null; for (const c of CHAPS) if (t >= c.sc.start - 1e-6) cur = c;
  CHAPS.forEach(c => c.b.setAttribute('aria-current', String(c === cur && !P.poster)));
}
function fireCues(a, b) {
  for (const c of EP.cues) {
    if (c.t <= a) continue; if (c.t > b) break;
    if (c.sfx && P.snd) SFX.play(c.sfx);
    if (c.say && P.narr) NARR.say(c);
  }
}
/** after a seek, pick up the line that is being spoken at t */
function resumeVoice(t) {
  if (!P.narr) return;
  let last = null; for (const c of EP.cues) { if (c.t > t) break; if (c.say) last = c; }
  if (last && t - last.t > 0.05) NARR.say(last, t - last.t);
}
function tick(now) {
  if (!P.playing) return;
  let t = P.t0 + (now - P.wall0) / 1000;
  // hold the picture while the voice finishes, instead of letting lines pile up
  const talking = P.narr && NARR.busy();
  if (talking) {
    const nx = EP.syncs.find(x => x > P.prev + 1e-4 && x <= t);
    if (nx !== undefined) { t = Math.max(P.prev, nx - 1e-3); P.t0 = t; P.wall0 = now; }
  }
  MUSIC.duck(talking);
  // "轮到你了" pauses: stop and wait for the child
  const pp = EP.pauses.find(x => x > P.prev && x <= t);
  if (pp !== undefined) t = pp;
  if (t >= EP.dur) t = EP.dur;
  fireCues(P.prev, t); P.prev = t; P.t = t;
  paint(t);
  const si = sceneAt(Math.min(t, EP.dur - 1e-6)).index;
  if (si !== P.scene) { P.scene = si; syncMusic(false); }
  else if (P.music && !MUSIC.current()) syncMusic(false); // bed finished decoding after play started
  if (pp !== undefined) {
    P.playing = false; P.waiting = pp;
    if (P.music && EP.think && MUSIC.ready(EP.think)) MUSIC.set(EP.think, 0, true); else MUSIC.stop();
    syncUI(); return;
  }
  if (t >= EP.dur) { P.playing = false; MUSIC.stop(1.5); syncUI(); return; }
  syncUI();
  P.raf = requestAnimationFrame(tick);
}
async function play() {
  if (P.loading) return;
  const resume = P.waiting !== null;
  if (P.poster || P.t >= EP.dur - 1e-3) P.t = 0;
  P.poster = false; P.waiting = null;
  SFX.unlock();
  if (!resume) NARR.cancel();
  if (P.narr) NARR.prime();
  // first play: decode the narration (quick) before the clock starts; music decodes alongside and joins when ready
  const voiceReady = NARR.load();
  MUSIC.load();
  if (voiceReady) { P.loading = true; paint(P.t, true); syncUI(); await voiceReady; P.loading = false; }
  P.playing = true;
  P.t0 = P.t; P.prev = resume ? P.t : P.t - 1e-4; P.wall0 = performance.now();
  if (!resume) resumeVoice(P.t);
  P.scene = sceneAt(Math.min(P.t, EP.dur - 1e-6)).index;
  syncMusic(true);
  cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick);
  paint(P.t, true); syncUI();
}
function pause() { P.playing = false; cancelAnimationFrame(P.raf); NARR.cancel(); MUSIC.stop(); syncUI(); }
function toggle() { P.playing ? pause() : play(); }
function seek(t) {
  pause(); P.poster = false; P.waiting = null;
  P.t = clamp(+t || 0, 0, EP.dur);
  paint(P.t, true); syncUI();
}
ui.play.addEventListener('click', toggle);
ui.poster.addEventListener('click', play);
ui.think.addEventListener('click', play);
ui.restart.addEventListener('click', () => { seek(0); play(); });
ui.scrub.addEventListener('input', () => seek(+ui.scrub.value));
ui.narr.addEventListener('click', () => { P.narr = !P.narr; if (!P.narr) NARR.cancel(); savePrefs(); syncUI(); });
ui.snd.addEventListener('click', () => { P.snd = !P.snd; if (P.snd) SFX.unlock(); savePrefs(); syncUI(); });
ui.music.addEventListener('click', () => { P.music = !P.music; SFX.unlock(); MUSIC.load(); syncMusic(true); savePrefs(); syncUI(); });
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  const tag = e.target && e.target.tagName;
  if (tag === 'BUTTON' || tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'range')) return;
  e.preventDefault(); toggle();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.playing) pause(); });

// reduced motion: no line boil (holds become perfectly still)
try {
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  RM.reduce = mq.matches;
  const onMQ = () => { RM.reduce = mq.matches; paint(P.poster ? EP.poster : P.t, true); };
  mq.addEventListener ? mq.addEventListener('change', onMQ) : mq.addListener(onMQ);
} catch (e) { /* ignore */ }

// test/automation hooks
window.render = render;
window.__duration = EP.dur;
window.__scenes = EP.scenes.map(s => ({ id: s.id, chapter: s.chapter || null, start: +s.start.toFixed(3), dur: s.dur }));
window.__seek = t => { seek(t); render(P.t); P.lastQ = Math.floor(P.t * CFG.FPS + 1e-6); };
window.__audio = () => ({ ctx: AUD.ctx && AUD.ctx.state, music: MUSIC.current(), talking: NARR.busy(), t: P.t, playing: P.playing, waiting: P.waiting });

paint(Math.min(EP.poster, EP.dur), true); syncUI();
