<script>
'use strict';
/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = {
  W: 1600, H: 900, FPS: 24,
  BOIL_FPS: 5, BOIL_AMP: 1.1, WOBBLE: 1.4,
  FLOOR: 780,
  C: { paper: '#FBF8F1', ink: '#1E1E1E', red: '#D23A3F', pencil: '#9B9B9B', hi: '#FFE066' },
  FONT_ZH: "'ZCOOL KuaiLe','Patrick Hand',sans-serif",
  FONT_MIX: "'Patrick Hand','ZCOOL KuaiLe',sans-serif",
  FONT_MONO: "'VT323','Courier New',monospace", MONO_ADV: 0.4,
  SIZE: { sub: 52, label: 40, speech: 84, mark: 84, series: 32 },
};
const C = CFG.C;
// draw-order layers
const Z = { set: 10, hi: 12, board: 14, shadow: 18, chair: 20, back: 28, body: 30, desk: 35, front: 40, fx: 50, annot: 60, stamp: 70, sub: 90 };
const RAD = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
const EASE = {
  lin: u => u,
  io: u => u * u * (3 - 2 * u),
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  back: u => { const c = 2.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};

/* =====================================================================
   NOISE / BOIL  (deterministic: static wobble per key + boil per floor(t*BOIL_FPS))
   ===================================================================== */
const HCACHE = new Map();
function hstr(s) {
  let h = HCACHE.get(s); if (h !== undefined) return h;
  h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0; HCACHE.set(s, h); return h;
}
function rnd(a, b, c) { // -> [-1, 1)
  let t = (a ^ Math.imul(b + 1, 0x9E3779B1) ^ Math.imul(c + 7, 0x85EBCA77)) >>> 0;
  t = (t + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1;
}
const BOIL = { frame: 0, amp: CFG.BOIL_AMP };
function jit(h, i, p, amp) {
  const w = CFG.WOBBLE * 0.5, b = BOIL.amp * amp, f = BOIL.frame * 2 + 1000;
  return [p[0] + rnd(h, i, 1) * w + (b ? rnd(h, i, f) * b : 0),
          p[1] + rnd(h, i, 2) * w + (b ? rnd(h, i, f + 1) * b : 0)];
}

/* =====================================================================
   DRAW LIST  (flat, keyed items; affine matrix stack; reconciled into SVG)
   ===================================================================== */
const DL = {
  items: [], m: [1, 0, 0, 1, 0, 0], st: [], used: new Map(), zoff: 0,
  reset() { this.items.length = 0; this.m = [1, 0, 0, 1, 0, 0]; this.st.length = 0; this.used.clear(); this.zoff = 0; },
  save() { this.st.push(this.m.slice()); },
  restore() { this.m = this.st.pop(); },
  mul(n) {
    const [a, b, c, d, e, f] = this.m, [A, B, Cc, D, E, F] = n;
    this.m = [a * A + c * B, b * A + d * B, a * Cc + c * D, b * Cc + d * D, a * E + c * F + e, b * E + d * F + f];
  },
  translate(x, y) { this.mul([1, 0, 0, 1, x, y]); },
  scale(sx, sy = sx) { this.mul([sx, 0, 0, sy, 0, 0]); },
  rotate(deg) { const r = deg * RAD, c = Math.cos(r), s = Math.sin(r); this.mul([c, s, -s, c, 0, 0]); },
  about(x, y, fn) { this.translate(x, y); fn(); this.translate(-x, -y); },
  tp(p) { const m = this.m; return [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]]; },
  k() { const m = this.m; return Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])); },
  add(z, key, tag, attrs, text) {
    const n = this.used.get(key) || 0; this.used.set(key, n + 1);
    if (n) key += '#' + n;
    this.items.push({ z: z + this.zoff, key, tag, attrs, text, o: this.items.length });
  },
};

/* =====================================================================
   DRAWING PRIMITIVES
   ===================================================================== */
const f1 = v => Math.round(v * 10) / 10;
function catRun(R) {
  const n = R.length; let d = '';
  if (n === 2) return `L${f1(R[1][0])} ${f1(R[1][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = R[Math.max(i - 1, 0)], p1 = R[i], p2 = R[i + 1], p3 = R[Math.min(i + 2, n - 1)];
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
}
function smoothD(P, corners, closed) {
  let d = `M${f1(P[0][0])} ${f1(P[0][1])}`;
  if (closed) {
    const n = P.length;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
    }
    return d + 'Z';
  }
  let s = 0;
  for (let i = 1; i < P.length; i++) {
    if (i === P.length - 1 || corners[i]) { d += catRun(P.slice(s, i + 1)); s = i; }
  }
  return d;
}
/** A hand-drawn stroke through local points (3rd element truthy = sharp corner).
 *  o: {z, w, color, fill, closed, draw(0..1), boil(scale), opacity, bow, noStroke, blend} */
function stroke(key, pts, o = {}) {
  if (o.draw !== undefined && o.draw <= 0.002) return;
  if (!pts || pts.length < 2) return;
  const h = hstr(key);
  let P = pts, corners = pts.map(p => !!p[2]);
  if (P.length === 2 && !o.closed) {
    const a = P[0], b = P[1], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const bow = rnd(h, 99, 5) * Math.min(3, len * 0.03) * (o.bow ?? 1);
    P = [a, [(a[0] + b[0]) / 2 - (b[1] - a[1]) / len * bow, (a[1] + b[1]) / 2 + (b[0] - a[0]) / len * bow], b];
    corners = [false, false, false];
  }
  const amp = o.boil ?? 1;
  const W = P.map((p, i) => jit(h, i, DL.tp(p), amp));
  const a = {
    d: smoothD(W, corners, o.closed), fill: o.fill || 'none',
    stroke: o.noStroke ? 'none' : (o.color || C.ink),
    'stroke-width': +((o.w || 6) * DL.k()).toFixed(2),
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.draw !== undefined && o.draw < 1) {
    a.pathLength = 1; a['stroke-dasharray'] = '1 2'; a['stroke-dashoffset'] = +(1 - o.draw).toFixed(4);
    if (a.fill !== 'none') a['fill-opacity'] = o.draw > 0.6 ? 1 : 0;
  }
  if (o.blend) a.style = 'mix-blend-mode:multiply';
  DL.add(o.z ?? Z.body, key, 'path', a);
}
/** Points on a lumpy ring. a0/sweep in degrees; rv = radius variation. */
function ringPts(key, cx, cy, rx, ry, o = {}) {
  const n = o.n || 12, a0 = (o.a0 ?? -120) * RAD, sweep = (o.sweep ?? 360) * RAD, rv = o.rv ?? 0.03;
  const h = hstr(key + '~r'), pts = [], closed = !!o.closed;
  const cnt = closed ? n : n + 1;
  for (let i = 0; i < cnt; i++) {
    const a = a0 + sweep * i / n;
    let rr = 1 + rnd(h, i % n, 3) * rv;
    if (!closed && i === cnt - 1) rr *= 0.965; // Orlin's closing tick
    pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
  }
  return pts;
}
function superPts(cx, cy, w, h, n = 20, ex = 5) { // rounded-rect-ish superellipse
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    pts.push([cx + Math.sign(c) * Math.pow(Math.abs(c), 2 / ex) * w / 2, cy + Math.sign(s) * Math.pow(Math.abs(s), 2 / ex) * h / 2]);
  }
  return pts;
}
function dot(key, p, r, color = C.ink, z = Z.front) {
  const q = DL.tp(p), k = DL.k();
  DL.add(z, key, 'circle', { cx: f1(q[0]), cy: f1(q[1]), r: +(r * k).toFixed(2), fill: color });
}
function text(key, str, x, y, o = {}) {
  const m = DL.m;
  let tf = `matrix(${m.map(v => +v.toFixed(4)).join(' ')}) translate(${f1(x)} ${f1(y)})`;
  if (o.rot) tf += ` rotate(${o.rot})`;
  if (o.scale !== undefined && o.scale !== 1) tf += ` scale(${+o.scale.toFixed(4)})`;
  const a = { transform: tf, x: 0, y: 0, 'font-size': o.size || 40, 'font-family': o.font || CFG.FONT_ZH,
    fill: o.color || C.ink, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central', style: 'white-space:pre' };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.halo) { a.stroke = C.paper; a['stroke-width'] = o.halo; a['stroke-linejoin'] = 'round'; a['paint-order'] = 'stroke'; }
  DL.add(o.z ?? Z.annot, key, 'text', a, str);
}
/** Rough rendered width. CJK = 1 em; Latin ≈ 0.5 em (space 0.3); in the monospace code font every Latin char = MONO_ADV em. */
function textWidth(str, size, font) {
  const mono = font === CFG.FONT_MONO;
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0x2E80 ? size : (mono ? CFG.MONO_ADV : ch === ' ' ? 0.3 : 0.5) * size;
  return w;
}
/** Pencil-scribble ground shadow. */
function shadow(key, cx, cy, w, op = 1) {
  if (op <= 0.02) return;
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) {
    const u = i / n, amp = 6 * Math.sqrt(Math.max(0, 1 - Math.pow(2 * u - 1, 2))) + 1.5;
    pts.push([cx - w / 2 + w * u, cy + (i % 2 ? amp : -amp)]);
  }
  stroke(key, pts, { z: Z.shadow, w: 2.2, color: C.pencil, opacity: 0.75 * op, boil: 0.6 });
}
/** Curved arrow with a two-stroke head; draws on with p. */
function arrow(key, from, to, o = {}) {
  const p = o.p ?? 1; if (p <= 0) return;
  const len = dist(from, to) || 1, bend = (o.bend ?? 0.18) * len;
  const nx = -(to[1] - from[1]) / len, ny = (to[0] - from[0]) / len;
  const c = [(from[0] + to[0]) / 2 + nx * bend, (from[1] + to[1]) / 2 + ny * bend];
  const q = u => [(1 - u) * (1 - u) * from[0] + 2 * (1 - u) * u * c[0] + u * u * to[0], (1 - u) * (1 - u) * from[1] + 2 * (1 - u) * u * c[1] + u * u * to[1]];
  const pts = []; for (let i = 0; i <= 6; i++) pts.push(q(i / 6));
  const col = o.color || C.red, w = o.w || 3.5, z = o.z ?? Z.annot;
  stroke(key, pts, { z, w, color: col, draw: p, boil: 0.8 });

        const a = (-160 + i * 23.3) * RAD, L = s * (0.2 + 0.05 * Math.sin(t * 9 + i * 1.7));
        const r0 = R * 1.3;
        stroke(k + '.ray' + i, [[Math.cos(a) * r0, cy + Math.sin(a) * r0], [Math.cos(a) * (r0 + L), cy + Math.sin(a) * (r0 + L)]], { z, w: 4, draw: EASE.out(clamp((t - sT) / 0.15)) });
      }
    }
    DL.restore();
    F.targets[k + '.bulb'] = [base[0], base[1] + cy * pop];
  },
  cues: fx => {
    const c = [[fx.t0, 'pop']]; let prev = null;
    (fx.state || []).forEach(([t, v]) => { if (v === 'on' && prev !== 'on') c.push([t, 'ding']); if (v === 'dead' && prev !== 'dead') c.push([t, 'thud']); prev = v; });
    return c;
  },
};

/* ---------------- 骨牌棋盘 ----------------
 * { type: 'e3_board', id, at: [cx, cy] | pos: 轨道, scale: 数 | 轨道, n: 4, cell: 96, t0, drawDur: 0.5,
 *   cut: t | null            剪掉两个对角（(0,0) 和 (n-1,n-1)）的时间；t0 之前就剪好写负数；null = 完整棋盘
 *   color: t | null          开始涂黑白的时间（黑格 = (r+c) 为偶数，所以被剪掉的两个角都是黑的）
 *   colorDur: 1.2            把所有黑格涂完用的时间
 *   attempts: [{ t0, step: 0.32, dom: [[r, c, 'h'|'v'], …], fail: t, t1 }]
 *       一次"摆骨牌"：从 t0 起每隔 step 秒放一块；fail 时把没盖住的格子用红圈圈出来；t1 时整组撤掉（不写 = 一直留着）
 *       t0 为负数 = 切进来时已经摆好。
 *   rings: [{ cells: [[r,c],…], t0, t1 }]   额外的红圈（例如只圈某一块骨牌的两格）
 *   attempt 的 outDur（默认 0.3）：t1 之后骨牌撤掉用多久；domColor: "pencil" + domW: 0.6 画浅一点的骨牌（缩略图用）；ringW: 红圈线宽倍数
 *   hideLeft: true           不自动圈出剩下的格子
 * }
 * 发布命名点：'<id>.c<r>_<c>'（每个格子的中心，世界坐标）、'<id>.center'、'<id>.top'、'<id>.bottom'。 */
const E3B = {
  black: (r, c) => (r + c) % 2 === 0,
  cells(n, cut) { const out = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!(cut && ((r === 0 && c === 0) || (r === n - 1 && c === n - 1)))) out.push([r, c]); return out; },
  domCells: ([r, c, d]) => d === 'h' ? [[r, c], [r, c + 1]] : [[r, c], [r + 1, c]],
};
COMP.e3_board = {
  init(fx) {
    fx.n = fx.n || 4; fx.cell = fx.cell || 96;
    // sanity: every attempt's dominoes must sit on the cut board, without overlaps
    (fx.attempts || []).forEach((a, ai) => {
      const seen = new Set();
      a.dom.forEach(d => E3B.domCells(d).forEach(([r, c]) => {
        const key = r + '_' + c, cutCell = fx.cut !== null && fx.cut !== undefined && ((r === 0 && c === 0) || (r === fx.n - 1 && c === fx.n - 1));
        if (r < 0 || c < 0 || r >= fx.n || c >= fx.n || cutCell || seen.has(key)) console.error('e3_board: bad domino in attempt', ai, d);
        seen.add(key);
      }));
    });
    return fx;
  },
  draw(fx, t, F) {
    if (t < fx.t0 || (fx.t1 !== undefined && t >= fx.t1)) return;
    const lt = t - fx.t0, n = fx.n, s = fx.cell, k = fx.id;
    const pos = fx.pos ? evalTrack(fx.pos, t) : fx.at;
    const sc = typeof fx.scale === 'number' ? fx.scale : (fx.scale ? evalTrack(fx.scale, t) : 1);
    const p = fx.t0 < 0 ? 1 : EASE.out(clamp(lt / (fx.drawDur ?? 0.5)));
    const x0 = -n * s / 2, y0 = -n * s / 2;
    const W = (r, c) => [pos[0] + sc * (x0 + (c + 0.5) * s), pos[1] + sc * (y0 + (r + 0.5) * s)];
    const cutOn = fx.cut !== null && fx.cut !== undefined;
    const cutDone = cutOn && t >= fx.cut + 0.55;
    const isCut = (r, c) => (r === 0 && c === 0) || (r === n - 1 && c === n - 1);
    const present = (r, c) => r >= 0 && c >= 0 && r < n && c < n && !(cutDone && isCut(r, c));
    DL.save(); DL.translate(pos[0], pos[1]); if (sc !== 1) DL.scale(sc);
    const z = fx.z ?? Z.set + 2, lw = 1 / Math.sqrt(Math.max(0.15, sc)), wOut = (fx.w || 6) * lw, wIn = wOut * 0.5; // thin boards keep readable lines
    // grid edges: every unique edge once; outer edges thick
    const edges = [];
    for (let r = 0; r <= n; r++) for (let c = 0; c < n; c++) { const a = present(r - 1, c), b = present(r, c); if (a || b) edges.push({ key: `h${r}_${c}`, pts: [[x0 + c * s, y0 + r * s], [x0 + (c + 1) * s, y0 + r * s]], outer: a !== b }); }
    for (let c = 0; c <= n; c++) for (let r = 0; r < n; r++) { const a = present(r, c - 1), b = present(r, c); if (a || b) edges.push({ key: `v${c}_${r}`, pts: [[x0 + c * s, y0 + r * s], [x0 + c * s, y0 + (r + 1) * s]], outer: a !== b }); }
    edges.forEach((e, i) => stroke(k + '.' + e.key, e.pts, { z: z + (e.outer ? 0.3 : 0.2), w: e.outer ? wOut : wIn, draw: clamp(p * 1.6 - (i / edges.length) * 0.6), bow: 0.3 }));
    // the two corners being cut away: red dashed outline, then the square falls off
    if (cutOn && fx.cut >= 0 && t >= fx.cut && t < fx.cut + 1.3) { // a negative cut = already cut when the scene opens
      [[0, 0], [n - 1, n - 1]].forEach(([r, c], i) => {
        const u = clamp((t - fx.cut - 0.55) / 0.7), fall = EASE.in(u);
        const cx = x0 + (c + 0.5) * s + (i ? 1 : -1) * fall * 60, cy = y0 + (r + 0.5) * s + fall * Math.min(260, 2.2 * s);   // small cells fall a shorter way
        const h = s / 2, rot = (i ? 1 : -1) * 40 * fall, op = 1 - u;
        DL.save(); DL.translate(cx, cy); DL.rotate(rot);
        stroke(k + '.cut' + i, [[-h, -h], [h, -h, 1], [h, h, 1], [-h, h, 1], [-h, -h, 1]], { z: z + 0.5, w: 4.5, color: C.red, draw: EASE.out(clamp((t - fx.cut) / 0.4)), opacity: op, fill: u > 0 ? C.paper : 'none' });
        if (E3B.black(r, c) && fx.color !== undefined && fx.color !== null && t >= fx.color) hatch(k + '.cuth' + i, -h, -h, s, z + 0.4, 1, op, lw);
        DL.restore();
      });
    }
    // black squares: hand hatching, cell by cell
    if (fx.color !== undefined && fx.color !== null && t >= fx.color) {
      const blacks = E3B.cells(n, cutDone).filter(([r, c]) => E3B.black(r, c));
      blacks.forEach(([r, c], i) => {
        const u = fx.color < 0 && fx.t0 < 0 ? 1 : clamp((t - fx.color - i * (fx.colorDur ?? 1.2) / blacks.length) / 0.22);
        if (u > 0) hatch(k + '.b' + r + '_' + c, x0 + c * s, y0 + r * s, s, z + 0.1, u, 1, lw);
      });
    }
    // dominoes
    const doms = [];
    (fx.attempts || []).forEach((a, ai) => {
      const od = a.outDur ?? 0.3;   // how long the dominoes take to clear away after t1
      if (t < a.t0 || (a.t1 !== undefined && t >= a.t1 + od)) return;
      const out = a.t1 !== undefined ? clamp((t - a.t1) / od) : 0;
      a.dom.forEach((d, di) => {
        const td = a.t0 + di * (a.step ?? 0.32); if (t < td) return;
        const u = a.t0 < 0 ? 1 : EASE.back(clamp((t - td) / 0.16));
        doms.push({ d, key: `${k}.a${ai}d${di}`, u, out });
      });
      const covered = new Set(a.dom.flatMap(d => E3B.domCells(d).map(([r, c]) => r + '_' + c)));
      const failT = a.fail ?? (a.t0 + a.dom.length * (a.step ?? 0.32) + 0.25);
      if (!fx.hideLeft && t >= failT && out < 1) {
        E3B.cells(n, true).filter(([r, c]) => !covered.has(r + '_' + c)).forEach(([r, c], j) => {
          const cx = x0 + (c + 0.5) * s, cy = y0 + (r + 0.5) * s, q = clamp((t - failT - j * 0.12) / 0.25);
          if (q > 0) stroke(`${k}.a${ai}L${j}`, ringPts(`${k}.a${ai}L${j}`, cx, cy, s * 0.4, s * 0.4, { n: 10, a0: -100, sweep: 380, rv: 0.06 }), { z: z + 2, w: wOut * 0.9 * (fx.ringW || 1), color: C.red, draw: EASE.out(q), opacity: 1 - out });
        });
      }
    });
    doms.forEach(({ d, key, u, out }) => {
      const [[r1, c1], [r2, c2]] = E3B.domCells(d);
      const cx = x0 + ((c1 + c2) / 2 + 0.5) * s, cy = y0 + ((r1 + r2) / 2 + 0.5) * s;
      const hw = (d[2] === 'h' ? s : s / 2) - s * 0.1, hh = (d[2] === 'h' ? s / 2 : s) - s * 0.1;
      DL.save(); DL.translate(cx, cy - out * 30); DL.scale(lerp(0.6, 1, u));
      const dcol = fx.domColor === 'pencil' ? C.pencil : C.ink, dw = fx.domW || 1;   // thumbnails can draw lighter dominoes
      stroke(key, superPts(0, 0, hw * 2, hh * 2, 20, 6), { z: z + 1, w: wOut * 0.95 * dw, color: dcol, closed: true, fill: 'none', opacity: 1 - out });
      const tk = d[2] === 'h' ? [[0, -hh * 0.45], [0, hh * 0.45]] : [[-hw * 0.45, 0], [hw * 0.45, 0]];
      stroke(key + '.m', tk, { z: z + 1, w: wIn * dw, color: dcol, opacity: 1 - out });
      DL.restore();
    });
    // extra red rings (e.g. the two squares under one domino)
    (fx.rings || []).forEach((g, gi) => {
      if (t < g.t0 || (g.t1 !== undefined && t >= g.t1)) return;
      g.cells.forEach(([r, c], j) => {
        const cx = x0 + (c + 0.5) * s, cy = y0 + (r + 0.5) * s;
        stroke(`${k}.R${gi}_${j}`, ringPts(`${k}.R${gi}_${j}`, cx, cy, s * 0.42, s * 0.42, { n: 10, a0: -100, sweep: 380, rv: 0.06 }), { z: z + 2, w: wOut * 0.9 * (fx.ringW || 1), color: C.red, draw: EASE.out(clamp((t - g.t0 - j * 0.12) / 0.25)) });
      });
    });
    DL.restore();
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) F.targets[`${k}.c${r}_${c}`] = W(r, c);
    F.targets[k + '.center'] = pos;
    F.targets[k + '.top'] = [pos[0], pos[1] + sc * y0];
    F.targets[k + '.bottom'] = [pos[0], pos[1] - sc * y0];
  },
  cues: fx => {
    const c = [];
    if (fx.t0 >= 0) c.push([fx.t0, 'pen']);
    if (fx.cut !== null && fx.cut !== undefined && fx.cut >= 0) c.push([fx.cut, 'zip'], [fx.cut + 0.6, 'whoosh']);
    if (fx.color !== null && fx.color !== undefined && fx.color >= 0) c.push([fx.color, 'swish'], [fx.color + 0.6, 'swish']);
    (fx.attempts || []).forEach(a => {
      if (a.t0 < 0) return;
      a.dom.forEach((d, di) => c.push([a.t0 + di * (a.step ?? 0.32), 'tap']));
      if (!fx.hideLeft) c.push([a.fail ?? (a.t0 + a.dom.length * (a.step ?? 0.32) + 0.25), 'buzz']);
    });
    return c;
  },
};
/** Pencil-ink hatching inside one square (local coords): diagonal lines, drawn in with u (0..1). */
function hatch(key, x, y, s, z, u, op, lw = 1) {
  const m = 7;
  for (let i = 1; i < m * 2; i++) {
    const d = (i / (m * 2)) * 2 * s, a = d <= s ? [x + d, y] : [x + s, y + d - s], b = d <= s ? [x, y + d] : [x + d - s, y + s];
    const inset = s * 0.06, A = [lerp(a[0], b[0], inset / s), lerp(a[1], b[1], inset / s)], B = [lerp(b[0], a[0], inset / s), lerp(b[1], a[1], inset / s)];
    stroke(key + '.' + i, [A, B], { z, w: 2.6 * lw, opacity: 0.8 * op, draw: clamp(u * 2 - (i / (m * 2))), boil: 0.6 });
  }
}

/* 九次失败的摆法（都是 6 块骨牌，剩下两个白格；用脚本枚举过 154 种摆法挑出来的）。
 * TRIES[0] 是"一行一行摆"的第一次；TRIES[8] 是第九次，也是第 55 场开场时棋盘上的那一次。 */
E3B.TRIES = [
  [[0, 1, 'h'], [1, 0, 'h'], [1, 2, 'h'], [2, 0, 'h'], [2, 2, 'h'], [3, 0, 'h']],   // 剩 (0,3) (3,2)
  [[0, 1, 'h'], [0, 3, 'v'], [1, 1, 'h'], [2, 0, 'h'], [2, 2, 'v'], [3, 0, 'h']],   // 剩 (1,0) (2,3)
  [[0, 2, 'h'], [1, 0, 'h'], [1, 2, 'v'], [1, 3, 'v'], [2, 0, 'h'], [3, 1, 'h']],   // 剩 (0,1) (3,0)
  [[0, 1, 'h'], [0, 3, 'v'], [1, 0, 'h'], [2, 0, 'v'], [2, 2, 'h'], [3, 1, 'h']],   // 剩 (1,2) (2,1)
  [[0, 1, 'h'], [1, 0, 'h'], [1, 2, 'v'], [1, 3, 'v'], [2, 0, 'v'], [3, 1, 'h']],   // 剩 (0,3) (2,1)
  [[0, 1, 'h'], [0, 3, 'v'], [1, 1, 'h'], [2, 0, 'v'], [2, 1, 'v'], [2, 2, 'h']],   // 剩 (1,0) (3,2)
  [[0, 2, 'h'], [1, 0, 'h'], [1, 2, 'h'], [2, 0, 'v'], [2, 1, 'v'], [2, 2, 'v']],   // 剩 (0,1) (2,3)
  [[0, 1, 'h'], [0, 3, 'v'], [1, 0, 'v'], [1, 1, 'h'], [2, 1, 'v'], [2, 2, 'h']],   // 剩 (3,0) (3,2)
  [[0, 1, 'h'], [0, 3, 'v'], [1, 0, 'h'], [1, 2, 'v'], [2, 0, 'h'], [3, 0, 'h']],   // 剩 (2,3) (3,2)
];
/** 主棋盘的统一位置（第 40、45、50、55 场衔接用） */
E3B.MAIN = { at: [600, 420], cell: 100 };

/** 一张横线纸（和第 2 集的 e2_page 一样），中心在道具位置。fx: {w, h, lines, title} */

  stroke(k + '.shade', [[-W / 2 + 12, H / 2 + 8], [W / 2 + 7, H / 2 + 6, 1], [W / 2 + 7, -H / 2 + 12]], { z: z - 0.5, w: 2.4, color: C.pencil, opacity: 0.6 * p, boil: 0.5 });
  const n = fx.lines ?? 5, top = -H / 2 + (fx.title ? 110 : 70);
  for (let i = 0; i < n; i++) {
    const y = top + i * ((H / 2 - 40 - top) / Math.max(1, n - 1));

  }
  stroke(k + '.m', [[-W / 2 + 60, -H / 2 + 14], [-W / 2 + 60, H / 2 - 14]], { z: z + 0.1, w: 2, color: C.red, opacity: 0.45, draw: stag(p, 2, 3), boil: 0.4 });
  if (fx.title) text(k + '.t', fx.title, 0, -H / 2 + 52, { size: 40, z: z + 0.2, opacity: clamp((lt - 0.3) / 0.2) });
};

// 更难的题（虚线）：谷更深，峰也更高。
// 曲线由公式逐点生成；骑在线上的小陶头像 = 曲线上 x 处的点、沿法线抬高一个头半径。都是时间的纯函数。

  const X0 = 240, YB = 400;                             // every curve starts here (neutral mood)

  function stuckY(c, x) {

    if (x <= c.drop[1]) return lerp(YB, c.floor, sm((x - c.drop[0]) / (c.drop[1] - c.drop[0])));

  function sample(fn, x0, x1, peakX) {

// 第 55 场 · 啊哈！：一块骨牌盖住一黑一白；数一数：黑 6 白 8；6 块骨牌用光 6 个黑格，剩下两个白格永远不挨着。
// 小陶跳起来，大灯泡“叮”！这一声叮不是从天上掉下来的：9 次失败 → 一个好问题 → 换个看法 → 叮！
// 开场画面接第 50 场结尾：主棋盘在 E3B.MAIN，剪过角、涂过色，摆着 E3B.TRIES[8]，(2,3)(3,2) 两个白格被圈着；小陶在右边，表情 idea。
(() => {
  const FL = 780, TX = 1180, CELL = E3B.MAIN.cell, N = 4;
  const B0 = E3B.MAIN.at, B1 = [720, 420];                 // the board slides right to make room for the tally
  const SLIDE = 9.85, EXIT = 25.6;                         // board: slide right / slide off to the left
  const BPOS = [[0, B0], [SLIDE, B1, 0.45, 'io'], [EXIT, [-470, 420], 0.5, 'in']];
  const TRY = E3B.TRIES[8];
  const DOM = [1, 0, 'h'];                                  // the domino we look at: (1,0) white + (1,1) black
  const J0 = 22.55, J1 = 23.15, JH = 96;                    // the big jump (take-off, landing, height)
  const H0 = 23.95, H1 = 24.3;                              // a second, smaller bounce

  /* ---------------- the facts, checked ---------------- */
  const left = E3B.cells(N, true);
  const BLK = left.filter(([r, c]) => E3B.black(r, c));    // reading order: the order we count in
  const WHT = left.filter(([r, c]) => !E3B.black(r, c));
  const covered = new Set(TRY.flatMap(d => E3B.domCells(d).map(([r, c]) => r + '_' + c)));
  const LEFT = WHT.filter(([r, c]) => !covered.has(r + '_' + c));
  if (BLK.length !== 6 || WHT.length !== 8) console.error('a3_aha: expected 6 black + 8 white, got', BLK.length, WHT.length);
  if (TRY.some(d => { const [p, q] = E3B.domCells(d); return E3B.black(...p) === E3B.black(...q); })) console.error('a3_aha: a domino is not black+white');
  if (LEFT.length !== 2 || LEFT.map(x => x.join(',')).join(' ') !== '2,3 3,2') console.error('a3_aha: TRIES[8] should leave (2,3) (3,2)', LEFT);
  if (!TRY.some(d => d.join() === DOM.join())) console.error('a3_aha: DOM is not in TRIES[8]');
  if (6 - 6 !== 0 || 8 - 6 !== 2) console.error('a3_aha: arithmetic');

  const boardAt = t => evalTrack(BPOS, t);
  const cellAt = (t, r, c) => { const p = boardAt(t); return [p[0] + (c - (N - 1) / 2) * CELL, p[1] + (r - (N - 1) / 2) * CELL]; };

  /** a group of ordinary fx drawn together, with an optional moving transform (xf: t => DL ops) and a fade (op: t => 0..1) — for exits.
   *  (same code in 58_proof.js, so each scene builds on its own) */
  COMP.a3_grp = {
    init(fx) { fx.items.forEach(it => { const c = COMP[it.type]; if (c.init) c.init(it); }); return fx; },
    draw(fx, t, F) {
      if ((fx.t0 !== undefined && t < fx.t0) || (fx.t1 !== undefined && t >= fx.t1)) return;
      const n0 = DL.items.length;
      DL.save(); if (fx.xf) fx.xf(t);
      fx.items.forEach(it => COMP[it.type].draw(it, t, F));
      DL.restore();
      const op = fx.op ? fx.op(t) : 1;
      if (op < 0.999) for (let i = n0; i < DL.items.length; i++) { const a = DL.items[i].attrs; a.opacity = +((a.opacity ?? 1) * op).toFixed(3); }
    },
    cues: fx => fx.items.flatMap(it => (COMP[it.type].cues ? COMP[it.type].cues(it) : [])),
  };
  const fadeOut = (t0, d = 0.3) => t => 1 - clamp((t - t0) / d);

  /** the domino we look at: one red rounded outline round both its squares (red circles mean "left over" in this episode) */
  COMP.a3_domMark = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const c = lerp2(cellAt(t, DOM[0], DOM[1]), cellAt(t, DOM[0], DOM[1] + 1), 0.5);
      stroke('a3dm', superPts(c[0], c[1], 2 * CELL + 18, CELL + 18, 26, 5), { z: Z.annot, w: 5.5, color: C.red, closed: true, draw: EASE.out(clamp((t - fx.t0) / 0.4)) });
    },
    cues: fx => [[fx.t0, 'pen']],
  };

  /* ---------------- L1–L3: one domino, blown up: two neighbours = one black + one white ---------------- */
  const ZC = [218, 316], ZS = 140;                           // the enlarged domino (left panel)
  const ZT = { lines: 3.45, cells: 3.55, dom: 4.3, hatch: 6.95 };
  COMP.a3_zoomDom = {
    draw(fx, t) {
      if (t < ZT.lines || t >= fx.t1) return;
      const z = Z.set + 2, x0 = ZC[0] - ZS, y0 = ZC[1] - ZS / 2;
      // pencil zoom lines from the real domino on the board
      const d0 = cellAt(t, 1, 0), dl = [d0[0] - CELL / 2, d0[1] - CELL / 2], db = [d0[0] - CELL / 2, d0[1] + CELL / 2];
      const pl = EASE.out(clamp((t - ZT.lines) / 0.3));
      stroke('a3zd.z0', [dl, [x0 + 2 * ZS + 6, y0 - 4]], { z, w: 2.2, color: C.pencil, draw: pl, boil: 0.5 });
      stroke('a3zd.z1', [db, [x0 + 2 * ZS + 6, y0 + ZS + 4]], { z, w: 2.2, color: C.pencil, draw: pl, boil: 0.5 });
      // the two squares (left white, right black), sharing the middle edge
      const pc = EASE.out(clamp((t - ZT.cells) / 0.4));
      stroke('a3zd.box', [[x0, y0], [x0 + 2 * ZS, y0, 1], [x0 + 2 * ZS, y0 + ZS, 1], [x0, y0 + ZS, 1], [x0, y0, 1]], { z: z + 0.3, w: 6, draw: pc, fill: C.paper });
      stroke('a3zd.mid', [[x0 + ZS, y0], [x0 + ZS, y0 + ZS]], { z: z + 0.3, w: 4, draw: clamp(pc * 2 - 1) });
      const hu = clamp((t - ZT.hatch) / 0.5);
      if (hu > 0) hatch('a3zd.h', x0 + ZS, y0, ZS, z + 0.4, hu, 1, 1.3);
      // the domino drops on and covers both
      const du = clamp((t - ZT.dom) / 0.22);
      if (du > 0) {
        DL.save(); DL.translate(ZC[0], ZC[1]); DL.scale(lerp(1.3, 1, EASE.back(du)));
        stroke('a3zd.dom', superPts(0, 0, 2 * ZS - 22, ZS - 22, 20, 6), { z: z + 1, w: 6, closed: true, fill: 'none', opacity: clamp(du * 3) });
        stroke('a3zd.dm', [[0, -ZS * 0.22], [0, ZS * 0.22]], { z: z + 1, w: 3.2, opacity: clamp(du * 3) });
        DL.restore();
      }
    },
    cues: fx => [[ZT.lines, 'whoosh'], [ZT.cells, 'pen'], [ZT.dom + 0.1, 'tap'], [ZT.hatch, 'swish']],
  };

  /* ---------------- L4–L6: count the squares (red numbers on the board) ---------------- */
  const NS = 36, NR = 18;                                  // digit size, paper backing radius (small: the hatching stays visible)
  const glyphs = n => layoutWriting({ text: String(n), x: 0, y: -NS / 2, size: NS, t0: 0, speed: 1500, gap: 0.02, glyphGap: 0.02, anchor: 'middle' });
  const TB = 10.95, DTB = 0.19, TW = 12.45, DTW = 0.165;   // black 1–6, white 1–8
  const DIMB = 15.95, DIMW = 18.75;                        // "用光了": used squares fade (in the same order)
  const COUNT = [
    ...BLK.map(([r, c], i) => ({ r, c, n: i + 1, t: TB + i * DTB, dim: DIMB + i * 0.12 })),
    ...WHT.map(([r, c], i) => ({ r, c, n: i + 1, t: TW + i * DTW, dim: covered.has(r + '_' + c) ? DIMW + i * 0.1 : null })),
  ].map(o => ({ ...o, g: glyphs(o.n) }));
  COMP.a3_count = {
    draw(fx, t, F) {
      if (t >= fx.t1) return;
      COUNT.forEach((o, i) => {
        if (t < o.t) return;
        const p = F.targets[`${fx.board}.c${o.r}_${o.c}`]; if (!p) return;
        // the black count steps back (0.4) before the white count starts, so the two counts never read as one jumble
        const blk = E3B.black(o.r, o.c), pre = blk ? lerp(1, 0.4, clamp((t - TW + 0.25) / 0.2)) : 1;
        const op = pre * (o.dim === null ? 1 : lerp(1, blk ? 0.35 : 0.22, clamp((t - o.dim) / 0.25)));
        const k = 'a3n' + i, pop = EASE.back(clamp((t - o.t) / 0.16));
        DL.save(); DL.translate(p[0], p[1]);
        stroke(k + '.bg', ringPts(k + '.bg', 0, 0, NR * pop, NR * pop, { n: 10, closed: true }), { z: Z.annot - 1, closed: true, fill: C.paper, noStroke: true, w: 1, opacity: op });
        o.g.strokes.forEach((s, j) => {
          const u = clamp((t - o.t - s.t0) / s.dur);
          if (u > 0) stroke(k + '.s' + j, s.pts, { z: Z.annot, w: 4.6, color: C.red, draw: u, opacity: op, boil: 0.5 });
        });
        DL.restore();
      });
    },
    cues: () => COUNT.map(o => [o.t, 'plip']),
  };
  /** red pen flashes: rings that swell and fade around board squares */
  COMP.a3_pulse = {
    draw(fx, t, F) {
      fx.at.forEach((t0, i) => {
        const u = (t - t0) / 0.45; if (u < 0 || u > 1) return;
        fx.cells.forEach(([r, c], j) => {
          const p = F.targets[`${fx.board}.c${r}_${c}`]; if (!p) return;
          const R = 44 + 34 * EASE.out(u);
          stroke(`${fx.id}.${i}.${j}`, ringPts(`${fx.id}.${j}`, p[0], p[1], R, R, { n: 12, closed: true, rv: 0.05 }), { z: Z.annot, w: 5 * (1 - u) + 1, color: C.red, closed: true, opacity: 1 - u });
        });
      });
    },
    cues: fx => fx.at.map(t => [t, 'boop']),
  };

  // tally (left panel): 黑 6 - 6 = 0 / 白 8 - 6 = 2  (汉字 typed, numbers hand-written)
  const TS = 68, TXL = 105, TXN = 152, ROW = [300, 420];
  const XEQ = TXN + writeWidth('6', TS) + 0.36 * TS;
  const TALLY = { b: 12.2, w: 13.85, eqB: 15.3, eqW: 18.55, ring2: 19.75 };
  const EQ8 = { type: 'write', id: 'a3e8', text: '- 6 = 2', x: XEQ, y: ROW[1] - TS / 2, size: TS, t0: TALLY.eqW, speed: 1900, gap: 0.05, glyphGap: 0.1, color: 'red', w: 6, z: Z.annot, sfx: 'pen' };
  const END_FADE = 38.2;                                   // chain and bulb fade out before the cut to 58_proof

  /* ---------------- L7: 啊哈！ (jump, burst lines, the word itself) ---------------- */
  const jumpY = t => {
    if (t >= J0 && t < J1) return -JH * Math.sin(Math.PI * (t - J0) / (J1 - J0));
    if (t >= H0 && t < H1) return -34 * Math.sin(Math.PI * (t - H0) / (H1 - H0));
    return 0;
  };
  COMP.a3_aha = {
    draw(fx, t, F) {
      if (t < J0 || t >= fx.t1) return;
      const a = F.anchors.terry; if (!a) return;
      const lt = t - J0;

        const fx0 = (a.footL[0] + a.footR[0]) / 2 + dx, fy = Math.max(a.footL[1], a.footR[1]) + 16 + Math.abs(dx) * 0.3;
        stroke('a3aha.sp' + i, [[fx0, fy], [fx0 + dx * 0.15, fy + 70 - Math.abs(dx)]], { z: Z.fx, w: 4, draw: EASE.out(clamp(lt / 0.08)), opacity: up, boil: 0.6 });
      });
      // emphasis lines: two fans either side of him (keep the top clear for the bulb)
      const op = clamp(lt / 0.1) * (1 - clamp((t - J0 - 2.0) / 0.5)), cx = TX, cy = 560;
      [...[-200, -183, -166, -149, -132], ...[-48, -31, -14, 3, 20]].forEach((deg, i) => {
        const L = i < 5, a0 = deg * RAD, wob = 7 * Math.sin(t * 13 + i * 2.1);   // left fan stays clear of the board
        const r0 = (L ? 176 : 205) + wob + (i % 2) * 12, r1 = r0 + (L ? 44 : 58) + (i % 3) * 8;
        stroke('a3aha.e' + i, [[cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0], [cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1]],

      });

    },
  };

  const bulbAt = F => { const a = F.anchors.terry; return a ? [a.headTop[0], a.headTop[1] - 26 - 130 * 0.62] : [TX, 430]; };
  COMP.a3_bulbRing = {
    draw(fx, t, F) {
      if (t < fx.t0 || t >= fx.t1) return;
      const c = bulbAt(F);
      stroke(fx.id, ringPts(fx.id, c[0], c[1] - 6, 92, 100, { n: 13, a0: 200, sweep: 385, rv: 0.05 }), { z: Z.annot, w: 5, color: C.red, draw: EASE.out(clamp((t - fx.t0) / 0.4)) });
    },
    cues: fx => [[fx.t0, 'pen']],
  };

  /* ---------------- L9: … didn't fall out of the sky (cloud drops a bulb — crossed out) ---------------- */
  const SKY = { cloud: 28.5, drop: 29.6, land: 30.12, x1: 31.0, x2: 31.25, x: 620, cy: 175, by: 742, off: 32.15 };   // by: the bulb lands on the floor
  COMP.a3_sky = {
    draw(fx, t, F) {
      if (t < SKY.cloud || t >= fx.t1) return;
      const z = Z.fx, lt = t - SKY.cloud, p = EASE.back(clamp(lt / 0.3)), { x, cy } = SKY;
      // cloud
      const pts = [], rx = 150 * p, ry = 66 * p;
      for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2, bump = 1 + 0.11 * Math.abs(Math.sin(a * 4.5)); pts.push([x + Math.cos(a) * rx * bump, cy + Math.sin(a) * ry * bump]); }
      stroke('a3sky.cl', pts, { z, w: 5, closed: true, fill: C.paper });

        const by = lerp(cy + 40, SKY.by, EASE.in(u)) - bounce;
        if (u < 1) [-18, 18].forEach((dx, i) => stroke('a3sky.fl' + i, [[x + dx, by - 150], [x + dx, by - 110 - 40 * u]], { z: z - 0.1, w: 3.5, opacity: 0.8 * (1 - u * 0.5), boil: 0.6 }));
        COMP.e3_bulb.draw({ id: 'a3sky.b', at: [x, by + 30], size: 92, t0: -1, state: [[-1, 'on']], z: z + 0.2 }, t, F);
        if (u >= 1) shadow('a3sky.sh', x, FL + 4, 70, 1);
      }
      // a big red ✗ over the whole idea
      [[[x - 190, cy - 70], [x + 190, FL]], [[x + 190, cy - 70], [x - 190, FL]]].forEach((seg, i) => {
        const u = EASE.out(clamp((t - (i ? SKY.x2 : SKY.x1)) / 0.2));

  const CS = 52, CY = 232, CH = 92, PADX = 24, ARW = 52, GAP = 12;
  const CHAIN = [{ text: '9 次失败', t: 32.8 }, { text: '一个好问题', t: 34.0 }, { text: '换个看法', t: 34.85 }, { text: '叮！', t: 35.55 }];
  let cxx = 60;
  CHAIN.forEach(b => { b.w = textWidth(b.text, CS) + 2 * PADX; b.x = cxx; cxx += b.w + ARW + 2 * GAP; });

  for (const c of EP.cues) {
    if (c.t <= a) continue; if (c.t > b) break;
    if (c.sfx && P.snd) SFX.play(c.sfx);
    if (c.say && P.narr) NARR.say(c);
  }
}
/** after a seek, pick up the line that is being spoken at t */
function resumeVoice(t) {
  if (!P.narr) return;
  let last = null; for (const c of EP.cues) { if (c.t > t) break; if (c.say) last = c; }
  if (last && t - last.t > 0.05) NARR.say(last, t - last.t);
}
function tick(now) {
  if (!P.playing) return;
  let t = P.t0 + (now - P.wall0) / 1000;
  // hold the picture while the voice finishes, instead of letting lines pile up
  const talking = P.narr && NARR.busy();
  if (talking) {
    const nx = EP.syncs.find(x => x > P.prev + 1e-4 && x <= t);
    if (nx !== undefined) { t = Math.max(P.prev, nx - 1e-3); P.t0 = t; P.wall0 = now; }
  }
  MUSIC.duck(talking);
  // "轮到你了" pauses: stop and wait for the child
  const pp = EP.pauses.find(x => x > P.prev && x <= t);
  if (pp !== undefined) t = pp;
  if (t >= EP.dur) t = EP.dur;
  fireCues(P.prev, t); P.prev = t; P.t = t;
  paint(t);
  const si = sceneAt(Math.min(t, EP.dur - 1e-6)).index;
  if (si !== P.scene) { P.scene = si; syncMusic(false); }
  else if (P.music && !MUSIC.current()) syncMusic(false); // bed finished decoding after play started
  if (pp !== undefined) {
    P.playing = false; P.waiting = pp;
    if (P.music && EP.think && MUSIC.ready(EP.think)) MUSIC.set(EP.think, 0, true); else MUSIC.stop();
    syncUI(); return;
  }
  if (t >= EP.dur) { P.playing = false; MUSIC.stop(1.5); syncUI(); return; }
  syncUI();
  P.raf = requestAnimationFrame(tick);
}
async function play() {
  if (P.loading) return;
  const resume = P.waiting !== null;
  if (P.poster || P.t >= EP.dur - 1e-3) P.t = 0;
  P.poster = false; P.waiting = null;
  SFX.unlock();
  if (!resume) NARR.cancel();
  if (P.narr) NARR.prime();
  // first play: decode the narration (quick) before the clock starts; music decodes alongside and joins when ready
  const voiceReady = NARR.load();
  MUSIC.load();
  if (voiceReady) { P.loading = true; paint(P.t, true); syncUI(); await voiceReady; P.loading = false; }
  P.playing = true;
  P.t0 = P.t; P.prev = resume ? P.t : P.t - 1e-4; P.wall0 = performance.now();
  if (!resume) resumeVoice(P.t);
  P.scene = sceneAt(Math.min(P.t, EP.dur - 1e-6)).index;
  syncMusic(true);
  cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick);
  paint(P.t, true); syncUI();
}
function pause() { P.playing = false; cancelAnimationFrame(P.raf); NARR.cancel(); MUSIC.stop(); syncUI(); }
function toggle() { P.playing ? pause() : play(); }
function seek(t) {
  pause(); P.poster = false; P.waiting = null;
  P.t = clamp(+t || 0, 0, EP.dur);
  paint(P.t, true); syncUI();
}
ui.play.addEventListener('click', toggle);
ui.poster.addEventListener('click', play);
ui.think.addEventListener('click', play);
ui.restart.addEventListener('click', () => { seek(0); play(); });
ui.scrub.addEventListener('input', () => seek(+ui.scrub.value));
ui.narr.addEventListener('click', () => { P.narr = !P.narr; if (!P.narr) NARR.cancel(); savePrefs(); syncUI(); });
ui.snd.addEventListener('click', () => { P.snd = !P.snd; if (P.snd) SFX.unlock(); savePrefs(); syncUI(); });
ui.music.addEventListener('click', () => { P.music = !P.music; SFX.unlock(); MUSIC.load(); syncMusic(true); savePrefs(); syncUI(); });
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  const tag = e.target && e.target.tagName;
  if (tag === 'BUTTON' || tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'range')) return;
  e.preventDefault(); toggle();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.playing) pause(); });

// reduced motion: no line boil (holds become perfectly still)
try {
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  RM.reduce = mq.matches;
  const onMQ = () => { RM.reduce = mq.matches; paint(P.poster ? EP.poster : P.t, true); };
  mq.addEventListener ? mq.addEventListener('change', onMQ) : mq.addListener(onMQ);
} catch (e) { /* ignore */ }

// test/automation hooks
window.render = render;
window.__duration = EP.dur;
window.__scenes = EP.scenes.map(s => ({ id: s.id, chapter: s.chapter || null, start: +s.start.toFixed(3), dur: s.dur }));
window.__seek = t => { seek(t); render(P.t); P.lastQ = Math.floor(P.t * CFG.FPS + 1e-6); };
window.__audio = () => ({ ctx: AUD.ctx && AUD.ctx.state, music: MUSIC.current(), talking: NARR.busy(), t: P.t, playing: P.playing, waiting: P.waiting });

paint(Math.min(EP.poster, EP.dur), true); syncUI();

</script>
</body>
