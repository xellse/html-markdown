<style>

}

  --bg:#161519; --fg:#ECE8DF; --muted:#A39E94; --surface:#211F25; --border:#3A3740;

*{box-sizing:border-box}

<main class="wrap">

<script>
'use strict';
/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = {
  W: 1600, H: 900, FPS: 24,
  BOIL_FPS: 5, BOIL_AMP: 1.1, WOBBLE: 1.4,
  FLOOR: 780,
  C: { paper: '#FBF8F1', ink: '#1E1E1E', red: '#D23A3F', pencil: '#9B9B9B', hi: '#FFE066' },
  FONT_ZH: "'ZCOOL KuaiLe','Patrick Hand',sans-serif",
  FONT_MIX: "'Patrick Hand','ZCOOL KuaiLe',sans-serif",
  FONT_MONO: "'VT323','Courier New',monospace", MONO_ADV: 0.4,
  SIZE: { sub: 52, label: 40, speech: 84, mark: 84, series: 32 },
};
const C = CFG.C;
// draw-order layers
const Z = { set: 10, hi: 12, board: 14, shadow: 18, chair: 20, back: 28, body: 30, desk: 35, front: 40, fx: 50, annot: 60, stamp: 70, sub: 90 };
const RAD = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
const EASE = {
  lin: u => u,
  io: u => u * u * (3 - 2 * u),
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  back: u => { const c = 2.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};

/* =====================================================================
   NOISE / BOIL  (deterministic: static wobble per key + boil per floor(t*BOIL_FPS))
   ===================================================================== */
const HCACHE = new Map();
function hstr(s) {
  let h = HCACHE.get(s); if (h !== undefined) return h;
  h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0; HCACHE.set(s, h); return h;
}
function rnd(a, b, c) { // -> [-1, 1)
  let t = (a ^ Math.imul(b + 1, 0x9E3779B1) ^ Math.imul(c + 7, 0x85EBCA77)) >>> 0;
  t = (t + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1;
}
const BOIL = { frame: 0, amp: CFG.BOIL_AMP };
function jit(h, i, p, amp) {
  const w = CFG.WOBBLE * 0.5, b = BOIL.amp * amp, f = BOIL.frame * 2 + 1000;
  return [p[0] + rnd(h, i, 1) * w + (b ? rnd(h, i, f) * b : 0),
          p[1] + rnd(h, i, 2) * w + (b ? rnd(h, i, f + 1) * b : 0)];
}

/* =====================================================================
   DRAW LIST  (flat, keyed items; affine matrix stack; reconciled into SVG)
   ===================================================================== */
const DL = {
  items: [], m: [1, 0, 0, 1, 0, 0], st: [], used: new Map(), zoff: 0,
  reset() { this.items.length = 0; this.m = [1, 0, 0, 1, 0, 0]; this.st.length = 0; this.used.clear(); this.zoff = 0; },
  save() { this.st.push(this.m.slice()); },
  restore() { this.m = this.st.pop(); },
  mul(n) {
    const [a, b, c, d, e, f] = this.m, [A, B, Cc, D, E, F] = n;
    this.m = [a * A + c * B, b * A + d * B, a * Cc + c * D, b * Cc + d * D, a * E + c * F + e, b * E + d * F + f];
  },
  translate(x, y) { this.mul([1, 0, 0, 1, x, y]); },
  scale(sx, sy = sx) { this.mul([sx, 0, 0, sy, 0, 0]); },
  rotate(deg) { const r = deg * RAD, c = Math.cos(r), s = Math.sin(r); this.mul([c, s, -s, c, 0, 0]); },
  about(x, y, fn) { this.translate(x, y); fn(); this.translate(-x, -y); },
  tp(p) { const m = this.m; return [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]]; },
  k() { const m = this.m; return Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])); },
  add(z, key, tag, attrs, text) {
    const n = this.used.get(key) || 0; this.used.set(key, n + 1);
    if (n) key += '#' + n;
    this.items.push({ z: z + this.zoff, key, tag, attrs, text, o: this.items.length });
  },
};

/* =====================================================================
   DRAWING PRIMITIVES
   ===================================================================== */
const f1 = v => Math.round(v * 10) / 10;
function catRun(R) {
  const n = R.length; let d = '';
  if (n === 2) return `L${f1(R[1][0])} ${f1(R[1][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = R[Math.max(i - 1, 0)], p1 = R[i], p2 = R[i + 1], p3 = R[Math.min(i + 2, n - 1)];
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
}
function smoothD(P, corners, closed) {
  let d = `M${f1(P[0][0])} ${f1(P[0][1])}`;
  if (closed) {
    const n = P.length;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
    }
    return d + 'Z';
  }
  let s = 0;
  for (let i = 1; i < P.length; i++) {
    if (i === P.length - 1 || corners[i]) { d += catRun(P.slice(s, i + 1)); s = i; }
  }
  return d;
}
/** A hand-drawn stroke through local points (3rd element truthy = sharp corner).
 *  o: {z, w, color, fill, closed, draw(0..1), boil(scale), opacity, bow, noStroke, blend} */
function stroke(key, pts, o = {}) {
  if (o.draw !== undefined && o.draw <= 0.002) return;
  if (!pts || pts.length < 2) return;
  const h = hstr(key);
  let P = pts, corners = pts.map(p => !!p[2]);
  if (P.length === 2 && !o.closed) {
    const a = P[0], b = P[1], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const bow = rnd(h, 99, 5) * Math.min(3, len * 0.03) * (o.bow ?? 1);
    P = [a, [(a[0] + b[0]) / 2 - (b[1] - a[1]) / len * bow, (a[1] + b[1]) / 2 + (b[0] - a[0]) / len * bow], b];
    corners = [false, false, false];
  }
  const amp = o.boil ?? 1;
  const W = P.map((p, i) => jit(h, i, DL.tp(p), amp));
  const a = {
    d: smoothD(W, corners, o.closed), fill: o.fill || 'none',
    stroke: o.noStroke ? 'none' : (o.color || C.ink),
    'stroke-width': +((o.w || 6) * DL.k()).toFixed(2),
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.draw !== undefined && o.draw < 1) {
    a.pathLength = 1; a['stroke-dasharray'] = '1 2'; a['stroke-dashoffset'] = +(1 - o.draw).toFixed(4);
    if (a.fill !== 'none') a['fill-opacity'] = o.draw > 0.6 ? 1 : 0;
  }
  if (o.blend) a.style = 'mix-blend-mode:multiply';
  DL.add(o.z ?? Z.body, key, 'path', a);
}
/** Points on a lumpy ring. a0/sweep in degrees; rv = radius variation. */
function ringPts(key, cx, cy, rx, ry, o = {}) {
  const n = o.n || 12, a0 = (o.a0 ?? -120) * RAD, sweep = (o.sweep ?? 360) * RAD, rv = o.rv ?? 0.03;
  const h = hstr(key + '~r'), pts = [], closed = !!o.closed;
  const cnt = closed ? n : n + 1;
  for (let i = 0; i < cnt; i++) {
    const a = a0 + sweep * i / n;
    let rr = 1 + rnd(h, i % n, 3) * rv;
    if (!closed && i === cnt - 1) rr *= 0.965; // Orlin's closing tick
    pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
  }
  return pts;
}
function superPts(cx, cy, w, h, n = 20, ex = 5) { // rounded-rect-ish superellipse
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    pts.push([cx + Math.sign(c) * Math.pow(Math.abs(c), 2 / ex) * w / 2, cy + Math.sign(s) * Math.pow(Math.abs(s), 2 / ex) * h / 2]);
  }
  return pts;
}
function dot(key, p, r, color = C.ink, z = Z.front) {
  const q = DL.tp(p), k = DL.k();
  DL.add(z, key, 'circle', { cx: f1(q[0]), cy: f1(q[1]), r: +(r * k).toFixed(2), fill: color });
}
function text(key, str, x, y, o = {}) {
  const m = DL.m;
  let tf = `matrix(${m.map(v => +v.toFixed(4)).join(' ')}) translate(${f1(x)} ${f1(y)})`;
  if (o.rot) tf += ` rotate(${o.rot})`;
  if (o.scale !== undefined && o.scale !== 1) tf += ` scale(${+o.scale.toFixed(4)})`;
  const a = { transform: tf, x: 0, y: 0, 'font-size': o.size || 40, 'font-family': o.font || CFG.FONT_ZH,
    fill: o.color || C.ink, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central', style: 'white-space:pre' };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.halo) { a.stroke = C.paper; a['stroke-width'] = o.halo; a['stroke-linejoin'] = 'round'; a['paint-order'] = 'stroke'; }
  DL.add(o.z ?? Z.annot, key, 'text', a, str);
}
/** Rough rendered width. CJK = 1 em; Latin ≈ 0.5 em (space 0.3); in the monospace code font every Latin char = MONO_ADV em. */
function textWidth(str, size, font) {
  const mono = font === CFG.FONT_MONO;
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0x2E80 ? size : (mono ? CFG.MONO_ADV : ch === ' ' ? 0.3 : 0.5) * size;
  return w;
}
/** Pencil-scribble ground shadow. */
function shadow(key, cx, cy, w, op = 1) {
  if (op <= 0.02) return;
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) {
    const u = i / n, amp = 6 * Math.sqrt(Math.max(0, 1 - Math.pow(2 * u - 1, 2))) + 1.5;
    pts.push([cx - w / 2 + w * u, cy + (i % 2 ? amp : -amp)]);
  }
  stroke(key, pts, { z: Z.shadow, w: 2.2, color: C.pencil, opacity: 0.75 * op, boil: 0.6 });
}
/** Curved arrow with a two-stroke head; draws on with p. */
function arrow(key, from, to, o = {}) {
  const p = o.p ?? 1; if (p <= 0) return;
  const len = dist(from, to) || 1, bend = (o.bend ?? 0.18) * len;
  const nx = -(to[1] - from[1]) / len, ny = (to[0] - from[0]) / len;
  const c = [(from[0] + to[0]) / 2 + nx * bend, (from[1] + to[1]) / 2 + ny * bend];
  const q = u => [(1 - u) * (1 - u) * from[0] + 2 * (1 - u) * u * c[0] + u * u * to[0], (1 - u) * (1 - u) * from[1] + 2 * (1 - u) * u * c[1] + u * u * to[1]];
  const pts = []; for (let i = 0; i <= 6; i++) pts.push(q(i / 6));
  const col = o.color || C.red, w = o.w || 3.5, z = o.z ?? Z.annot;
  stroke(key, pts, { z, w, color: col, draw: p, boil: 0.8 });

    // filament: a little zigzag (droops when dead)
    const fy = cy + R * 0.25, droop = st === 'dead' ? R * 0.35 : 0;

      { z: z + 0.1, w: 2.6, color: lit ? C.ink : C.pencil });
    if (lit) {

        const a = (-160 + i * 23.3) * RAD, L = s * (0.2 + 0.05 * Math.sin(t * 9 + i * 1.7));
        const r0 = R * 1.3;
        stroke(k + '.ray' + i, [[Math.cos(a) * r0, cy + Math.sin(a) * r0], [Math.cos(a) * (r0 + L), cy + Math.sin(a) * (r0 + L)]], { z, w: 4, draw: EASE.out(clamp((t - sT) / 0.15)) });

  cues: fx => {

/* ---------------- 成绩单：六道题的得分 ----------------
 * { type: 'e4_scores', id, at: [cx, cy], scale: 1, t0, t1, cell: 118,
 *   scores: [[分, 写出时间], …6 个]（写出时间为负 = 一开始就写好；null = 还没写）,
 *   total: [总分, 写出时间]（可选）, ringT: [[题号 0-5, t, t1?], …]（红圈圈出某一格，t1 时消失；可选）,
 *   braces: [{ from: 0, to: 2, label: '17', t0, t1 }]（格子下面的红色大括号 + 红色手写数字；t0 为负 = 一开始就在，t1 时 0.25 秒淡出）}
 * 一道题满分 7 分。分数用手写字形一笔笔写进格子；第 3、4 题之间的粗线分开“第一天 / 第二天”。
 * 发布命名点：'<id>.s<i>'（第 i 格中心，i 从 0 起）、'<id>.total'、'<id>.top'。 */
COMP.e4_scores = {
  init(fx) {
    const c = fx.cell || 118, n = 6, gap = 26;
    fx._W = n * c + gap;   // the six boxes stay centred on `at`; a total is drawn to their right
    fx._x0 = -fx._W / 2;
    fx._bx = i => fx._x0 + i * c + (i >= 3 ? gap : 0);
    fx._writes = (fx.scores || []).map((e, i) => !e || e[0] === null ? null : COMP.write.init({ id: fx.id + '.w' + i, text: String(e[0]), x: 0, y: 0, size: c * 0.62, t0: e[1], speed: 1500, w: 6.5, anchor: 'middle' }));
    fx._br = (fx.braces || []).map((b, j) => ({ ...b, w: COMP.write.init({ id: fx.id + '.bw' + j, text: b.label, x: 0, y: 0, size: c * 0.6, t0: b.t0 < 0 ? -9 : b.t0 + 0.3, t1: b.t1, speed: 1500, w: 6, color: 'red', anchor: 'middle', z: Z.annot }) }));
    if (fx.total) fx._tw = COMP.write.init({ id: fx.id + '.wt', text: '= ' + fx.total[0], x: 0, y: 0, size: c * 0.62, t0: fx.total[1], speed: 1500, w: 6.5 });
    return fx;
  },
  draw(fx, t, F) {
    if (t < fx.t0 || (fx.t1 !== undefined && t >= fx.t1)) return;
    const c = fx.cell || 118, k = fx.id, lt = t - fx.t0, p = fx.t0 < 0 ? 1 : EASE.out(clamp(lt / 0.45));
    const sc = fx.scale || 1, [cx, cy] = fx.at, z = fx.z ?? Z.set + 2;
    DL.save(); DL.translate(cx, cy); if (sc !== 1) DL.scale(sc);
    for (let i = 0; i < 6; i++) {
      const x = fx._bx(i);
      stroke(k + '.b' + i, [[x, -c / 2], [x + c, -c / 2, 1], [x + c, c / 2, 1], [x, c / 2, 1], [x, -c / 2, 1]], { z, w: 5, fill: C.paper, draw: clamp(p * 1.4 - i * 0.07) });
      text(k + '.n' + i, String(i + 1), x + c / 2, -c / 2 - 34, { size: 40, font: CFG.FONT_MIX, color: C.pencil, z, opacity: clamp(lt / 0.3) });
    }
    text(k + '.d1', '第一天', fx._bx(1) + c / 2, c / 2 + 42, { size: 36, color: C.pencil, z, opacity: clamp(lt / 0.3) });
    text(k + '.d2', '第二天', fx._bx(4) + c / 2, c / 2 + 42, { size: 36, color: C.pencil, z, opacity: clamp(lt / 0.3) });
    (fx._writes || []).forEach((w, i) => {
      if (!w) return;
      DL.save(); DL.translate(fx._bx(i) + c / 2, -c * 0.31); COMP.write.draw(w, t, F); DL.restore();
    });
    if (fx._tw) { DL.save(); DL.translate(fx._bx(5) + c + 34, -c * 0.31); COMP.write.draw(fx._tw, t, F); DL.restore(); }
    (fx._br || []).forEach((b, j) => {
      if (t < b.t0 || (b.t1 !== undefined && t >= b.t1 + 0.25)) return;
      const op = b.t1 !== undefined ? 1 - clamp((t - b.t1) / 0.25) : 1, xa = fx._bx(b.from) + 8, xb = fx._bx(b.to) + c - 8, y = c / 2 + 74, mid = (xa + xb) / 2;
      stroke(k + '.br' + j, [[xa, y - 14], [xa + 10, y], [mid - 12, y], [mid, y + 16], [mid + 12, y], [xb - 10, y], [xb, y - 14]], { z: Z.annot, w: 5, color: C.red, opacity: op, draw: b.t0 < 0 ? 1 : EASE.out(clamp((t - b.t0) / 0.35)) });
      if (op > 0.02) { DL.save(); DL.translate(mid, y + 22); if (op < 1) DL.scale(1); COMP.write.draw(b.w, t, F); DL.restore(); }
    });
    (fx.ringT || []).forEach(([i, rt, rt1], j) => {
      if (t < rt || (rt1 !== undefined && t >= rt1)) return;
      const x = fx._bx(i) + c / 2;
      stroke(k + '.r' + j, ringPts(k + '.r' + j, x, 0, c * 0.62, c * 0.62, { n: 11, a0: -100, sweep: 385, rv: 0.06 }), { z: Z.annot, w: 5, color: C.red, draw: EASE.out(clamp((t - rt) / 0.3)) });
    });
    DL.restore();
    for (let i = 0; i < 6; i++) F.targets[`${k}.s${i}`] = [cx + sc * (fx._bx(i) + c / 2), cy];
    F.targets[k + '.total'] = [cx + sc * (fx._bx(5) + c + 34 + c * 0.7), cy];
    F.targets[k + '.top'] = [cx, cy - sc * (c / 2 + 34)];
  },
  cues: fx => {
    const c = fx.t0 >= 0 ? [[fx.t0, 'paper']] : [];
    (fx._writes || []).forEach(w => { if (w && w.t0 >= 0) c.push([w.t0, 'pen']); });
    if (fx._tw && fx._tw.t0 >= 0) c.push([fx._tw.t0, 'pen']);
    (fx.ringT || []).forEach(([, rt]) => { if (rt >= 0) c.push([rt, 'pen']); });
    (fx.braces || []).forEach(b => { if (b.t0 >= 0) c.push([b.t0, 'pen']); });
    return c;
  },
};

/* ---------------- 奖牌 ----------------
 * { type: 'e4_medal', id, at: [x, y]（奖牌中心）| char + part（挂在某人脖子上：char: 'terry'）, r: 54, label: '铜', t0, t1, shine: [t…] }
 * 只用墨线：一个圆牌、一条 V 形挂带，中间写“铜”。 */
COMP.e4_medal = {
  draw(fx, t, F) {
    if (t < fx.t0 || (fx.t1 !== undefined && t >= fx.t1)) return;
    const kid = fx.char && CAST[fx.char] && CAST[fx.char].kid, lt = t - fx.t0, r = fx.r || (kid ? 30 : 54), k = fx.id;   // a child's medal is smaller
    let c, neck = null;
    if (fx.char) { const a = F.anchors[fx.char]; if (!a) return; neck = [a.head[0], a.head[1] + a.r * 1.05]; c = [neck[0] + (fx.dx || 0), neck[1] + (fx.drop || (kid ? 44 : r * 1.7))]; }
    else c = fx.pos ? evalTrack(fx.pos, t) : fx.at;
    const pop = fx.t0 < 0 ? 1 : EASE.back(clamp(lt / 0.3)), z = fx.z ?? Z.front + 2;
    DL.save(); DL.about(c[0], c[1], () => DL.scale(pop));
    const top = neck || [c[0], c[1] - r * 2.2];
    stroke(k + '.rL', [[top[0] - r * 0.55, top[1]], [c[0] - r * 0.32, c[1] - r * 0.86]], { z: z - 0.1, w: 4 });
    stroke(k + '.rR', [[top[0] + r * 0.55, top[1]], [c[0] + r * 0.32, c[1] - r * 0.86]], { z: z - 0.1, w: 4 });
    stroke(k + '.disc', ringPts(k, c[0], c[1], r, r, { n: 14, closed: true }), { z, w: 5, closed: true, fill: C.paper });
    stroke(k + '.in', ringPts(k + 'i', c[0], c[1], r * 0.74, r * 0.74, { n: 12, a0: 20, sweep: 300 }), { z: z + 0.1, w: 2.4, color: C.pencil });
    text(k + '.t', fx.label || '铜', c[0], c[1] + 2, { size: r * 0.95, z: z + 0.2 });
    (fx.shine || []).forEach((st, j) => {
      const u = (t - st) / 0.5; if (u < 0 || u > 1) return;
      for (let i = 0; i < 4; i++) {
        const a = (-60 + i * 40) * RAD, r0 = r * 1.25, L = r * 0.45 * Math.sin(Math.PI * u);
        stroke(k + '.sh' + j + i, [[c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0 - r * 0.3], [c[0] + Math.cos(a) * (r0 + L), c[1] + Math.sin(a) * (r0 + L) - r * 0.3]], { z, w: 4 });
      }
    });
    DL.restore();
    F.targets[k + '.c'] = c;
  },
  cues: fx => [[fx.t0, 'ding'], ...(fx.shine || []).map(s => [s, 'plip'])],
};

// 上集回顾：卡住曲线；考奥林匹克跌过一跤（掉到“前 6 名”线下）；根还没扎深；这一集，他又去考了一次。
(() => {
  const FL = 770, TX = 1250;
/** 选拔名次卡：前 6 名进国家队；小陶原来是第 6，后来掉到线下。{at, t0, t1, slide} */
  COMP.h4_rank = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const [cx, cy] = fx.at, lt = t - fx.t0, p = EASE.out(clamp(lt / 0.4)), k = fx.id, z = Z.set + 1, W = 470, RH = 60, top = cy - 200;
      const op = 1 - clamp((t - fx.t1 + 0.25) / 0.25);
      stroke(k + '.card', superPts(cx, cy + 10, W, 500, 24, 12), { z, w: 5, closed: true, fill: C.paper, draw: p, opacity: op });
      const u = EASE.io(clamp((t - fx.slide) / 0.6));
      for (let i = 0; i < 7; i++) {
        const y = top + i * RH + (i === 6 ? 30 : 0), q = clamp((lt - 0.3 - i * 0.12) / 0.2); if (q <= 0) continue;
        text(k + '.n' + i, String(i + 1), cx - W / 2 + 50, y, { size: 50, font: CFG.FONT_MIX, z: z + 0.2, opacity: q * op });
        // other names: pencil scribbles. Row 6 holds 小陶 until the slide, then someone else's scribble moves in.
        const scr = (key, y0, o) => { const pts = []; for (let j = 0; j <= 8; j++) pts.push([cx - W / 2 + 100 + j * 30, y0 + (j % 2 ? -8 : 6)]); stroke(key, pts, { z: z + 0.1, w: 3, color: C.pencil, opacity: o * op, boil: 0.6 }); };
        if (i < 5) scr(k + '.s' + i, y, q);
        if (i === 5) scr(k + '.s5', y, q * u);
      }
      const cut = top + 5 * RH + 36;
      if (lt > 1.2) {
        const dp = EASE.out(clamp((lt - 1.2) / 0.4));
        for (let d = 0; d < 11; d++) { const x0 = cx - W / 2 + 20 + d * 42; stroke(k + '.cut' + d, [[x0, cut], [x0 + 26, cut]], { z: z + 0.3, w: 4, color: C.red, draw: clamp(dp * 11 - d), opacity: op }); }
        text(k + '.cutT', '前 6 名 → 国家队', cx + W / 2 + 24, cut, { size: 46, color: C.red, anchor: 'start', z: Z.annot, opacity: dp * op });
      }
      // 小陶's name: row 6, then sliding below the line to row 7
      const ny = lerp(top + 5 * RH, top + 6 * RH + 30, u), nq = clamp((lt - 1.0) / 0.2);
      if (nq > 0) text(k + '.me', '小陶', cx - W / 2 + 104, ny, { size: 50, anchor: 'start', z: z + 0.4, opacity: nq * op, scale: lerp(0.6, 1, EASE.back(nq)) });
    },
    cues: fx => [[fx.t0, 'paper'], [fx.t0 + 1.2, 'pen'], [fx.slide, 'whoosh']],
  };
/** 一棵小苗：茎蹿得飞快、根很浅，风一吹就晃；后来根一点点扎深，就稳了。
   *  {at: 地面点, t0, t1, h: [[t, 高]], root: [[t, 根深]]} */
  COMP.h4_plant = {
    draw(fx, t) {
      if (t < fx.t0 || (fx.t1 !== undefined && t >= fx.t1)) return;
      const [gx, gy] = fx.at, H = evalTrack(fx.h, t), R = evalTrack(fx.root, t), k = fx.id, z = Z.set + 2;
      const op = fx.t1 !== undefined ? 1 - clamp((t - fx.t1 + 0.3) / 0.3) : 1;
      // ground strip with a few soil specks
      stroke(k + '.g', [[gx - 230, gy], [gx + 230, gy + 2]], { z, w: 4, draw: EASE.out(clamp((t - fx.t0) / 0.4)), opacity: op });
      for (let i = 0; i < 9; i++) dot(k + '.s' + i, [gx - 200 + i * 50 + (i % 3) * 7, gy + 26 + (i % 2) * 34], 3, C.pencil, z);
      // wobble: a tall stem on shallow roots sways a lot
      const ratio = clamp(H / Math.max(30, R * 3.2), 0, 2.2), sway = Math.sin(t * 4.2) * 7 * Math.max(0, ratio - 0.6);
      const pts = []; const n = 8;
      for (let i = 0; i <= n; i++) { const u = i / n; pts.push([gx + Math.sin(u * 2.2) * 6 + sway * u * u, gy - H * u]); }
      stroke(k + '.stem', pts, { z: z + 0.2, w: 5, opacity: op });
      // leaves: pairs along the stem
      const nl = Math.floor(H / 70);
      for (let i = 0; i < nl; i++) {
        const u = (i + 0.7) / (nl + 0.5), p = pts[Math.round(u * n)] || pts[n], s = i % 2 ? 1 : -1, L = 34 + 6 * (i % 2);
        stroke(k + '.lf' + i, [[p[0], p[1]], [p[0] + s * L * 0.55, p[1] - L * 0.55], [p[0] + s * L, p[1] - L * 0.15], [p[0], p[1]]], { z: z + 0.1, w: 3.5, closed: true, fill: C.paper, opacity: op });
      }
      // roots: three main strands that grow down, plus small side roots
      [[-0.5, 0], [0, 1], [0.55, 2]].forEach(([dx, j]) => {
        const rp = []; for (let i = 0; i <= 6; i++) { const u = i / 6; rp.push([gx + dx * R * 0.45 * u + Math.sin(u * 5 + j) * 6, gy + R * u * (j === 1 ? 1 : 0.8)]); }
        if (R > 4) stroke(k + '.r' + j, rp, { z, w: 3.4, opacity: op });
        if (R > 60) [0.4, 0.7].forEach((u, q) => { const p = rp[Math.round(u * 6)]; stroke(k + '.rs' + j + q, [p, [p[0] + (q ? 18 : -18), p[1] + 22]], { z, w: 2.4, opacity: op }); });
      });
    },
  };

  /** 一条小小的卡住曲线：平 → 掉进谷 → 冲上峰（回顾第 3 集） */
  COMP.h4_curve = {
    draw(fx, t) {

// 第 25 场 · 五边形游戏（1986 年 IMO 第 3 题）：五边形顶点上写整数，总和为正；有负数就挑一个，把它变正，再把它（原来的负值）加到两边的邻居上。
// 问：一定会停吗？答：一定会（证明很难）。全场 210 人只有 12 人满分；小陶 3 分，是澳大利亚队这题的全部得分。第一天 7+7+3 = 17 分。
// 演示的 5 步在页面加载时用 JS 重算一遍（和分镜给出的序列不一致就 console.error）。
// 开场 = 第 20 场结尾（小陶在桌前，成绩单 7、7、空，第 2 题的三角形）；结尾只留成绩单（7、7、3）和第 1–3 格下的红括号“17”，交给第 30 场。
(() => {
  const FL = 780, DX = 290, DTOP = 622, DW = 300, SEAT = 640;     // same desk and seat as scene 20
  const SH = E4.SHEET, CELL = SH.cell;
  const cellX = i => SH.at[0] - (6 * CELL + 26) / 2 + i * CELL + (i >= 3 ? 26 : 0) + CELL / 2;
  const CELL_BOT = SH.at[1] + CELL / 2, CELL_L = i => cellX(i) - CELL / 2, CELL_R = i => cellX(i) + CELL / 2;
  const CUT = 25.6;                              // pentagon, desk and Terry leave; the 210 grid comes in
  const DUR = 42.0;

  /* ---------------- the game, re-computed and checked against the storyboard ---------------- */
  const P0 = [2, 1, -2, 0, 1];                  // A (top), B, C, D, E clockwise
  const PICK = [2, 1, 3, 2, 4];                 // C, B, D, C, E
  const EXPECT = [[2, -1, 2, -2, 1], [1, 1, 1, -2, 1], [1, 1, -1, 2, -1], [1, 0, 1, 1, -1], [0, 0, 1, 0, 1]];
  const STATES = [P0];
  PICK.forEach((i, j) => {
    const s = STATES[j], v = s[i];
    if (!(v < 0)) console.error(`d4_pentagon: step ${j + 1} picks ${'ABCDE'[i]} = ${v}, which is not negative`);
    const n = s.slice(); n[i] = -v; n[(i + 4) % 5] += v; n[(i + 1) % 5] += v;
    if (n.join() !== EXPECT[j].join()) console.error(`d4_pentagon: step ${j + 1} gives (${n}) but the storyboard says (${EXPECT[j]})`);
    if (n.reduce((a, b) => a + b, 0) !== 2) console.error('d4_pentagon: the total should stay 2');
    STATES.push(n);
  });
  if (STATES[5].some(v => v < 0)) console.error('d4_pentagon: the game should have stopped after 5 steps');
  const negs = STATES.map(s => s.filter(v => v < 0).length);
  if (negs.join() !== '1,2,1,2,1,0') console.error('d4_pentagon: negatives per step', negs);
  if (7 + 7 + 3 !== 17) console.error('d4_pentagon: day one should be 17');
  if (P0.reduce((a, b) => a + b, 0) !== 2) console.error('d4_pentagon: the five numbers should add up to 2');

  /* ---------------- geometry of the pentagon ---------------- */
  const PC = [800, 505],   // top node sits between the sheet's 第一天 / 第二天 labels
  PR = 212, NR = 54, VS = 64;
  const NODE = [0, 1, 2, 3, 4].map(k => { const a = (-90 + 72 * k) * RAD; return [PC[0] + Math.cos(a) * PR, PC[1] + Math.sin(a) * PR]; });

  /* ---------------- timing ---------------- */
  const INIT_T = [1.9, 2.4, 2.9, 3.4, 3.9];     // the five numbers are written
  // each step: ring round the chosen negative (s) → it is struck and turns positive (flip) → red arrows to both neighbours (arr)
  // → the neighbours' old numbers are struck and the new ones written (nb). Step 1 is the rule, played slowly; steps 2–5 take 1.5 s each.
  const STEPS = [
    { s: 5.75, flip: 7.55, arr: 9.35, nb: 10.6, end: 12.25, slow: true },
    ...[13.1, 14.6, 16.1, 17.6].map(s => ({ s, flip: s + 0.25, arr: s + 0.7, nb: s + 0.85, end: s + 1.42 })),
  ];
  /** a struck number: strike drawn (sd), held (hold), then floats up and fades (FLOAT); the new number is written from tw */
  const STRIKE = slow => (slow ? { sd: 0.25, hold: 0.25, nw: 0.15 } : { sd: 0.1, hold: 0.1, nw: 0.1 }), FLOAT = 0.3;
  const SUM_T = 4.5;                            // “加起来 = 2（是正数）”: the condition that makes the game stop
  const STOP_T = 19.25, MORE_T = 11.5, MORE_T1 = 13.95;
  const SURE_T = 21.35, PROOF_T = 23.15, MTN_T = 23.8, MTN_LAND = 24.06;

  /* ---------------- value history of every node: [{v, tw (write starts), ts (struck by the next one)}] ---------------- */
  const HIST = NODE.map((_, k) => [{ v: P0[k], tw: INIT_T[k], speed: 1900 }]);
  STEPS.forEach((st, j) => {
    const i = PICK[j], after = STATES[j + 1], X = STRIKE(st.slow);
    [[i, st.flip], [(i + 4) % 5, st.nb], [(i + 1) % 5, st.nb]].forEach(([k, ts]) => {
      const H = HIST[k], e = H[H.length - 1];
      e.ts = ts; e.X = X;
      H.push({ v: after[k], tw: ts + X.sd + X.hold + X.nw, speed: st.slow ? 2200 : 3400 });
    });
  });
  HIST.forEach((H, k) => H.forEach(e => {
    e.L = layoutWriting({ text: String(e.v), x: NODE[k][0], y: NODE[k][1] - VS / 2, size: VS, t0: e.tw, speed: e.speed, gap: 0.02, glyphGap: 0.02, anchor: 'middle' });
  }));
  /** step number at time t (-1 = none) */
  const stepAt = t => { let j = -1; STEPS.forEach((st, i) => { if (t >= st.s) j = i; }); return j; };

  /** offset copy of an edge from node a toward node b, pushed outward (away from the centre) */
  const edgeArrow = (a, b, off = 26) => {
    const P = NODE[a], Q = NODE[b], d = dist(P, Q), u = [(Q[0] - P[0]) / d, (Q[1] - P[1]) / d];
    let n = [-u[1], u[0]]; const m = [(P[0] + Q[0]) / 2 - PC[0], (P[1] + Q[1]) / 2 - PC[1]];
    if (n[0] * m[0] + n[1] * m[1] < 0) n = [-n[0], -n[1]];
    return { from: [P[0] + u[0] * (NR + 6) + n[0] * off, P[1] + u[1] * (NR + 6) + n[1] * off], to: [Q[0] - u[0] * (NR + 10) + n[0] * off, Q[1] - u[1] * (NR + 10) + n[1] * off], n, mid: [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2] };
  };
  // Step 1 spells the rule out: the struck −2 does not float away but steps inside the pentagon (GHOST), and both red arrows
  // start from it, each with "+(−2)" — so what goes to the neighbours is visibly the old negative number, not the new 2.
  const G0 = HIST[PICK[0]][0];                                  // C's first value (−2), struck in step 1
  const GHOST = lerp2(NODE[PICK[0]], PC, 0.58);
  G0.ghost = { at: GHOST, end: STEPS[0].end };
  const ghostArrow = nb => {
    const Q = NODE[nb], d = dist(GHOST, Q), u = [(Q[0] - GHOST[0]) / d, (Q[1] - GHOST[1]) / d];
    return { from: [GHOST[0] + u[0] * 40, GHOST[1] + u[1] * 40], to: [Q[0] - u[0] * (NR + 12), Q[1] - u[1] * (NR + 12)] };
  };
  const NB0 = [(PICK[0] + 4) % 5, (PICK[0] + 1) % 5];
  // "+(−2)" written just outside each receiving neighbour (B: to its right, D: up-left, clear of the edges and the floor)
  const ADD_AT = { 1: [NODE[1][0] + NR + 66, NODE[1][1] + 8], 3: [NODE[3][0] - NR - 66, NODE[3][1] - 70] };
  const ADD_LB = NB0.map((k, j) => {
    const c = ADD_AT[k] || [NODE[k][0], NODE[k][1] - NR - 50];
    return layoutWriting({ text: '+(' + P0[PICK[0]] + ')', x: c[0], y: c[1] - 22, size: 44, t0: STEPS[0].arr + 0.3 + j * 0.25, speed: 2800, gap: 0.02, glyphGap: 0.02, anchor: 'middle' });
  });

  COMP.d4_p5pent = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const lt = t - fx.t0, z = Z.board, k = 'd4p5';
      // edges, then the round nodes on top
      for (let i = 0; i < 5; i++) {
        const p = EASE.out(clamp((lt - i * 0.07) / 0.3)); if (p <= 0) continue;
        stroke(`${k}.e${i}`, [NODE[i], NODE[(i + 1) % 5]], { z: z - 0.2, w: 5, draw: p });
      }
      NODE.forEach((c, i) => {
        const u = clamp((lt - 0.2 - i * 0.06) / 0.25); if (u <= 0) return;
        const sc = Math.max(0.01, EASE.back(u));
        DL.save(); DL.translate(c[0], c[1]); DL.scale(sc);
        stroke(`${k}.n${i}`, ringPts(`${k}.n${i}`, 0, 0, NR, NR, { n: 12, closed: true, rv: 0.03 }), { z, w: 5, closed: true, fill: C.paper });
        DL.restore();
      });
      // values: the current one, and the one just struck out floating away
      HIST.forEach((H, n) => H.forEach((e, j) => {
        if (j > 0 && t < e.tw - 0.001) return;
        let fu = 0, op = 1;
        const c = NODE[n];
        DL.save();
        if (e.ghost) {            // step 1's −2: slides inside the pentagon and waits there until the step ends
          const gu = EASE.out(clamp((t - e.ts - e.X.sd - e.X.hold) / 0.35)), g = lerp2(c, e.ghost.at, gu);
          op = 1 - clamp((t - e.ghost.end) / 0.25); if (op <= 0) { DL.restore(); return; }
          DL.translate(g[0], g[1]); DL.scale(1 - 0.2 * gu); DL.translate(-c[0], -c[1]);
        } else {
          if (e.ts !== undefined) { fu = clamp((t - e.ts - e.X.sd - e.X.hold) / FLOAT); if (fu >= 1) { DL.restore(); return; } }
          op = 1 - fu;
          DL.translate(c[0] + 30 * EASE.out(fu), c[1] - 70 * EASE.out(fu)); DL.scale(1 - 0.35 * fu); DL.translate(-c[0], -c[1]);
        }
        e.L.strokes.forEach((st, m) => { const q = clamp((t - st.t0) / st.dur); if (q > 0) stroke(`${k}.v${n}.${j}.${m}`, st.pts, { z: z + 0.3, w: 6.5, draw: q, boil: 0.55, opacity: op }); });
        if (e.ts !== undefined && t >= e.ts) {
          const L = e.L;
          stroke(`${k}.x${n}.${j}`, [[L.x - 10, c[1] + 10], [L.x + L.width + 10, c[1] - 12]], { z: Z.annot, w: 5, color: C.red, draw: EASE.out(clamp((t - e.ts) / e.X.sd)), opacity: op });
        }
        DL.restore();
      }));
      // the step in progress: red ring round the chosen negative, red arrows to its two neighbours
      const j = stepAt(t);
      if (j >= 0 && t < STEPS[j].end) {
        const st = STEPS[j], i = PICK[j], c = NODE[i];
        stroke(`${k}.ring${j}`, ringPts(`${k}.ring${j}`, c[0], c[1], NR + 17, NR + 17, { n: 12, a0: -130, sweep: 385, rv: 0.05 }), { z: Z.annot, w: 5.5, color: C.red, draw: EASE.out(clamp((t - st.s) / (st.slow ? 0.35 : 0.2))) });
        if (t >= st.arr) [(i + 4) % 5, (i + 1) % 5].forEach((nb, m) => {
          const e = st.slow ? ghostArrow(nb) : edgeArrow(i, nb);
          arrow(`${k}.ar${j}.${m}`, e.from, e.to, { p: EASE.out(clamp((t - st.arr - m * 0.05) / (st.slow ? 0.3 : 0.18))), bend: 0.08, color: C.red, w: 4.5, head: 18 });
        });
        if (st.slow && t >= st.arr) ADD_LB.forEach((L, m) => L.strokes.forEach((s, q) => { const u = clamp((t - s.t0) / s.dur); if (u > 0) stroke(`${k}.add${m}.${q}`, s.pts, { z: Z.annot, w: 4.5, color: C.red, draw: u, boil: 0.55 }); }));
      }
    },
    cues: fx => {
      const c = [[fx.t0, 'pen'], [fx.t0 + 0.25, 'pop']];
      HIST.forEach(H => H.forEach((e, j) => { if (j === 0) c.push([e.tw, 'pen']); }));
      STEPS.forEach((st, j) => { const X = STRIKE(st.slow), nw = X.sd + X.hold + X.nw; c.push([st.s, 'pen'], [st.flip, 'pen'], [st.flip + nw, 'plip'], [st.arr, st.slow ? 'swish' : 'tap'], [st.nb, 'pen'], [st.nb + nw, 'plip']); if (st.slow) ADD_LB.forEach(L => c.push([L.t0, 'pen'])); });
      return c;
    },
  };
  /** "第 n 步" in the red pen, top right of the pentagon */
  COMP.d4_p5count = {
    draw(fx, t) {
      if (t >= fx.t1) return;
      const j = stepAt(t); if (j < 0) return;
      const lt = t - STEPS[j].s, pp = EASE.back(clamp(lt / 0.2));
      text('d4p5.cnt', `第 ${j + 1} 步`, fx.at[0], fx.at[1], { size: 52, color: C.red, rot: -3, z: Z.annot, scale: lerp(0.6, 1, pp), halo: 8 });

  /** red word slammed down (“停！”) */

    draw(fx, t) {

  /** “证明” with a little mountain dropped on top of it */
  const PRF = { at: [1275, 652], size: 76 };

  const BRACE_T = 39.0;                         // day one: the shared red brace under boxes 1–3, “17”

      stroke(k + '.arc', pts, { z, w: 4.5 });
      [0, 1].forEach(j => stroke(k + '.sp' + j, [O, at(j ? GARC.a1 : GARC.a0)], { z: z - 0.1, w: 2.2, color: C.pencil, boil: 0.5 }));
      const e = at(GARC.a1), b = at(GARC.a1 - 14), L = dist(b, e) || 1, tx = (b[0] - e[0]) / L, ty = (b[1] - e[1]) / L, hl = 20;

      { t0: 1.1, t1: 5.1, text: '第三题，是五边形上的数字游戏：' },

      { t0: 9.1, t1: 12.5, text: '再把它加到两边的邻居上。' },
      { t0: 13.0, t1: 17.0, text: '问：这个游戏，一定会停下来吗？' },
      { t0: 20.7, t1: 25.3, text: '答案是：一定会。可是要证明，太难了。' },
      { t0: 25.7, t1: 30.7, text: '全场210个人，只有12个人做出满分。', say: '全场两百一十个人，只有十二个人做出满分。' },
      { t0: 31.1, t1: 33.7, text: '小陶拿了3分——', say: '小陶拿了三分——' },
      { t0: 33.8, t1: 38.2, text: '是澳大利亚队在这道题上的全部分数。' },
      { t0: 38.9, t1: 41.5, text: '第一天，17分。', say: '第一天，十七分。' },
    ],
  });

(() => {
  const FL = 780, SH = E4.SHEET, SC = 'b4d.sc';
  const DX = 520, DTOP = 610, DW = 340, SEAT = 618;            // Terry's desk (same build as ep3's exam desk)
  /* ---------------- times (scene clock) ---------------- */
  const FLIP = 0.55, UL0 = 1.95, UL1 = 12.55;                   // calendar 9 → 10; red underline under the sheet's "第二天"
  const W4 = 4.6, W5 = 7.5, W6 = 10.4;                          // the three scores, on "1分" / "0分" / "1分"
  const BR0 = 14.0, BR_OUT = 16.2, A_END = 16.45;              // "2" brace (its number is written 0.3 s later, on "两分"); both braces fade; the exam room goes away
  const GRID0 = 16.5, FILL0 = 17.85, FILL_DT = 0.025, LB57 = 19.3, RING5 = 21.65, B_END = 24.6;
  const G_IN = 24.65, LBG = 24.95, TK = [25.95, 26.65], GAP = 27.3, CARET = 28.5, QM = 28.85, MINUS = 29.85, LBM = 30.05;
  const C_END = 31.75, FADE0 = C_END - 0.3, DUR = 31.9;          // the proof and its marks fade out, the grader zips off

  const EXAMPLE = G_IN + 0.5;
  const fadeOut = t => 1 - clamp((t - FADE0) / 0.3);
  SFX.define('b4_none', () => {});
  SFX.define('b4_tick', tone => { tone('sine', 1400, 1100, 0.03, 0.08); });
  const box = (x0, y0, x1, y1) => [[x0, y0], [x1, y0, 1], [x1, y1, 1], [x0, y1, 1], [x0, y0, 1]];

  /* ---------------- 墙上的撕页日历：9 撕掉，露出 10 ---------------- */
  const CAL = { x: 1255, y: 318, w: 220, h: 262, band: 66 };
  const CAL_9 = layoutWriting({ text: '9', x: 0, y: 0, size: 128, t0: -9, speed: 1, anchor: 'middle' });
  const CAL_10 = layoutWriting({ text: '10', x: 0, y: 0, size: 128, t0: -9, speed: 1, anchor: 'middle' });
  const NUM_Y = CAL.y + CAL.band + (CAL.h - CAL.band) / 2 - 64;  // glyph top so the number sits mid-page
  COMP.b4_cal = {
    draw(fx, t) {
      if (t >= fx.t1) return;
      const { x, y, w, h, band } = CAL, z = Z.set + 1, k = 'b4d.cal';
      stroke(k + '.str', [[x - 58, y + 2], [x, y - 44, 1], [x + 58, y + 2]], { z, w: 2.4, color: C.pencil });
      dot(k + '.nail', [x, y - 44], 4.5, C.ink, z);
      stroke(k + '.sh', [[x - w / 2 + 12, y + h + 8], [x + w / 2 + 8, y + h + 8, 1], [x + w / 2 + 8, y + 12]], { z: z - 0.1, w: 2.4, color: C.pencil, opacity: 0.7, boil: 0.5 });
      stroke(k + '.pg', box(x - w / 2, y, x + w / 2, y + h), { z, w: 5, fill: C.paper });
      stroke(k + '.band', [[x - w / 2, y + band], [x + w / 2, y + band + 1]], { z: z + 0.1, w: 4 });
      text(k + '.m', '7 月', x, y + band / 2 + 2, { size: 46, z: z + 0.2 });
      DL.save(); DL.translate(x, NUM_Y);
      CAL_10.strokes.forEach((s, i) => stroke(k + '.ten' + i, s.pts, { z: z + 0.2, w: 7, boil: 0.5 }));
      DL.restore();
      // yesterday's page: tears off at its top edge, swings, drops and fades
      const u = (t - FLIP) / 0.85;
      if (u < 1) {
        const sw = EASE.out(clamp(u / 0.25)), fall = EASE.in(clamp((u - 0.12) / 0.88));
        const op = 1 - clamp((u - 0.7) / 0.22), z2 = z + 0.5;    // opaque while it still covers the "10", gone before the subtitles
        DL.save();
        DL.translate(x - w / 2 + 40 * fall, y + band + 460 * fall);
        DL.rotate(14 * sw + 40 * fall);                       // hangs from its top-left corner, right side dropping
        stroke(k + '.old', box(0, 0, w, h - band), { z: z2, w: 5, fill: C.paper, opacity: op });
        DL.translate(w / 2, NUM_Y - y - band);
        CAL_9.strokes.forEach((s, i) => stroke(k + '.nine' + i, s.pts, { z: z2 + 0.1, w: 7, boil: 0.5, opacity: op }));
        DL.restore();
      }
      // two binding rings over the top edge
      [-1, 1].forEach(s => stroke(k + '.rg' + s, ringPts(k + '.rg' + s, x + s * 58, y, 11, 16, { n: 8, a0: 100, sweep: 300 }), { z: z + 0.6, w: 4 }));
    },
    cues: () => [[FLIP, 'paper'], [FLIP + 0.15, 'whoosh']],
  };

  /* ---------------- 墙上的钟：每道题一跳，一天四个半小时 ---------------- */
  const CLK = { c: [965, 540], r: 66 };
  const CLK_J = [[3.75, 90], [6.65, 180], [9.55, 270]];        // minutes after the start (4.5 h in all), one jump per problem
  const clkMin = t => { let m = 0; CLK_J.forEach(([tj, v], j) => { if (t >= tj) m = lerp(j ? CLK_J[j - 1][1] : 0, v, EASE.out(clamp((t - tj) / 0.45))); }); return m; };
  const clkPt = (a, rr) => [CLK.c[0] + Math.sin(a * RAD) * rr, CLK.c[1] - Math.cos(a * RAD) * rr];
  COMP.b4_clock = {
    draw(fx, t) {
      if (t >= fx.t1) return;
      const { c, r } = CLK, z = Z.set + 1, k = 'b4d.clk', m = clkMin(t);
      stroke(k + '.nail', [[c[0] - 22, c[1] - r - 2], [c[0], c[1] - r - 28, 1], [c[0] + 22, c[1] - r - 2]], { z, w: 2.2, color: C.pencil });
      stroke(k + '.o', ringPts(k + '.o', c[0], c[1], r, r, { n: 14, a0: -110, sweep: 374, rv: 0.02 }), { z, w: 5.5, fill: C.paper });
      for (let i = 0; i < 12; i++) { const big = i % 3 === 0; stroke(k + '.t' + i, [clkPt(i * 30, r * (big ? 0.64 : 0.72)), clkPt(i * 30, r * 0.84)], { z: z + 0.1, w: big ? 4 : 2.4 }); }
      CLK_J.forEach(([tj, v], j) => {              // pencil motion blur behind the minute hand while it whirls
        const u = (t - tj) / 0.5; if (u <= 0 || u >= 1) return;
        const a1 = m * 6, a0 = a1 - 80;
        [0.46, 0.58].forEach((rr, q) => stroke(k + '.bl' + j + q, [0, 1, 2, 3, 4, 5].map(i => clkPt(lerp(a0, a1, i / 5) - 6, r * rr)), { z: z + 0.15, w: 2.4, color: C.pencil, opacity: 1 - u, boil: 0.6 }));
      });
      stroke(k + '.hh', [c, clkPt(270 + m * 0.5, r * 0.42)], { z: z + 0.2, w: 6 });   // starts at 9 o'clock
      stroke(k + '.hm', [c, clkPt(m * 6, r * 0.66)], { z: z + 0.2, w: 4.2 });
      dot(k + '.cd', c, 4.5, C.ink, z + 0.3);
    },
    cues: () => CLK_J.map(([tj]) => [tj, 'b4_whirr']),
  };
  SFX.define('b4_whirr', tone => { tone('triangle', 420, 1300, 0.22, 0.06, [28, 90]); });

  /* ---------------- 课桌上的三张题纸 + 小陶手里的铅笔 ---------------- */
  COMP.b4_desk = {
    draw(fx, t, F) {
      if (t >= fx.t1) return;
      const z = Z.desk + 1, k = 'b4d.dk';
      // two sheets stacked at the right (seen a little from above), the one he works on in front of him
      stroke(k + '.s2', [[DX + 64, DTOP + 1], [DX + 80, DTOP - 26, 1], [DX + 156, DTOP - 30, 1], [DX + 152, DTOP + 1, 1], [DX + 64, DTOP + 1, 1]], { z, w: 3.6, fill: C.paper });
      stroke(k + '.s3', [[DX + 70, DTOP - 3], [DX + 90, DTOP - 32, 1], [DX + 160, DTOP - 34, 1], [DX + 158, DTOP - 3, 1], [DX + 70, DTOP - 3, 1]], { z: z + 0.05, w: 3.6, fill: C.paper });
      stroke(k + '.s1', [[DX - 112, DTOP + 1], [DX - 92, DTOP - 36, 1], [DX + 58, DTOP - 36, 1], [DX + 70, DTOP + 1, 1], [DX - 112, DTOP + 1, 1]], { z: z + 0.1, w: 4.2, fill: C.paper });
      // a few lines of his working (grow a little as the day goes on)
      const nl = 1 + Math.min(3, Math.floor(t / 4));
      for (let r = 0; r < nl; r++) {
        const yy = DTOP - 28 + r * 7, x0 = DX - 88 + r * 2, len = 70 + rnd(hstr(k), r, 1) * 20, pts = [];
        for (let j = 0; j <= 6; j++) pts.push([x0 + len * j / 6, yy + (j % 2 ? -1.6 : 1.2)]);
        stroke(k + '.w' + r, pts, { z: z + 0.15, w: 1.8, boil: 0.6 });
      }
      const a = F.anchors.terry; if (!a) return;
      const h = a.handR;
      stroke(k + '.pencil', [[h[0] - 5, h[1] + 8], [h[0] + 13, h[1] - 24]], { z: Z.front + 1, w: 4.5 });
    },
  };

  /** a red underline under the sheet's own "第二天" label (centre of boxes 4–6, 90 below the boxes' centre line) */
  COMP.b4_ul = {
    draw(fx, t, F) {
      if (t < fx.t0 || t >= fx.t1) return;
      const c = F.targets[SC + '.s4']; if (!c) return;
      const y = SH.at[1] + SH.cell / 2 + 70;
      stroke('b4d.ul', [[c[0] - 62, y + 2], [c[0], y], [c[0] + 62, y - 3]], { z: Z.annot, w: 4.5, color: C.red, draw: EASE.out(clamp((t - fx.t0) / 0.3)) });
    },
    cues: fx => [[fx.t0, 'pen']],
  };

  /* ---------------- 全场 210 人：57 个人满分（涂黑） ---------------- */
  const GR = { cols: 21, rows: 10, cell: 33, cx: 800, top: 334, r: 11.5, n: 57 };
  const GX0 = GR.cx - GR.cols * GR.cell / 2;
  const cellC = i => [GX0 + (i % GR.cols + 0.5) * GR.cell, GR.top + (Math.floor(i / GR.cols) + 0.5) * GR.cell];
  if (GR.cols * GR.rows !== 210) console.error('b4d: the grid must hold 210 contestants');
  COMP.b4_grid = {
    draw(fx, t) {
      if (t < GRID0 || t >= B_END) return;
      const k = 'b4d.g', z = Z.set + 2;
      for (let i = 0; i < GR.cols * GR.rows; i++) {
        const r = Math.floor(i / GR.cols), c = i % GR.cols, a = EASE.back(clamp((t - GRID0 - (r + c) * 0.012) / 0.16));
        if (a <= 0.01) continue;
        const [x, y] = cellC(i), full = i < GR.n && t >= FILL0 + i * FILL_DT;
        stroke(k + i, ringPts(k + i, x, y, GR.r * a, GR.r * a, { n: 8, closed: true, rv: 0.06 }), { z, w: 2.8, closed: true, fill: full ? C.ink : C.paper, boil: 0.6 });
      }
    },
    cues: () => [[GRID0, 'paper'], ...Array.from({ length: 10 }, (_, j) => [FILL0 + j * 6 * FILL_DT, 'tap'])],
  };

  /* ---------------- 阅卷：一份缺了一步的证明 ---------------- */
  const PP = { x0: 500, y0: 324, x1: 1070, y1: 760 };
  const LINES = [{ y: 466, words: [120, 64, 150] }, { y: 528, words: [92, '=', 170] }, { y: 664, words: ['→', 110, 140] }, { y: 724, words: [150, 70, '□'] }];
  const GAP_Y = 596, MARGIN_X = 538, SCORE = [932, 338, 1042, 404];
  const SLOT = [624, GAP_Y - 30, 900, GAP_Y + 30];                // the empty place where a step should be
  COMP.b4_proof = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const lt = t - fx.t0, fo = fadeOut(t), p = EASE.out(clamp(lt / 0.4)), z = Z.set + 1, k = 'b4d.pf', { x0, y0, x1, y1 } = PP;
      stroke(k, box(x0, y0, x1, y1), { z, w: 5, fill: C.paper, draw: p, opacity: fo });
      stroke(k + '.sh', [[x0 + 14, y1 + 8], [x1 + 8, y1 + 8, 1], [x1 + 8, y0 + 14]], { z: z - 0.1, w: 2.5, color: C.pencil, opacity: 0.7 * p * fo, boil: 0.5 });
      stroke(k + '.mg', [[MARGIN_X + 22, y0 + 100], [MARGIN_X + 22, y1 - 18]], { z: z + 0.1, w: 2, color: C.pencil, opacity: 0.6 * p * fo, boil: 0.4 });
      if (lt < 0.25) return;
      const q = clamp((lt - 0.25) / 0.2) * fo;
      text(k + '.t', '证明', x0 + 60, y0 + 48, { size: 50, anchor: 'start', z: z + 0.2, opacity: q });
      // not his paper: just an example of how marking works
      const eq = clamp((t - EXAMPLE) / 0.2) * fo;
      if (eq > 0) text(k + '.ex', '（举个例子）', x0 + 172, y0 + 50, { size: 40, anchor: 'start', color: C.red, z: Z.annot, opacity: eq, scale: lerp(0.7, 1, EASE.back(clamp((t - EXAMPLE) / 0.2))) });
      stroke(k + '.sc', box(...SCORE), { z: z + 0.2, w: 3.5, opacity: q });
      // the written lines: little scribbled "words" with a few maths signs; the third line is missing
      LINES.forEach((L, li) => {
        let x = MARGIN_X + 46;
        L.words.forEach((wd, wi) => {
          const kk = k + '.l' + li + 'w' + wi;
          if (typeof wd === 'string') {
            const G = GLYPH[wd], s = 40;
            G.s.forEach((sg, si) => stroke(kk + '.' + si, sg.map(([u, v, c]) => [x + u * s, L.y - s * 0.62 + v * s, c]), { z: z + 0.2, w: 4, opacity: q, boil: 0.5 }));
            x += G.w * s + 18;
            return;
          }
          const pts = [], n = Math.round(wd / 9);
          for (let j = 0; j <= n; j++) pts.push([x + wd * j / n, L.y + (j % 2 ? -5 : 4) + rnd(hstr(kk), j, 3) * 2]);
          stroke(kk, pts, { z: z + 0.2, w: 3, opacity: q, boil: 0.6 });
          x += wd + 22;
        });
      });
      // when the grader gets there: the gap shows up as an empty dashed slot
      const sp = clamp((t - GAP) / 0.35);
      if (sp > 0) {
        const [a, b, c, d] = SLOT, segs = [];
        for (let xx = a; xx < c - 4; xx += 26) segs.push([[xx, b], [Math.min(c, xx + 14), b]], [[xx, d], [Math.min(c, xx + 14), d]]);
        for (let yy = b; yy < d - 4; yy += 26) segs.push([[a, yy], [a, Math.min(d, yy + 14)]], [[c, yy], [c, Math.min(d, yy + 14)]]);
        segs.forEach((sg, i) => stroke(k + '.slot' + i, sg, { z: z + 0.2, w: 3, color: C.pencil, opacity: sp * fo, boil: 0.5 }));
      }
    },
    cues: fx => [[fx.t0, 'paper']],
  };
  /** the insertion caret "∧" at the gap (the missing step) */
  COMP.b4_caret = {
    draw(fx, t) {
      if (t < fx.t0 || t >= fx.t1) return;
      const [x, y] = fx.at;
      stroke('b4d.caret', [[x - 20, y + 22], [x, y - 22, 1], [x + 20, y + 22]], { z: Z.annot, w: 6, color: C.red, draw: EASE.out(clamp((t - fx.t0) / 0.22)), opacity: fadeOut(t) });
    },
    cues: fx => [[fx.t0, 'pen']],
  };
  /** a red hand-written mark (✓ ? −) that fades out with the proof */
  COMP.b4_mark = {
    init: layoutWriting,
    draw(fx, t) {
      if (t >= fx.t1) return;
      const op = fadeOut(t);
      fx.strokes.forEach((s, i) => { const q = clamp((t - s.t0) / s.dur); if (q > 0) stroke(fx.id + '.s' + i, s.pts, { z: Z.annot, w: fx.w || 6, color: C.red, draw: q < 1 ? q : undefined, boil: 0.55, opacity: op }); });
    },
    cues: fx => fx.strokes.map(s => [s.t0, fx.sfx || 'pen']),
  };
  /** the grader's red pen (red barrel, ink outline), held in his right hand with the nib down toward the paper */
  const PEN_D = [16, 26], PEN_U = (() => { const l = Math.hypot(...PEN_D); return [PEN_D[0] / l, PEN_D[1] / l]; })();
  COMP.b4_pen = {
    draw(fx, t, F) {
      const a = F.anchors.grader; if (!a || t >= fx.t1) return;
      const h = a.handR, [ux, uy] = PEN_U, nx = -uy * 6, ny = ux * 6;
      const top = [h[0] - ux * 30, h[1] - uy * 30], nib = [h[0] + ux * 20, h[1] + uy * 20], tip = [h[0] + PEN_D[0] + ux * 4, h[1] + PEN_D[1] + uy * 4];
      const op = fadeOut(t);
      stroke('b4d.pen', [[top[0] + nx, top[1] + ny], [nib[0] + nx, nib[1] + ny, 1], [nib[0] - nx, nib[1] - ny, 1], [top[0] - nx, top[1] - ny, 1], [top[0] + nx, top[1] + ny, 1]], { z: Z.front + 1, w: 3, fill: C.red, opacity: op });
      stroke('b4d.penTip', [[nib[0] + nx * 0.8, nib[1] + ny * 0.8], [tip[0], tip[1], 1], [nib[0] - nx * 0.8, nib[1] - ny * 0.8]], { z: Z.front + 1, w: 3, fill: C.paper, opacity: op });
    },
  };
  // where the pen tip is (absolute); the hand follows it with IK
  const TIP = [[0, [556, 700]], [TK[0] - 0.3, [MARGIN_X, LINES[0].y - 8], 0.25], [TK[1] - 0.3, [MARGIN_X, LINES[1].y - 8], 0.25], [GAP, [572, GAP_Y + 4], 0.3],
    [CARET - 0.05, [584, GAP_Y + 14], 0.15], [QM - 0.05, [600, GAP_Y + 8], 0.2], [MINUS - 0.3, [556, 700], 0.3]];
  const tipAt = t => evalTrack(TIP, t);
  // he stands well to the left of the paper (face clear of it) and reaches across from the side, elbow down, so the
  // pen arm never crosses his face; the free hand steadies the paper's lower left edge
  const GX = 330, GR_BASE = { lean: 6, tilt: 4, armScale: 1.65, ikL: { w: 1, to: 'abs', dx: PP.x0 + 6, dy: 712, bend: 'down' } };
  const graderPose = t => {
    const p = tipAt(t), w = 1 - clamp((t - (C_END - 0.35)) / 0.12);      // lets go of the pen target as he zips off
    return { ...GR_BASE, ikL: { ...GR_BASE.ikL, w }, ikR: { w, to: 'abs', dx: p[0] - PEN_D[0], dy: p[1] - PEN_D[1], bend: 'down' }, armL: [20, 14], armR: [20, 14] };
  };

  /* ---------------- poses ---------------- */
  const SIT = POSE.sitBase;
  const desk = (dx, dy = -3, bend = 'down') => ({ w: 1, to: 'desk', dx, dy, bend });
  Object.assign(POSE, {
    b4_think: { ...SIT, tilt: -7, lean: 1, ikL: desk(-50), ikR: { w: 1, to: 'chin', dx: 0.3, dy: 0.04, bend: 'down' } },
  });
  // working hard, not upset: focus brows, eyes narrowed, mouth pressed flat (the built-in 'effort' frown can read as sad)
  Object.assign(FACE, { b4_hard: { lidL: 0.22, lidR: 0.22, brow: 'line', browL: 16, browR: 16, mouth: 'flat', mw: 0.16 } });
  /** writing: the pencil hand scribbles along the line (pure function of t) */
  const writing = (lean, tilt) => t => ({ ...SIT, lean, tilt, ikL: desk(-52), ikR: desk(22 + 12 * Math.sin(t * 6.3), -6 - 4 * Math.abs(Math.sin(t * 12.6))) });

  defineScene({
    id: 'day2', chapter: '第二天', dur: DUR, floor: FL,
    cast: { terry: { ...E4.terry, desk: [DX, DTOP - 3] }, grader: { ...E4.grader } },
    tracks: {
      terry: {
        pos: [[0, [DX, SEAT]], [A_END, [-600, SEAT], 0]],
        pose: [[0, writing(3, 12)], [W5 - 0.9, 'b4_think', 0.14, 'back'], [W6 - 0.9, writing(6, 15), 0.14, 'back']],
        face: [[0, 'focus'], [W6 - 0.9, 'b4_hard', 0.08], [12.6, 'neutral', 0.1]],
        turn: [[0, 0.15], [W5 - 0.9, -0.1, 0.14], [W6 - 0.9, 0.15, 0.14]],
        gaze: [[0, 'paper'], [W5 - 0.9, 'up'], [W6 - 0.9, 'paper']],
        squash: [[0, 1], [W5 - 0.9, 1.04, 0.05], [W5 - 0.84, 1, 0.2, 'back'], [W6 - 0.9, 0.96, 0.05], [W6 - 0.84, 1, 0.2, 'back']],
      },
      grader: {
        enter: G_IN,
        pos: [[0, [GX, FL]], [C_END - 0.35, [-700, FL], 0.35, 'in']],
        pose: [[0, graderPose]],
        face: [[0, 'neutral'], [TK[0], 'focus', 0.06], [GAP + 0.1, 'puzzled', 0.06], [CARET, 'focus', 0.06]],
        turn: [[0, 0.4], [MINUS - 0.2, 0.15, 0.15]],
        gaze: [[0, 'tip'], [MINUS - 0.2, 'viewer']],
      },
    },
    targets: F => ({ paper: [DX - 20, DTOP - 18], up: [DX + 140, DTOP - 260], tip: tipAt(F.t) }),
    set: [
      { type: 'floor', t1: A_END },
      { type: 'floor', t0: G_IN },
      { type: 'stool', x: DX, seat: SEAT, t1: A_END },
      { type: 'desk', x: DX, top: DTOP, w: DW, t1: A_END },
    ],
    fx: [
      { type: 'ageStamp', age: 10, t0: -3, ...E4.STAMP, dockT: -2 },
      // the score sheet: 7, 7, 3 from yesterday; today 1, 0, 1
      // the shared braces: scene 25's "17" is already there (fades out with the exam room), the "2" comes on "两分"
      { type: 'e4_scores', id: SC, at: SH.at, cell: SH.cell, t0: -1, scores: [[7, -5], [7, -5], [3, -5], [1, W4], [0, W5], [1, W6]],
        braces: [{ from: 0, to: 2, label: '17', t0: -1, t1: BR_OUT }, { from: 3, to: 5, label: '2', t0: BR0, t1: BR_OUT }],
        ringT: [[4, RING5, B_END]] },   // the ring on the 0 goes away before the grader: his own paper isn't shown
      { type: 'b4_ul', id: 'b4d.ul', t0: UL0, t1: UL1 },
      // exam room, day two
      { type: 'b4_cal', id: 'b4d.cal', t1: A_END },
      { type: 'b4_clock', id: 'b4d.clock', t1: A_END },
      { type: 'b4_desk', id: 'b4d.desk', t1: A_END },

// 第 60 场 · 错误侦探：小陶戴上侦探帽、拿起放大镜。黑板上是一道“假设”的例子：1+2+…+20，两头配成对，每对 21；
// “一共 20 对”（错的就是这一步，先不揭晓）→ 20×21=420。小问号举牌：420？太大了吧？一只手拿着橡皮伸过来，被小陶拦住：先别擦！
// 侦探三步：① 承认错了（圈出 420）——上限检查：20 个数、每个最多 20 → 20×20=400，420 > 400，肯定错；
// ② 往回找：放大镜沿着算式一行行往回移，停在“20 对”上（停顿：轮到你了）；
// ③ 改正，再检查：20 个数两个两个配 → 10 对；10×21=210 ✓，210 < 400 ✓。
// 开场：黑板空着，小陶站在右边；结尾：黑板写满，小陶戴着侦探帽举着放大镜欢呼。
(() => {
  const FL = 780, TX = 1330;
  const BD = { x0: 40, y0: 86, x1: 1150, y1: 664 };
  const LX = 100, RCX = 888;                                   // left column (the sum) / right column (the checks)
  const QP = [630, BD.y1 + 12];                                // 小问号 stands on the chalk tray, next to 420

  /* ---------------- the maths, checked ---------------- */
  const N = 20, PAIR = N + 1, NPAIRS = N / 2;
  let SUM = 0; for (let i = 1; i <= N; i++) SUM += i;
  const COLS = Array.from({ length: NPAIRS }, (_, i) => [i + 1, N - i]);   // 1+20, 2+19, …, 10+11
  if (SUM !== 210) console.error('x4_detective: 1+…+20 should be 210', SUM);
  if (N * PAIR !== 420 || N * N !== 400 || NPAIRS * PAIR !== 210 || NPAIRS !== 10) console.error('x4_detective: arithmetic');
  if (COLS.some(([a, b]) => a + b !== PAIR) || COLS.length * 2 !== N || NPAIRS * PAIR !== SUM) console.error('x4_detective: pairs');
  if (!(N * PAIR > N * N) || !(NPAIRS * PAIR < N * N)) console.error('x4_detective: bounds');
  const S = {
    rowA: '1+2+3+…+' + N, d1: `${N}×${PAIR}`, d2: '=' + N * PAIR, e: `${NPAIRS}×${PAIR}=${NPAIRS * PAIR}`,
    max: `${N}×${N}=${N * N}`, gt: `${N * PAIR}>${N * N}`, lt: `${NPAIRS * PAIR}<${N * N}`,
  };
  if (S.d1 + S.d2 !== '20×21=420' || S.e !== '10×21=210' || S.max !== '20×20=400' || S.gt !== '420>400' || S.lt !== '210<400') console.error('x4_detective: board text', S);

  /* ---------------- timing ---------------- */
  const T = {
    HAT0: 2.45, HAT1: 2.78, LENS: 3.35, PEEK1: 5.15, TITLE: 3.75, HYPO: 5.55,
    A: 6.85, B1: 10.85, B2: 12.0, B3: 13.2, U1: 14.3, U2: 14.8, BR: 17.5, C20: 17.75, D1: 18.95, D2: 20.5,
    QIN: 22.5, QSIGN: 23.15, QOUT: 26.55, QEND: 27.25,
    ER0: 26.95, ERHIT: 27.38, EROUT: 28.95, EREND: 29.5, STOP: 27.15, NOERASE: 27.5,
    S1: 29.85, RING: 31.95, CUO: 32.35,
    GRID: 34.35, MAX: 36.45, W400: 38.3, HI: 39.75, GT: 41.0, RING2: 42.1, FADE: 44.25,
    S2: 44.6, FLY0: 44.75, FLY1: 45.2,
    TURN: 49.2, PAUSE: 53.6, TURN1: 54.15,
    L21: 54.3, CK21: 56.2, L20: 57.85, NUM: 58.35, OVAL: 59.25, PAIRS10: 60.35, BACK0: 60.3, BACK1: 60.7,
    RING20: 60.85, STRIKE20: 61.2, TEN: 61.45,
    S3: 62.6, STRIKED: 63.75, E: 67.05, CKE: 68.65, LT: 69.55, CKLT: 70.75, CHEER: 71.05, DUR: 73.2,
  };

  /* ---------------- board layout (handwritten rows) ---------------- */
  const SZ = { A: 60, B: 60, U: 44, C: 60, D: 64 };
  const Y = { A: 112, B: 212, BR21: 284, U: 300, BRL: 358, C: 382, D: 476, E: 572 };
  const lay = fx => layoutWriting({ ...fx });
  const W = (id, text, x, y, size, t0, o = {}) => ({ type: 'write', id, text, x, y, size, t0, speed: 2300, w: 6, ...o });
  const wA = W('x4a', S.rowA, LX, Y.A, SZ.A, T.A, { speed: 2700 });
  const PSTR = ([a, b]) => `(${a}+${b})`;   // (1+20), (2+19): built from COLS so the board can only show true pairs
  const wB1 = W('x4b1', PSTR(COLS[0]), LX, Y.B, SZ.B, T.B1);
  const B1 = lay(wB1);
  const wB2 = W('x4b2', '+' + PSTR(COLS[1]), B1.xEnd, Y.B, SZ.B, T.B2);
  const B2 = lay(wB2);
  const wB3 = W('x4b3', '+…', B2.xEnd, Y.B, SZ.B, T.B3);
  const B3 = lay(wB3);
  const PAIRS = [[B1.boxes[0], B1.boxes[5]], [B2.boxes[1], B2.boxes[6]]].map(([a, b]) => [a.x, b.x + b.w]);
  const BEND = B3.boxes[1].x + B3.boxes[1].w, BMID = (LX + BEND) / 2;
  const w21 = PAIRS.map(([x0, x1], i) => W('x4u' + i, String(PAIR), (x0 + x1) / 2, Y.U, SZ.U, i ? T.U2 + 0.12 : T.U1 + 0.12, { anchor: 'middle', speed: 2400, w: 5.5 }));
  // “20 对” (red, under the long brace): the digits are written, 对 is lettered; later struck and corrected to “→10 对”
  const C20W = writeWidth(String(N), SZ.C), C_X = BMID - (C20W + 8 + SZ.C) / 2;
  const wC20 = W('x4c20', String(N), C_X, Y.C, SZ.C, T.C20, { speed: 2600 });
  const DUI1 = [C_X + C20W + 8 + SZ.C / 2, Y.C + SZ.C / 2];
  const TEN_X = DUI1[0] + SZ.C / 2 + 22;
  const wTen = W('x4ten', '→' + NPAIRS, TEN_X, Y.C, SZ.C, T.TEN, { color: 'red', speed: 2800, w: 6, z: Z.annot, sfx: 'pen' });
  const TEN = lay(wTen), DUI2 = [TEN.x + TEN.width + 8 + SZ.C / 2, DUI1[1]];
  const wD1 = W('x4d1', S.d1, LX, Y.D, SZ.D, T.D1);
  const D1 = lay(wD1);
  const wD2 = W('x4d2', S.d2, D1.xEnd, Y.D, SZ.D, T.D2);
  const D2 = lay(wD2);
  const R420 = (() => { const a = D2.boxes[1], b = D2.boxes[3]; return [a.x, Y.D, b.x + b.w - a.x, SZ.D]; })();
  const DEND = D2.boxes[3].x + D2.boxes[3].w;
  const wE = W('x4e', S.e, LX, Y.E, SZ.D, T.E, { speed: 2200 });
  const E = lay(wE);
  // right column: the upper bound
  const RS = 56, RY = { max: 294, gt: 372, lt: 452 };
  const wMax = W('x4w400', S.max, RCX, RY.max, RS, T.W400, { anchor: 'middle' });
  const wGt = W('x4gt', S.gt, RCX, RY.gt, RS, T.GT, { anchor: 'middle', color: 'red', speed: 2800, w: 5.5, z: Z.annot, sfx: 'pen' });
  const wLt = W('x4lt', S.lt, RCX, RY.lt, RS, T.LT, { anchor: 'middle', color: 'red', speed: 2800, w: 5.5, z: Z.annot, sfx: 'pen' });
  const LT = lay(wLt);
  const CK = (id, x, y, size, t0) => ({ type: 'write', id, text: '✓', x, y, size, t0, speed: 1700, color: 'red', w: 6, sfx: 'pen', z: Z.annot });

  /* ---------------- the blackboard (no eraser on the tray: the eraser comes later, held by a hand) ---------------- */
  SETDRAW.x4_board = (s, p) => {
    const { x0, y0, x1, y1 } = BD, z = Z.set;
    const rect = (k, a, b, c, d, i, w) => stroke(k, [[a, b], [c, b, 1], [c, d, 1], [a, d, 1], [a, b - 2]], { z, w, draw: stag(p, i, 3) });
    rect('x4bd.o', x0, y0, x1, y1, 0, 6);
    rect('x4bd.i', x0 + 14, y0 + 14, x1 - 14, y1 - 14, 1, 3.5);
    stroke('x4bd.tray', [[x0 + 30, y1 + 12], [x1 - 30, y1 + 12]], { z, w: 5, draw: stag(p, 2, 3) });
    for (let i = 0; i < 4; i++) stroke('x4bd.dust' + i, [[x0 + 60 + i * 13, y1 - 30], [x0 + 84 + i * 13, y1 - 58]], { z, w: 1.8, color: C.pencil, opacity: 0.5 * stag(p, 2, 3), boil: 0.5 });
  };

  /** fade any component out over 0.3 s from fx.fadeT (multiplies the opacity of what it draws) */
  COMP.x4_fade = {
    init(fx) { const c = COMP[fx.inner.type]; fx.inner.t1 = fx.fadeT + 0.3; if (c.init) c.init(fx.inner); return fx; },
    draw(fx, t, F) {
      const n0 = DL.items.length; COMP[fx.inner.type].draw(fx.inner, t, F);
      const f = 1 - clamp((t - fx.fadeT) / 0.3); if (f >= 1) return;
      for (let i = n0; i < DL.items.length; i++) { const a = DL.items[i].attrs; a.opacity = +((a.opacity ?? 1) * f).toFixed(3); }
    },
    cues: fx => (COMP[fx.inner.type].cues ? COMP[fx.inner.type].cues(fx.inner) : []),
  };

  /* ---------------- curly braces (ink under each pair, red under all of them) ---------------- */
  COMP.x4_brace = {
    draw(fx, t) {
      if (t < fx.t0) return;
      const { x0, x1, y, d } = fx, xm = (x0 + x1) / 2, h = d / 2;
      const pts = [[x0, y], [x0 + 6, y + h * 0.8], [x0 + 16, y + h], [xm - 12, y + h], [xm - 3, y + h * 1.2], [xm, y + d, 1], [xm + 3, y + h * 1.2], [xm + 12, y + h], [x1 - 16, y + h], [x1 - 6, y + h * 0.8], [x1, y]];
      stroke(fx.id, pts, { z: fx.color === 'red' ? Z.annot : Z.board, w: fx.w || 3.5, color: fx.color === 'red' ? C.red : C.ink, draw: EASE.out(clamp((t - fx.t0) / 0.3)), boil: 0.6 });
    },
    cues: fx => [[fx.t0, fx.color === 'red' ? 'pen' : 'chalk']],
  };

  /* ---------------- 20 boxes, 2 rows × 10 columns: first the upper bound, later the pairs ---------------- */
  const G = { x0: RCX - 230, y0: 150, cell: 46 }, GC = c => G.x0 + (c + 0.5) * G.cell;
  COMP.x4_grid = {
    draw(fx, t) {
      if (t < T.GRID) return;
      const z = Z.board, c = G.cell, fadeMax = 1 - clamp((t - T.FADE) / 0.3);
      for (let i = 0; i < N; i++) {
        const col = i % 10, row = Math.floor(i / 10), x = G.x0 + col * c, y = G.y0 + row * c;
        const p = EASE.out(clamp((t - T.GRID - i * 0.025) / 0.15)); if (p <= 0) continue;
        stroke('x4g.b' + i, [[x, y], [x + c, y, 1], [x + c, y + c, 1], [x, y + c, 1], [x, y, 1]], { z, w: 3.5, draw: p, boil: 0.6 });
        // “at most 20” in every box (pencil), until step 2
        const m = clamp((t - T.MAX - i * 0.03) / 0.1) * fadeMax;
        if (m > 0) text('x4g.m' + i, String(N), x + c / 2, y + c / 2 + 1, { size: 30, font: CFG.FONT_MIX, color: C.pencil, opacity: m, z: z + 0.1 });
        // the real numbers: top row 1…10, bottom row 20…11 — every column is one pair
        const v = row === 0 ? COLS[col][0] : COLS[col][1], q = clamp((t - T.NUM - col * 0.07) / 0.1);
        if (q > 0) text('x4g.n' + i, String(v), x + c / 2, y + c / 2 + 1, { size: 32, font: CFG.FONT_MIX, opacity: q, z: z + 0.1, scale: lerp(1.4, 1, EASE.out(q)) });
      }
      COLS.forEach((_, col) => {
        const p = EASE.out(clamp((t - T.OVAL - col * 0.1) / 0.15)); if (p <= 0) return;
        stroke('x4g.o' + col, superPts(GC(col), G.y0 + c, c - 6, 2 * c + 16, 18, 3), { z: Z.annot, w: 3.8, color: C.red, closed: true, draw: p });
      });
      const lab = (k, s, y, t0, op = 1) => {
        const lt = t - t0; if (lt < 0 || op <= 0) return;
        text(k, s, RCX, y, { size: 38, color: C.red, z: Z.annot, opacity: clamp(lt / 0.08) * op, scale: lerp(0.6, 1, EASE.back(clamp(lt / 0.2))), halo: 8 });
      };
      const tidy = 1 - clamp((t - T.E) / 0.3);                     // once 10×21 is written, the grid's labels step back
      lab('x4g.l0', N + ' 个数', 126, T.GRID + 0.15, tidy);
      lab('x4g.l1', '每个最多 ' + N, 270, T.MAX + 0.1, fadeMax);
      lab('x4g.l2', '两个两个配：' + NPAIRS + ' 对', 270, T.PAIRS10, tidy);
    },
    cues: () => [[T.GRID + 0.15, 'pop'], [T.MAX + 0.1, 'pop'], ...COLS.map((_, i) => [T.NUM + i * 0.07, 'tap']), ...COLS.map((_, i) => [T.OVAL + i * 0.1, 'plip']), [T.PAIRS10, 'pop']],
  };

  /* ---------------- 侦探三步 (red, under the 错误侦探 title) ---------------- */
  const STEPS = [['1', '承认错了', T.S1], ['2', '往回找', T.S2], ['3', '改正，再检查', T.S3]];
  COMP.x4_steps = {
    draw(fx, t) {
      STEPS.forEach(([n, s, t0], i) => {
        const lt = t - t0; if (lt < 0) return;
        const y = fx.y + i * fx.dy, k = fx.id + i, pp = EASE.back(clamp(lt / 0.22));
        DL.save(); DL.translate(fx.x + fx.size * 0.56, y); DL.scale(lerp(0.5, 1, pp));
        const rr = fx.size * 0.56;
        stroke(k + '.o', ringPts(k + '.o', 0, 0, rr, rr, { n: 10, a0: -110, sweep: 375, rv: 0.05 }), { z: Z.annot, w: 4.5, color: C.red, draw: EASE.out(clamp(lt / 0.3)) });
        const g = GLYPH[n], gs = fx.size * 0.78;
        g.s.forEach((st, j) => stroke(k + '.n' + j, st.map(([u, v, c]) => [(u - g.w / 2) * gs, (v - 0.5) * gs, c]), { z: Z.annot, w: 4.5, color: C.red, draw: clamp((lt - 0.1) / 0.18), boil: 0.6 }));
        DL.restore();
        text(k + '.t', s, fx.x + fx.size * 1.32, y + 2, { size: fx.size, anchor: 'start', color: C.red, opacity: clamp((lt - 0.12) / 0.12), halo: 8 });
      });
    },
    cues: () => STEPS.map(([, , t0]) => [t0, 'pop']),
  };

  /* ---------------- the detective hat (a deerstalker; the tuft pokes out of the top) ---------------- */
  const HAT = { band: -0.82, rx: 1.04, ry: 0.94, tilt: 7 };
  const headFrame = (a, t, id) => {
    const hx = a.head[0], hy = a.head[1], r = a.r, ha = Math.atan2(a.headTop[0] - hx, -(a.headTop[1] - hy));
    const turn = evalTrack((TRACKS[id] || {}).turn, t) ?? 0;
    return { hx, hy, r, c: Math.cos(ha), s: Math.sin(ha), turn };
  };
  COMP.x4_hat = {
    draw(fx, t, F) {
      if (t < fx.t0) return;
      const a = F.anchors[fx.char]; if (!a) return;
      const hf = headFrame(a, t, fx.char), k = fx.id, z = Z.front + 1;
      const drop = (1 - EASE.in(clamp((t - fx.t0) / (fx.land - fx.t0)))) * 620;
      const lu = clamp((t - fx.land) / 0.28), sq = t < fx.land ? 1.06 : 1 - 0.2 * Math.sin(Math.PI * lu) * (1 - lu);
      const ct = Math.cos(HAT.tilt * RAD), st = Math.sin(HAT.tilt * RAD), B = HAT.band;
      const P = (u, v) => {
        const du = u + hf.turn * 0.12, dv = (v - B) * sq;
        const u2 = du * ct - dv * st, v2 = B + du * st + dv * ct;
        return [hf.hx + (u2 * hf.c - v2 * hf.s) * hf.r, hf.hy + (u2 * hf.s + v2 * hf.c) * hf.r - drop];
      };
      const domeY = u => B - HAT.ry * Math.sqrt(Math.max(0, 1 - (u / HAT.rx) ** 2));
      // peaks (front and back, drawn left and right), then the crown over them
      [-1, 1].forEach((sd, i) => {
        const pts = [[sd * 0.78, B - 0.08], [sd * 1.16, B - 0.02], [sd * 1.42, B + 0.16], [sd * 1.52, B + 0.36, 1], [sd * 1.22, B + 0.3], [sd * 0.84, B + 0.16]];
        stroke(k + '.pk' + i, pts.map(([u, v, c]) => [...P(u, v), c]), { z, w: 4.2, closed: true, fill: C.paper });
      });
      const dome = [];
      for (let i = 0; i <= 14; i++) { const an = Math.PI + Math.PI * i / 14; dome.push(P(Math.cos(an) * HAT.rx, B + Math.sin(an) * HAT.ry)); }
      stroke(k + '.crown', [[...P(-HAT.rx, B + 0.04), 1], ...dome, [...P(HAT.rx, B + 0.04), 1], [...P(0, B + 0.07)], [...P(-HAT.rx, B + 0.04), 1]], { z: z + 0.1, w: 4.6, fill: C.paper });
      stroke(k + '.band', [P(-HAT.rx * 0.97, B - 0.17), P(0, B - 0.22), P(HAT.rx * 0.97, B - 0.17)], { z: z + 0.2, w: 3.2 });
      // plaid, in pencil
      [-0.48, 0.44].forEach((u, i) => stroke(k + '.pv' + i, [P(u, B - 0.24), P(u * 1.04, (B - 0.24 + domeY(u)) / 2), P(u * 0.96, domeY(u) + 0.08)], { z: z + 0.2, w: 2.2, color: C.pencil, boil: 0.5 }));
      stroke(k + '.ph', [P(-0.9, B - 0.5), P(0, B - 0.6), P(0.9, B - 0.5)], { z: z + 0.2, w: 2.2, color: C.pencil, boil: 0.5 });
      // the ear flaps, tied up: a little bow on the crown, left of the tuft
      const bw = P(-0.42, domeY(-0.42) + 0.12), br = hf.r;
      [-1, 1].forEach((sd, i) => stroke(k + '.bow' + i, [bw, [bw[0] + sd * br * 0.26, bw[1] - br * 0.15], [bw[0] + sd * br * 0.3, bw[1] + br * 0.06], bw], { z: z + 0.3, w: 3, closed: true, fill: C.paper }));
      dot(k + '.knot', bw, br * 0.055, C.ink, z + 0.4);
      // the tuft, popping out of the top once the hat has landed (the real tuft is hidden under the crown)
      if (t >= fx.land) {
        const pop = Math.max(0.01, EASE.back(clamp((t - fx.land - 0.04) / 0.3))), top = B - HAT.ry + 0.03, base = [0.02, top];
        HAIR.tuft(0, 0).forEach((pts, i) => stroke(k + '.tuft' + i, pts.map(([u, v]) => P(base[0] + (u - 0.02) * pop, base[1] + (v + 0.97) * pop)), { z: z + 0.3, w: 5 }));
      }
    },
    cues: fx => [[fx.t0, 'whoosh'], [fx.land, 'tap'], [fx.land + 0.06, 'boing']],
  };

  /* ---------------- the magnifying glass ----------------
   * in Terry's left hand (small); over his left eye for a peek (the eye inside looks huge); then it flies to the board,
   * gets big and moves back along the working; after "10 对" it flies back to his hand. */
  const LN = { Rh: 30, Lh: 42, Re: 40, Rf: 78, Lf: 86 };
  const HANDDIR = [[0, -112]];
  const ROWA_C = [LX + lay(wA).width / 2, Y.A + SZ.A / 2], ROWB_C = [BMID, Y.B + SZ.B / 2];
  const P420 = [R420[0] + R420[2] / 2, Y.D + SZ.D / 2], PD1 = [LX + D1.width / 2, Y.D + SZ.D / 2];
  const P21 = [(PAIRS[0][0] + PAIRS[1][1]) / 2, Y.U + SZ.U / 2], P20 = [(C_X + DUI1[0] + SZ.C / 2) / 2, Y.C + SZ.C / 2];
  const P21a = [(PAIRS[0][0] + PAIRS[0][1]) / 2, Y.U + SZ.U / 2];
  // where the big lens looks: [x, y, handle angle] — the handle is turned so it never lies across the step being looked at
  const FLOAT = [[0, [...P420, 70]], [46.0, [...PD1, 70], 0.35], [46.85, [...P21a, 0], 0.4], [47.7, [...ROWB_C, -40], 0.4], [48.45, [...ROWA_C, -35], 0.4],
    [49.35, [...P20, 0], 0.55], [T.L21, [...P21a, 0], 0.35], [T.L20, [...P20, 0], 0.35]];
  const eyeW = t => clamp((t - T.LENS) / 0.06) * (1 - clamp((t - T.PEEK1) / 0.15));
  const flyW = t => EASE.io(clamp((t - T.FLY0) / (T.FLY1 - T.FLY0))) * (1 - EASE.io(clamp((t - T.BACK0) / (T.BACK1 - T.BACK0))));
  const eyePoint = (a, t) => {
    const hf = headFrame(a, t, 'terry'), u = -0.36 * (1 - 0.12 * Math.abs(hf.turn)) + hf.turn * 0.28, v = -0.1;
    return [hf.hx + (u * hf.c - v * hf.s) * hf.r, hf.hy + (u * hf.s + v * hf.c) * hf.r];
  };
  function lensState(t, F) {
    if (t < T.LENS) return null;
    const a = F.anchors.terry; if (!a) return null;
    const hand = a.handL, ad = evalTrack(HANDDIR, t) * RAD;
    let c = [hand[0] + Math.cos(ad) * (LN.Rh + LN.Lh), hand[1] + Math.sin(ad) * (LN.Rh + LN.Lh)], R = LN.Rh;
    const ew = eyeW(t);
    if (ew > 0) { c = lerp2(c, eyePoint(a, t), ew); R = lerp(R, LN.Re, ew); }
    let hDir = Math.atan2(hand[1] - c[1], hand[0] - c[0]), hLen = Math.max(12, dist(hand, c) - R);
    const fw = flyW(t);
    if (fw > 0) {
      const bob = t < T.PAUSE || t > T.L21 ? Math.sin(t * 3.1) * 3 : 0;
      const p = evalTrack(FLOAT, t);
      c = lerp2(c, [p[0], p[1] + bob], fw); c[1] -= Math.sin(Math.PI * fw) * 70;
      R = lerp(R, LN.Rf, fw); hDir = lerp(hDir, p[2] * RAD, fw); hLen = lerp(hLen, LN.Lf, fw);
    }
    const pop = Math.max(0.01, EASE.back(clamp((t - T.LENS) / 0.25)));
    return { c, R: R * pop, hDir, hLen: hLen * pop, eye: ew, fw, r: a.r };
  }
  COMP.x4_lens = {
    draw(fx, t, F) {
      const st = lensState(t, F); if (!st) return;
      const { c, R, hDir, hLen } = st, k = fx.id, z = st.fw > 0.5 ? Z.annot + 2 : Z.front + 2;
      const ux = Math.cos(hDir), uy = Math.sin(hDir);
      const h0 = [c[0] + ux * R * 0.96, c[1] + uy * R * 0.96], h1 = [c[0] + ux * (R + hLen), c[1] + uy * (R + hLen)];
      const hw = clamp(R * 0.21, 8, 15);
      if (st.eye > 0.5) {   // the peek: a paper lens over his eye, and a huge eye inside it
        stroke(k + '.fill', ringPts(k + '.f', c[0], c[1], R, R, { n: 16, closed: true, rv: 0.01 }), { z, closed: true, fill: C.paper, noStroke: true, w: 1 });
        const ex = 0.34 * st.r * 1.5, ey = 0.41 * st.r * 1.5;
        stroke(k + '.eye', ringPts(k + '.e', c[0], c[1] + 2, ex, ey, { n: 12, a0: -100, sweep: 360, rv: 0.04, closed: true }), { z: z + 0.1, w: 4.5, closed: true, fill: C.paper });
        dot(k + '.pupil', [c[0] + 2, c[1] + 8], 0.14 * st.r * 1.6, C.ink, z + 0.15);
      }
      stroke(k + '.h', [h0, h1], { z, w: hw });
      stroke(k + '.h2', [lerp2(h0, h1, 0.22), lerp2(h0, h1, 0.86)], { z: z + 0.1, w: hw * 0.36, color: C.paper, boil: 0 });
      stroke(k + '.o', ringPts(k + '.o', c[0], c[1], R, R, { n: 16, a0: -100, sweep: 368, rv: 0.012 }), { z: z + 0.2, w: clamp(R * 0.09, 4.5, 7) });

try { const s = JSON.parse(localStorage.getItem('taoPlayerPrefs') || 'null'); if (s) { P.narr = s.narr !== false; P.snd = s.snd !== false; P.music = s.music !== false; } } catch (e) { /* storage blocked */ }
const savePrefs = () => { try { localStorage.setItem('taoPlayerPrefs', JSON.stringify({ narr: P.narr, snd: P.snd, music: P.music })); } catch (e) { /* ignore */ } };
if (!MUSIC.available()) ui.music.hidden = true;
if (window.TAO_AUDIO && window.TAO_AUDIO.credits) { ui.credits.textContent = window.TAO_AUDIO.credits; ui.credits.hidden = false; }

ui.scrub.max = EP.dur.toFixed(2);
const CHAPS = EP.scenes.filter(sc => sc.chapter).map(sc => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'chap';
  b.innerHTML = `<span></span><span class="ct">${fmt(sc.start)}</span>`; b.firstChild.textContent = sc.chapter;
  b.addEventListener('click', () => { seek(sc.start); play(); });
  li.appendChild(b); ui.chapters.appendChild(li);
  return { sc, b };
});

/** Which music bed plays at global time t, and how far into it (beds restart at the first scene of each run). */
function musicAt(t) {
  const sc = sceneAt(Math.min(t, EP.dur - 1e-6)), key = (EP.music || {})[sc.id] || null;
  let i = sc.index;
  while (i > 0 && (EP.music || {})[EP.scenes[i - 1].id] === key) i--;
  return { key, offset: t - EP.scenes[i].start };
}
function syncMusic(force) {
  if (!P.music || !P.playing) { MUSIC.stop(); return; }
  const m = musicAt(P.t);
  if (m.key && MUSIC.ready(m.key)) MUSIC.set(m.key, m.offset, force);
}

function paint(t, force) {
  const q = Math.floor(t * CFG.FPS + 1e-6);
  if (force || q !== P.lastQ) { render(t); P.lastQ = q; }
}
function syncUI() {
  const t = P.poster ? 0 : P.t;
  ui.scrub.value = t.toFixed(2);
  ui.scrub.setAttribute('aria-valuetext', `${fmt(t)}`);
  ui.time.textContent = P.loading ? '加载声音…' : `${fmt(t)} / ${fmt(EP.dur)}`;
  ui.play.innerHTML = P.playing ? ICON.pause : ICON.play;
  ui.play.setAttribute('aria-label', P.playing ? '暂停' : '播放');
  ui.poster.hidden = !P.poster;
  ui.think.hidden = P.waiting === null || P.playing;
  ui.narr.setAttribute('aria-pressed', String(P.narr));
  ui.snd.setAttribute('aria-pressed', String(P.snd));
  ui.music.setAttribute('aria-pressed', String(P.music));
  let cur = null; for (const c of CHAPS) if (t >= c.sc.start - 1e-6) cur = c;
  CHAPS.forEach(c => c.b.setAttribute('aria-current', String(c === cur && !P.poster)));
}
function fireCues(a, b) {
  for (const c of EP.cues) {
    if (c.t <= a) continue; if (c.t > b) break;
    if (c.sfx && P.snd) SFX.play(c.sfx);
    if (c.say && P.narr) NARR.say(c);
  }
}
/** after a seek, pick up the line that is being spoken at t */
function resumeVoice(t) {
  if (!P.narr) return;
  let last = null; for (const c of EP.cues) { if (c.t > t) break; if (c.say) last = c; }
  if (last && t - last.t > 0.05) NARR.say(last, t - last.t);
}
function tick(now) {
  if (!P.playing) return;
  let t = P.t0 + (now - P.wall0) / 1000;
  // hold the picture while the voice finishes, instead of letting lines pile up
  const talking = P.narr && NARR.busy();
  if (talking) {
    const nx = EP.syncs.find(x => x > P.prev + 1e-4 && x <= t);
    if (nx !== undefined) { t = Math.max(P.prev, nx - 1e-3); P.t0 = t; P.wall0 = now; }
  }
  MUSIC.duck(talking);
  // "轮到你了" pauses: stop and wait for the child
  const pp = EP.pauses.find(x => x > P.prev && x <= t);
  if (pp !== undefined) t = pp;
  if (t >= EP.dur) t = EP.dur;
  fireCues(P.prev, t); P.prev = t; P.t = t;
  paint(t);
  const si = sceneAt(Math.min(t, EP.dur - 1e-6)).index;
  if (si !== P.scene) { P.scene = si; syncMusic(false); }
  else if (P.music && !MUSIC.current()) syncMusic(false); // bed finished decoding after play started
  if (pp !== undefined) {
    P.playing = false; P.waiting = pp;
    if (P.music && EP.think && MUSIC.ready(EP.think)) MUSIC.set(EP.think, 0, true); else MUSIC.stop();
    syncUI(); return;
  }
  if (t >= EP.dur) { P.playing = false; MUSIC.stop(1.5); syncUI(); return; }
  syncUI();
  P.raf = requestAnimationFrame(tick);
}
async function play() {
  if (P.loading) return;
  const resume = P.waiting !== null;
  if (P.poster || P.t >= EP.dur - 1e-3) P.t = 0;
  P.poster = false; P.waiting = null;
  SFX.unlock();
  if (!resume) NARR.cancel();
  if (P.narr) NARR.prime();
  // first play: decode the narration (quick) before the clock starts; music decodes alongside and joins when ready
  const voiceReady = NARR.load();
  MUSIC.load();
  if (voiceReady) { P.loading = true; paint(P.t, true); syncUI(); await voiceReady; P.loading = false; }
  P.playing = true;
  P.t0 = P.t; P.prev = resume ? P.t : P.t - 1e-4; P.wall0 = performance.now();
  if (!resume) resumeVoice(P.t);
  P.scene = sceneAt(Math.min(P.t, EP.dur - 1e-6)).index;
  syncMusic(true);
  cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick);
  paint(P.t, true); syncUI();
}
function pause() { P.playing = false; cancelAnimationFrame(P.raf); NARR.cancel(); MUSIC.stop(); syncUI(); }
function toggle() { P.playing ? pause() : play(); }
function seek(t) {
  pause(); P.poster = false; P.waiting = null;
  P.t = clamp(+t || 0, 0, EP.dur);
  paint(P.t, true); syncUI();
}
ui.play.addEventListener('click', toggle);
ui.poster.addEventListener('click', play);
ui.think.addEventListener('click', play);
ui.restart.addEventListener('click', () => { seek(0); play(); });
ui.scrub.addEventListener('input', () => seek(+ui.scrub.value));
ui.narr.addEventListener('click', () => { P.narr = !P.narr; if (!P.narr) NARR.cancel(); savePrefs(); syncUI(); });
ui.snd.addEventListener('click', () => { P.snd = !P.snd; if (P.snd) SFX.unlock(); savePrefs(); syncUI(); });
ui.music.addEventListener('click', () => { P.music = !P.music; SFX.unlock(); MUSIC.load(); syncMusic(true); savePrefs(); syncUI(); });
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  const tag = e.target && e.target.tagName;
  if (tag === 'BUTTON' || tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'range')) return;
  e.preventDefault(); toggle();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.playing) pause(); });

// reduced motion: no line boil (holds become perfectly still)
try {
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  RM.reduce = mq.matches;
  const onMQ = () => { RM.reduce = mq.matches; paint(P.poster ? EP.poster : P.t, true); };
  mq.addEventListener ? mq.addEventListener('change', onMQ) : mq.addListener(onMQ);
} catch (e) { /* ignore */ }

// test/automation hooks
window.render = render;
window.__duration = EP.dur;
window.__scenes = EP.scenes.map(s => ({ id: s.id, chapter: s.chapter || null, start: +s.start.toFixed(3), dur: s.dur }));
window.__seek = t => { seek(t); render(P.t); P.lastQ = Math.floor(P.t * CFG.FPS + 1e-6); };
window.__audio = () => ({ ctx: AUD.ctx && AUD.ctx.state, music: MUSIC.current(), talking: NARR.busy(), t: P.t, playing: P.playing, waiting: P.waiting });

paint(Math.min(EP.poster, EP.dur), true); syncUI();

</script>
</body>
</html>
