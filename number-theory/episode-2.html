<script>
'use strict';
/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = {
  W: 1600, H: 900, FPS: 24,
  BOIL_FPS: 5, BOIL_AMP: 1.1, WOBBLE: 1.4,
  FLOOR: 780,
  C: { paper: '#FBF8F1', ink: '#1E1E1E', red: '#D23A3F', pencil: '#9B9B9B', hi: '#FFE066' },
  FONT_ZH: "'ZCOOL KuaiLe','Patrick Hand',sans-serif",
  FONT_MIX: "'Patrick Hand','ZCOOL KuaiLe',sans-serif",
  FONT_MONO: "'VT323','Courier New',monospace", MONO_ADV: 0.4,
  SIZE: { sub: 52, label: 40, speech: 84, mark: 84, series: 32 },
};
const C = CFG.C;
// draw-order layers
const Z = { set: 10, hi: 12, board: 14, shadow: 18, chair: 20, back: 28, body: 30, desk: 35, front: 40, fx: 50, annot: 60, stamp: 70, sub: 90 };
const RAD = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
const EASE = {
  lin: u => u,
  io: u => u * u * (3 - 2 * u),
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  back: u => { const c = 2.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};

/* =====================================================================
   NOISE / BOIL  (deterministic: static wobble per key + boil per floor(t*BOIL_FPS))
   ===================================================================== */
const HCACHE = new Map();
function hstr(s) {
  let h = HCACHE.get(s); if (h !== undefined) return h;
  h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0; HCACHE.set(s, h); return h;
}
function rnd(a, b, c) { // -> [-1, 1)
  let t = (a ^ Math.imul(b + 1, 0x9E3779B1) ^ Math.imul(c + 7, 0x85EBCA77)) >>> 0;
  t = (t + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1;
}
const BOIL = { frame: 0, amp: CFG.BOIL_AMP };
function jit(h, i, p, amp) {
  const w = CFG.WOBBLE * 0.5, b = BOIL.amp * amp, f = BOIL.frame * 2 + 1000;
  return [p[0] + rnd(h, i, 1) * w + (b ? rnd(h, i, f) * b : 0),
          p[1] + rnd(h, i, 2) * w + (b ? rnd(h, i, f + 1) * b : 0)];
}

/* =====================================================================
   DRAW LIST  (flat, keyed items; affine matrix stack; reconciled into SVG)
   ===================================================================== */
const DL = {
  items: [], m: [1, 0, 0, 1, 0, 0], st: [], used: new Map(), zoff: 0,
  reset() { this.items.length = 0; this.m = [1, 0, 0, 1, 0, 0]; this.st.length = 0; this.used.clear(); this.zoff = 0; },
  save() { this.st.push(this.m.slice()); },
  restore() { this.m = this.st.pop(); },
  mul(n) {
    const [a, b, c, d, e, f] = this.m, [A, B, Cc, D, E, F] = n;
    this.m = [a * A + c * B, b * A + d * B, a * Cc + c * D, b * Cc + d * D, a * E + c * F + e, b * E + d * F + f];
  },
  translate(x, y) { this.mul([1, 0, 0, 1, x, y]); },
  scale(sx, sy = sx) { this.mul([sx, 0, 0, sy, 0, 0]); },
  rotate(deg) { const r = deg * RAD, c = Math.cos(r), s = Math.sin(r); this.mul([c, s, -s, c, 0, 0]); },
  about(x, y, fn) { this.translate(x, y); fn(); this.translate(-x, -y); },
  tp(p) { const m = this.m; return [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]]; },
  k() { const m = this.m; return Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])); },
  add(z, key, tag, attrs, text) {
    const n = this.used.get(key) || 0; this.used.set(key, n + 1);
    if (n) key += '#' + n;
    this.items.push({ z: z + this.zoff, key, tag, attrs, text, o: this.items.length });
  },
};

/* =====================================================================
   DRAWING PRIMITIVES
   ===================================================================== */
const f1 = v => Math.round(v * 10) / 10;
function catRun(R) {
  const n = R.length; let d = '';
  if (n === 2) return `L${f1(R[1][0])} ${f1(R[1][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = R[Math.max(i - 1, 0)], p1 = R[i], p2 = R[i + 1], p3 = R[Math.min(i + 2, n - 1)];
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
}
function smoothD(P, corners, closed) {
  let d = `M${f1(P[0][0])} ${f1(P[0][1])}`;
  if (closed) {
    const n = P.length;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
    }
    return d + 'Z';
  }
  let s = 0;
  for (let i = 1; i < P.length; i++) {
    if (i === P.length - 1 || corners[i]) { d += catRun(P.slice(s, i + 1)); s = i; }
  }
  return d;
}
/** A hand-drawn stroke through local points (3rd element truthy = sharp corner).
 *  o: {z, w, color, fill, closed, draw(0..1), boil(scale), opacity, bow, noStroke, blend} */
function stroke(key, pts, o = {}) {
  if (o.draw !== undefined && o.draw <= 0.002) return;
  if (!pts || pts.length < 2) return;
  const h = hstr(key);
  let P = pts, corners = pts.map(p => !!p[2]);
  if (P.length === 2 && !o.closed) {
    const a = P[0], b = P[1], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const bow = rnd(h, 99, 5) * Math.min(3, len * 0.03) * (o.bow ?? 1);
    P = [a, [(a[0] + b[0]) / 2 - (b[1] - a[1]) / len * bow, (a[1] + b[1]) / 2 + (b[0] - a[0]) / len * bow], b];
    corners = [false, false, false];
  }
  const amp = o.boil ?? 1;
  const W = P.map((p, i) => jit(h, i, DL.tp(p), amp));
  const a = {
    d: smoothD(W, corners, o.closed), fill: o.fill || 'none',
    stroke: o.noStroke ? 'none' : (o.color || C.ink),
    'stroke-width': +((o.w || 6) * DL.k()).toFixed(2),
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.draw !== undefined && o.draw < 1) {
    a.pathLength = 1; a['stroke-dasharray'] = '1 2'; a['stroke-dashoffset'] = +(1 - o.draw).toFixed(4);
    if (a.fill !== 'none') a['fill-opacity'] = o.draw > 0.6 ? 1 : 0;
  }
  if (o.blend) a.style = 'mix-blend-mode:multiply';
  DL.add(o.z ?? Z.body, key, 'path', a);
}
/** Points on a lumpy ring. a0/sweep in degrees; rv = radius variation. */
function ringPts(key, cx, cy, rx, ry, o = {}) {
  const n = o.n || 12, a0 = (o.a0 ?? -120) * RAD, sweep = (o.sweep ?? 360) * RAD, rv = o.rv ?? 0.03;
  const h = hstr(key + '~r'), pts = [], closed = !!o.closed;
  const cnt = closed ? n : n + 1;
  for (let i = 0; i < cnt; i++) {
    const a = a0 + sweep * i / n;
    let rr = 1 + rnd(h, i % n, 3) * rv;
    if (!closed && i === cnt - 1) rr *= 0.965; // Orlin's closing tick
    pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
  }
  return pts;
}
function superPts(cx, cy, w, h, n = 20, ex = 5) { // rounded-rect-ish superellipse
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    pts.push([cx + Math.sign(c) * Math.pow(Math.abs(c), 2 / ex) * w / 2, cy + Math.sign(s) * Math.pow(Math.abs(s), 2 / ex) * h / 2]);
  }
  return pts;
}
function dot(key, p, r, color = C.ink, z = Z.front) {
  const q = DL.tp(p), k = DL.k();
  DL.add(z, key, 'circle', { cx: f1(q[0]), cy: f1(q[1]), r: +(r * k).toFixed(2), fill: color });
}
function text(key, str, x, y, o = {}) {
  const m = DL.m;
  let tf = `matrix(${m.map(v => +v.toFixed(4)).join(' ')}) translate(${f1(x)} ${f1(y)})`;
  if (o.rot) tf += ` rotate(${o.rot})`;
  if (o.scale !== undefined && o.scale !== 1) tf += ` scale(${+o.scale.toFixed(4)})`;
  // Latin letters always in Patrick Hand: ZCOOL draws O as a square, so "IMO" would read "IM口"
  const font = o.font || CFG.FONT_ZH;
  const a = { transform: tf, x: 0, y: 0, 'font-size': o.size || 40, 'font-family': font === CFG.FONT_ZH && /[A-Za-z]/.test(str) ? CFG.FONT_MIX : font,
    fill: o.color || C.ink, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central', style: 'white-space:pre' };
  if (o.opacity !== undefined && o.opacity < 1) a.opacity = +o.opacity.toFixed(3);
  if (o.halo) { a.stroke = C.paper; a['stroke-width'] = o.halo; a['stroke-linejoin'] = 'round'; a['paint-order'] = 'stroke'; }
  DL.add(o.z ?? Z.annot, key, 'text', a, str);
}
/** Rough rendered width. CJK = 1 em; Latin ≈ 0.5 em (space 0.3); in the monospace code font every Latin char = MONO_ADV em. */
function textWidth(str, size, font) {
  const mono = font === CFG.FONT_MONO;
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0x2E80 ? size : (mono ? CFG.MONO_ADV : ch === ' ' ? 0.3 : 0.5) * size;
  return w;
}
/** Pencil-scribble ground shadow. */
function shadow(key, cx, cy, w, op = 1) {
  if (op <= 0.02) return;
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) {
    const u = i / n, amp = 6 * Math.sqrt(Math.max(0, 1 - Math.pow(2 * u - 1, 2))) + 1.5;

      if (has(fx.lit, i)) stroke(key + '.lit', [[x0 + 6, y - 8], [x1 - 6, y - 8]], { z: Z.hi, w: 16, color: C.hi, draw: clamp(since(fx.lit, i) / 0.4), opacity: 0.9 * op });
      if (has(fx.steps, i)) {
        const u = clamp(since(fx.steps, i) / 0.35);
        text(key + '.q', N1_STEP_TXT[i], x0 - 10, y - 30, { size: 36, z: Z.annot, color: C.red, anchor: 'end', opacity: u * op, halo: true });
      }
      if (has(fx.ticks, i)) {   // odd side: a big tick with 奇 under it, inside the stair body
        const u = clamp(since(fx.ticks, i) / 0.25) * op;
        text(key + '.tk', '✓', x0 + 24, y - 34, { size: 58, z: Z.annot, color: C.red, anchor: 'middle', opacity: u });
        text(key + '.tkl', '奇', x0 + 24, y + 40, { size: 36, z: Z.annot, color: C.red, anchor: 'middle', opacity: u });
      }
      if (has(fx.qs, i)) {      // even side: a pulsing ? with 偶 under it
        const u = clamp(since(fx.qs, i) / 0.25) * op, b = 1 + 0.12 * Math.sin(Math.max(0, since(fx.qs, i)) * 9);
        text(key + '.qq', '?', x0 + 96, y - 34, { size: 58 * b, z: Z.annot, color: C.red, anchor: 'middle', opacity: u });
        text(key + '.qql', '偶', x0 + 96, y + 40, { size: 36, z: Z.annot, color: C.red, anchor: 'middle', opacity: u });
      }
    }
    // fog with blurry signposts
    if (fx.fog !== false) {
      const fu = pin * op;
      for (let q = 0; q < 3; q++) {
        const cx = 1150 + q * 95, cy = 175 + (q % 2) * 40;
        stroke(`${k}.sp${q}`, [[cx, cy + 70], [cx, cy - 10]], { z: Z.set, w: 4, color: C.pencil, opacity: fu * 0.8 });
        stroke(`${k}.sb${q}`, [[cx - 38, cy - 34], [cx + 38, cy - 34, 1], [cx + 38, cy - 4, 1], [cx - 38, cy - 4, 1], [cx - 38, cy - 34, 1]], { z: Z.set, w: 3, color: C.pencil, opacity: fu * 0.8 });
      }
      for (let q = 0; q < 6; q++) {   // fog puffs, kept inside the map frame (x < 1490, y > 120)
        const cx = 960 + q * 80, cy = 172 + (q % 3) * 28;
        stroke(`${k}.fog${q}`, ringPts(`${k}.fg${q}`, cx, cy, 86, 32, { n: 14 }), { z: Z.set + 2, w: 18, color: '#EFEAE0', closed: true, fill: '#EFEAE0', opacity: 0.92 * fu, boil: 0.5 });
      }
    }
  },
  cues: fx => [...(fx.t0 >= 0 ? [[fx.t0, 'paper']] : []), ...(fx.steps || []).map(([tt]) => [tt, 'plip']), ...(fx.ticks || []).map(([tt]) => [tt, 'pen'])],
};

/* 范围卡片：白卡片 + 图钉；lines = ['两个数都是 0 或正整数', …]；nl: 时间（局部，-1 = 一开始就有）画出一小段数轴 0 1 2 3 …；
   neg: 时间，数轴 0 的左边贴"负数：以后"小便签。局部原点 = 卡片中心；w、h 可调。 */
PROPS.n1_card = (fx, t, lt, p) => {
  const k = fx.id, w = fx.w || 560, h = fx.h || (fx.nl !== undefined ? 300 : 200), z = Z.annot - 1;
  stroke(k + '.c', [[-w / 2, -h / 2], [w / 2, -h / 2, 1], [w / 2, h / 2, 1], [-w / 2, h / 2, 1], [-w / 2, -h / 2, 1]], { z, w: 3.5, fill: '#FFFFFF', draw: p });
  dot(k + '.pin', [0, -h / 2 + 14], 11, C.red, z + 0.5);
  const L = fx.lines || [];
  L.forEach((s, i) => text(`${k}.l${i}`, s, -w / 2 + 28, -h / 2 + 62 + i * 50, { size: fx.size || 36, font: CFG.FONT_MIX, z: z + 0.3, anchor: 'start', opacity: clamp(p * 3 - 1 - i * 0.3) }));
  if (fx.nl !== undefined && lt >= fx.nl) {
    const u = EASE.out(clamp((lt - fx.nl) / 0.5)), y = h / 2 - 58, x0 = -w / 2 + 90, dx = 90;
    stroke(k + '.ax', [[x0 - 30, y], [x0 + dx * 4 + 10, y]], { z: z + 0.3, w: 3.5, draw: u });
    ['0', '1', '2', '3'].forEach((s, i) => { stroke(`${k}.tk${i}`, [[x0 + i * dx, y - 10], [x0 + i * dx, y + 10]], { z: z + 0.3, w: 3, draw: u }); text(`${k}.n${i}`, s, x0 + i * dx, y + 34, { size: 36, font: CFG.FONT_MIX, z: z + 0.3, anchor: 'middle', opacity: u }); });
    text(k + '.dots', '……', x0 + dx * 4 + 40, y + 2, { size: 34, z: z + 0.3, anchor: 'start', opacity: u });
  }
  if (fx.neg !== undefined && lt >= fx.neg) {
    const u = EASE.back(clamp((lt - fx.neg) / 0.3)), y = h / 2 - 58, x = -w / 2 + 20;
    stroke(k + '.ng', [[x - 70, y - 28], [x + 30, y - 28, 1], [x + 30, y + 24, 1], [x - 70, y + 24, 1], [x - 70, y - 28, 1]], { z: z + 0.6, w: 3, fill: '#FFF6B8', draw: u });
    text(k + '.ngt', '负数：以后', x - 20, y - 2, { size: 30, z: z + 0.7, anchor: 'middle', color: C.red, opacity: u });
  }
};

/* Jasper 的记号 ┐：一横一竖，红笔写；size = 横的长度（默认 46） */
PROPS.n1_mark = (fx, t, lt, p) => {
  const s = fx.size || 46, k = fx.id;
  stroke(k + '.m', [[-s / 2, -s / 2], [s / 2, -s / 2, 1], [s / 2, s / 2]], { z: Z.annot, w: fx.w || 6, color: fx.color || C.red, draw: p });
};

/* 木牌：text（一行）、w；局部原点 = 牌子中心，杆子往下 140 */
PROPS.n1_sign = (fx, t, lt, p) => {
  const k = fx.id, w = fx.w || 360, h = 96;
  stroke(k + '.pole', [[0, h / 2], [0, h / 2 + 140]], { z: Z.front, w: 7, draw: p });
  stroke(k + '.b', [[-w / 2, -h / 2], [w / 2, -h / 2, 1], [w / 2, h / 2, 1], [-w / 2, h / 2, 1], [-w / 2, -h / 2, 1]], { z: Z.front, w: 5, fill: '#F3E3C3', draw: p });
  text(k + '.t', fx.text || '', 0, 2, { size: fx.size || 46, z: Z.front + 0.2, anchor: 'middle', opacity: clamp(p * 2 - 0.8) });
};

/** 让 inner（另一个 fx）在 [f0, f0 + fd] 里淡出，而不是一帧消失（title、scribe 等没有 t1 的组件用） */
COMP.n1_fade = {
  init(fx) { const c = COMP[fx.inner.type]; if (c.init) c.init(fx.inner); },
  draw(fx, t, F) {
    const k = 1 - clamp((t - fx.f0) / (fx.fd || 0.4)); if (k <= 0) return;
    const n0 = DL.items.length;
    COMP[fx.inner.type].draw(fx.inner, t, F);
    if (k < 1) for (let i = n0; i < DL.items.length; i++) { const a = DL.items[i].attrs; a.opacity = +((a.opacity ?? 1) * k).toFixed(3); }
  },
  cues: fx => (COMP[fx.inner.type].cues ? COMP[fx.inner.type].cues(fx.inner) : []),
};

/* ---- _n2_shared.js ---- */
/* 第 2 集共用素材（主持人独占；场景代理只读，需要改动写进报告）
   第 1 集的素材在 _n1_shared.js（原样复制）：N1.kid、COMP.n1_desk、COMP.n1_dots、COMP.n1_map、PROPS.n1_card、PROPS.n1_mark、PROPS.n1_sign、COMP.n1_fade。
   本文件：
   - N2：常量（Jasper、地面、版面分区）和小工具（N2.W 手写、N2.F 淡出、N2.box、N2.dash、N2.ring）
   - COMP.n2_grp / COMP.n2_fn：分组（可整体移动缩放、淡出）和自由绘制
   - N2.fill：余数花纹（余 0 实心、余 1 斜线、余 2 网点、余 3 空心）；N2.brick：数字砖
   - COMP.n2_lanes + N2.laneXY：四条跑道
   - COMP.n2_hud：顶栏（细跑道条 + 卡①–④停靠的小图标）和议程条，跨场景的状态由 N2.HUD_AT 规定
   - COMP.n2_bigcard：结论卡（黄色荧光笔），写出来以后缩进顶栏
   - COMP.n2_tag："猜想"标签，可当场撕掉换成"证明了 ✓"
   - COMP.n2_stack：证明栈（右侧一栏）
   - COMP.n2_star：红色小星（撞到时）
   - COMP.n2_flip：翻页；PROPS.n2_group9：9 个点 4 | 4 | 1
   - COMP.n2_panels："还没找到 / 根本没有"两格
   - PROPS.n2_c1card：第 1 集的结论卡缩略图
   - COMP.n2_map：第 1 集的地图 + 门楣字、开门、门缝透光、半边台阶、小旗、问号拆两半 */

const N2 = {
  kid: N1.kid,
  FL: 780,
  SOLID: '#3A3A3A',                 // 余 0 的实心
  // 版面分区（舞台 1600 × 900）
  AGENDA: [40, 86, 420, 170],       // 议程条
  TOP: [440, 66, 1560, 170],        // 顶栏
  BODY: [0, 190, 1600, 790],        // 主体
  STACK_X: 1180,                    // 证明栈的左边
  STACK_Y: 340, STACK_LH: 58,       // 证明栈第 0 行的中心 y、行距
  // 证明栈上方钉的范围卡（proof 场钉上，borrow、wall、dark 场开场就在；用 PROPS.n1_card 画）
  STACK_CARD: { at: [1362, 236], w: 424, h: 130, size: 34, lines: ['a、b 从 0、1、2……里挑，', 'a > b'] },
};

/* ---------------- 小工具 ---------------- */
N2.box = (x0, y0, x1, y1) => [[x0, y0], [x1, y0, 1], [x1, y1, 1], [x0, y1, 1], [x0, y0, 1]];
/** 把从 n0 起画进 DL 的图元整体乘上不透明度 a */
N2.fadeFrom = (n0, a) => { if (a >= 1) return; for (let i = n0; i < DL.items.length; i++) { const at = DL.items[i].attrs; at.opacity = +((at.opacity ?? 1) * a).toFixed(3); } };
/** 手写一行数学（write 的常用默认值）；红色时自动放到批注层、配 pen 音效 */
N2.W = (id, text, x, y, size, t0, o = {}) => {
  const fx = { type: 'write', id, text, x, y, size, t0, speed: 2600, w: 5.5, gap: 0.02, glyphGap: 0.02, ...o };
  if (fx.color === 'red') { fx.z = fx.z ?? Z.annot; fx.sfx = fx.sfx || 'pen'; fx.speed = o.speed || 3000; }
  return fx;
};
/** 让一个没有 t1 的组件（title、scribe、write……）在 f0 起 fd 秒内淡出 */
N2.F = (f0, inner, fd = 0.4) => ({ type: 'n1_fade', f0, fd, inner });
/** 虚线 */
N2.dash = (k, p, q, o = {}) => {
  const L = dist(p, q), m = Math.max(1, Math.round(L / (o.step || 22)));
  for (let d = 0; d < m; d++) {
    const u0 = d / m, u1 = Math.min(1, u0 + (o.on || 12) / L); if (o.draw !== undefined && u0 > o.draw) break;
    stroke(`${k}.${d}`, [lerp2(p, q, u0), lerp2(p, q, u1)], { z: o.z ?? Z.board, w: o.w || 3, color: o.color || C.ink, opacity: o.opacity, boil: 0.4 });
  }
};
/** FONT_MIX 里一段字的实际宽度（实测：汉字 ≈ 0.95 em，拉丁字母和符号 ≈ 0.36 em，空格 ≈ 0.22 em；textWidth 把拉丁算成 0.5 em，偏宽） */
N2.mixW = (str, size) => { let w = 0; for (const ch of str) w += size * (ch.charCodeAt(0) > 0x2E80 ? 0.95 : ch === ' ' ? 0.22 : 0.36); return w; };
/** 红笔圈（手绘椭圆） */
N2.ring = (k, cx, cy, rx, ry, o = {}) => stroke(k, ringPts(k + '.p', cx, cy, rx, ry, { n: o.n || 16, a0: -130, sweep: 385, rv: 0.05 }), { z: o.z ?? Z.annot, w: o.w || 4.5, color: o.color || C.red, draw: o.draw ?? 1, opacity: o.opacity });

/** 分组：inner（一个或多个 fx）；xf: [[t, [tx, ty, s]], …] 整体平移缩放；out 起 dur 秒淡出；t0 之前不画 */
COMP.n2_grp = {
  init(fx) { fx.inner = [].concat(fx.inner); fx.inner.forEach(f => { const c = COMP[f.type]; if (c && c.init && !f._n2) { c.init(f); f._n2 = 1; } }); return fx; },
  draw(fx, t, F) {
    if (fx.t0 !== undefined && t < fx.t0) return;
    const u = fx.out === undefined ? 0 : clamp((t - fx.out) / (fx.dur ?? 0.35)); if (u >= 1) return;
    const n0 = DL.items.length;
    DL.save();
    if (fx.xf) { const [tx, ty, s] = evalTrack(fx.xf, t); DL.translate(tx, ty); DL.scale(s); }
    fx.inner.forEach(f => COMP[f.type].draw(f, t, F));
    DL.restore();
    N2.fadeFrom(n0, 1 - u);
  },
  cues: fx => fx.cues || fx.inner.flatMap(f => (COMP[f.type].cues ? COMP[f.type].cues(f) : [])),
};
/** 自由绘制：fn(t, lt, key, F)，t0 起每帧调用；cues: [[t, 音效]] */
COMP.n2_fn = { draw(fx, t, F) { if (t < fx.t0) return; fx.fn(t, t - fx.t0, fx.id, F); }, cues: fx => fx.cues || [] };

/* ---------------- 余数花纹与数字砖 ----------------
   N2.fill(key, x0, y0, x1, y1, r, o)：在矩形里画余 r 的花纹（0 实心、1 斜线、2 网点、3 空心＝什么都不画）。
     o: { z, opacity, draw（0..1，从左往右画出多少）, step（斜线间距，默认 18）, dot（网点半径，默认 3.5） }
   N2.brick(key, cx, cy, n, r, o)：数字砖。左边一小条"花纹签"（余 r 的花纹），右边纸色底上写数字，所以花纹不会穿过数字。
     r = null 表示白砖（不刷花纹，用在"平方检查站"）。o: { w: 96（四位数默认 132）, h: 64, size, z, opacity, scale, dim（变灰 0..1）, color（数字颜色）, tab（花纹签宽，默认 27） }
   本集的四种花纹只表示"余几"，别的东西（风车分片、借位、检查站）都不用它们。 */
N2.fill = (k, x0, y0, x1, y1, r, o = {}) => {
  const z = o.z ?? Z.set + 0.2, op = o.opacity ?? 1, xe = x0 + (x1 - x0) * clamp(o.draw ?? 1);
  if (xe <= x0 + 0.5 || op <= 0) return;
  if (r === 0) { stroke(k + '.s', N2.box(x0, y0, xe, y1), { z, w: 1, fill: N2.SOLID, color: N2.SOLID, opacity: op, boil: 0 }); return; }
  if (r === 1) {
    const s = o.step || 18, h = y1 - y0;
    for (let c = x0 - h, i = 0; c < xe; c += s, i++) {
      // segment from (c, y1) to (c + h, y0), clipped to x0..xe
      let a = [c, y1], b = [c + h, y0];
      if (a[0] < x0) a = [x0, y1 - (x0 - c)];
      if (b[0] > xe) b = [xe, y0 + (c + h - xe)];
      if (b[0] - a[0] < 2) continue;
      stroke(`${k}.h${i}`, [a, b], { z, w: o.w || 2.6, color: C.ink, opacity: op, boil: 0.25 });
    }
    return;
  }
  if (r === 2) {
    const s = o.step || 18, R = o.dot || 3.5;
    let i = 0;
    for (let y = y0 + s / 2, row = 0; y < y1 - 2; y += s * 0.8, row++)
      for (let x = x0 + s / 2 + (row % 2) * s / 2; x < xe - 2; x += s) dot(`${k}.d${i++}`, [x, y], R, C.ink, z);
    if (op < 1) for (let j = DL.items.length - i; j < DL.items.length; j++) DL.items[j].attrs.opacity = +op.toFixed(3);
  }
};
N2.brick = (k, cx, cy, n, r, o = {}) => {
  const s = o.scale ?? 1; if (s <= 0.01) return;
  const wide = String(n).length >= 4, W0 = o.w || (wide ? 132 : 96);   // four-digit numbers get a wider brick so the digits stay ≥ 36
  const w = W0 * s, h = (o.h || 64) * s, z = o.z ?? Z.front, op = o.opacity ?? 1, tw = (o.tab ?? Math.min(27, W0 * 0.28)) * s;
  const x0 = cx - w / 2, y0 = cy - h / 2, x1 = cx + w / 2, y1 = cy + h / 2, n0 = DL.items.length;
  stroke(k + '.b', N2.box(x0, y0, x1, y1), { z, w: 3.5, fill: '#FFFDF7', opacity: op });
  if (r !== null && r !== undefined) {
    N2.fill(k + '.f', x0 + 3, y0 + 3, x0 + tw, y1 - 3, r, { z: z + 0.1, opacity: op, step: 12 * s, dot: 2.6 * s });
    stroke(k + '.tl', [[x0 + tw, y0], [x0 + tw, y1]], { z: z + 0.15, w: 2.5, opacity: op });
  }
  const str = String(n), fs = (o.size || (str.length >= 4 ? 38 : str.length === 3 ? 38 : 42)) * s;
  const tx = r === null || r === undefined ? cx : (x0 + tw + x1) / 2;
  text(k + '.n', str, tx, cy + 1, { size: fs, font: CFG.FONT_MIX, z: z + 0.2, anchor: 'middle', color: o.color || C.ink, opacity: op });
  if (o.dim) N2.fadeFrom(n0, 1 - 0.65 * clamp(o.dim));
};

/* ---------------- 四条跑道 ----------------
   { type:'n2_lanes', id, x, y,          // 左上角（不含左边的"余 r"字）
     W: 1000, H: 76, gap: 16,            // 跑道长、高、间距
     head: 70,                           // 跑道最左边的花纹头（余 r 的花纹）宽度
     t0, pop: 0.8, t1,                   // 出现（四条依次画出）、淡出
     lanes: [0,1,2,3],                   // 画哪几条（默认四条）
     hi: [[t, r, on]],                   // 第 r 条描黄（on = 1）/ 取消（0）
     dim: [[t, r, on]],                  // 第 r 条变灰
     labels: true }                      // 左边写"余0 / 余1 / 余2 / 余3"
   N2.laneXY(L, n)：数 n 在跑道布局 L（就是这个 fx，或者同样字段的对象）里的砖位置：第 n % 4 条、第 floor(n / 4) 轮；
     每一轮一列，列宽 L.cell（默认 110），第一列中心在 x + head + cell / 2。
   发布命名点 <id>.lane0 … lane3（每条跑道左端花纹头的中心）。 */
N2.laneXY = (L, n) => {
  const H = L.H || 76, gap = L.gap ?? 16, head = L.head ?? 70, cell = L.cell || 110;
  const r = ((n % 4) + 4) % 4, j = Math.floor(n / 4);
  return [L.x + head + cell * (j + 0.5), L.y + r * (H + gap) + H / 2];
};
COMP.n2_lanes = {
  draw(fx, t, F) {
    if (t < fx.t0) return;
    const out = fx.t1 !== undefined ? clamp((t - fx.t1) / 0.35) : 0; if (out >= 1) return;
    const k = fx.id, W = fx.W || 1000, H = fx.H || 76, gap = fx.gap ?? 16, head = fx.head ?? 70, op = 1 - out, lt = t - fx.t0;
    const last = (arr, r) => { let v = 0, at = -1; for (const e of arr || []) if (t >= e[0] && e[1] === r) { v = e[2] ?? 1; at = e[0]; } return [v, at]; };
    (fx.lanes || [0, 1, 2, 3]).forEach((r, i) => {
      const y0 = fx.y + r * (H + gap), y1 = y0 + H, x0 = fx.x, x1 = fx.x + W;
      const u = fx.t0 < 0 ? 1 : EASE.out(clamp((lt - i * (fx.pop ?? 0.8) / 4) / 0.4)); if (u <= 0) return;
      const [dm] = last(fx.dim, r), n0 = DL.items.length;
      const [hv, hat] = last(fx.hi, r);
      if (hv) stroke(`${k}.hi${r}`, N2.box(x0 - 8, y0 - 8, x1 + 8, y1 + 8), { z: Z.hi, w: 14, color: C.hi, opacity: 0.85 * clamp((t - hat) / 0.3) * op });
      stroke(`${k}.o${r}`, N2.box(x0, y0, x1, y1), { z: Z.set, w: 4, draw: u, fill: C.paper, opacity: op });
      N2.fill(`${k}.f${r}`, x0 + 2, y0 + 2, x0 + head, y1 - 2, r, { z: Z.set + 0.2, draw: u, opacity: op });
      stroke(`${k}.hl${r}`, [[x0 + head, y0], [x0 + head, y1]], { z: Z.set + 0.3, w: 3, draw: u, opacity: op });
      if (fx.labels !== false) text(`${k}.n${r}`, '余' + r, x0 - 14, (y0 + y1) / 2, { size: fx.labelSize || 40, z: Z.set + 0.3, anchor: 'end', font: CFG.FONT_MIX, opacity: u * op });
      F.targets[`${k}.lane${r}`] = [x0 + head / 2, (y0 + y1) / 2];
      if (dm) N2.fadeFrom(n0, 1 - 0.6 * dm);
    });
  },
  cues: fx => (fx.t0 >= 0 ? [[fx.t0, 'pen']] : []),
};

/* ---------------- 顶栏和议程条 n2_hud ----------------
   每一场都画一个 { type:'n2_hud', id:'hud', at:'<场景 id>', …事件 }。场景开始时的状态由 N2.HUD_AT[at] 给定（= 上一场结束时的状态），
   所以切场时顶栏不会跳。场景里只写"这一场发生的变化"：
     strip: t                      细跑道条出现（lanes 场结尾，跑道缩上去的那一刻）
     dock: [[t, n]]                卡 n 停靠：t 是 n2_bigcard 开始飞向顶栏的时刻（同一个 t 传给两边），t + 0.6 秒后由顶栏接着画
     agenda: t                     议程条出现（三个编号）
     tick: [[t, i]]                议程第 i 项（0、1、2）打勾：先展开文字 2.6 秒，再收回成"编号 + ✓"
     open: [[t0, t1, i]]           议程第 i 项临时展开（不打勾）
     collapse: [[t, on]]           顶栏收成一条细边（on = 1）/ 恢复（0）
     pop: [[t0, t1, n]]            卡 n 临时弹出（收起时也会出现），放大、垫黄
     flash: [[t, n]]               卡 n 闪一下
     stripHi: [[t0, t1, r]]        细跑道条的第 r 条描红（被引用）
     out: t                        整个顶栏 0.4 秒淡出（ending 场结尾）
   发布命名点 hud.card1 … card4（卡的中心）、hud.strip0 … strip3（细跑道条每条的中心）、hud.ag0 … ag2（议程编号的中心）。 */
N2.HUD_AT = {
  lanes: {},
  why4: { strip: 1 },
  agenda: { strip: 1, cards: 1 },
  squares: { strip: 1, cards: 1, agenda: 1 },
  even: { strip: 1, cards: 1, agenda: 1 },
  odd: { strip: 1, cards: 1, agenda: 1 },
  predict: { strip: 1, cards: 2, agenda: 1, ticks: [0] },
  proof: { strip: 1, cards: 2, agenda: 1, ticks: [0] },
  borrow: { strip: 1, cards: 2, agenda: 1, ticks: [0], collapsed: 1 },
  wall: { strip: 1, cards: 2, agenda: 1, ticks: [0], collapsed: 1 },
  dark: { strip: 1, cards: 3, agenda: 1, ticks: [0, 1] },
  enough: { strip: 1, cards: 3, agenda: 1, ticks: [0, 1, 2] },
  ending: { strip: 1, cards: 4, agenda: 1, ticks: [0, 1, 2] },
};
N2.CARDS = { 1: '零头不变', 2: '平方：0或1', 3: '相减：0,1,3', 4: '只判"不是"' };
N2.AGENDA = ['平方落哪几条？', '两个平方相减呢？', '余2：还没找到，还是根本没有？'];
N2.CIRC = ['①', '②', '③', '④'];
N2.HUD_GEO = {
  strip: [452, 80, 604, 156],                      // 细跑道条：四条，各高 15，间距 5
  card: n => [732 + (n - 1) * 230, 118],           // 卡 n 的中心（细跑道条右边起，四张排到 x 1542）
  cardWH: [214, 70],
  ag: i => [78 + i * 118, 128],                    // 议程编号 i 的中心
};
COMP.n2_hud = {
  draw(fx, t, F) {
    const S = N2.HUD_AT[fx.at] || {}, k = fx.id, G = N2.HUD_GEO;
    const out = fx.out !== undefined ? clamp((t - fx.out) / 0.4) : 0; if (out >= 1) return;
    const n0 = DL.items.length;
    // ---- state at t
    const stripT = S.strip ? -9 : fx.strip ?? Infinity;
    const cardT = n => (n <= (S.cards || 0) ? -9 : ((fx.dock || []).find(d => d[1] === n) || [Infinity])[0] + 0.6);
    const agT = S.agenda ? -9 : fx.agenda ?? Infinity;
    const tickT = i => ((S.ticks || []).includes(i) ? -9 : ((fx.tick || []).find(d => d[1] === i) || [Infinity])[0]);
    let col = S.collapsed ? 1 : 0, colAt = -9; for (const [tt, on] of fx.collapse || []) if (t >= tt) { col = on ? 1 : 0; colAt = tt; }
    const cu = clamp((t - colAt) / 0.35), cv = col ? EASE.io(cu) : 1 - EASE.io(cu);   // 0 = open, 1 = collapsed
    const cvv = colAt < 0 ? (col ? 1 : 0) : cv;
    // ---- collapsed: one thin line along the top edge
    if (cvv > 0.02 && t >= stripT) stroke(k + '.thin', [[452, 70], [1556, 70]], { z: Z.annot - 2, w: 5, color: C.pencil, opacity: cvv });
    const openK = 1 - cvv;
    // ---- strip
    if (t >= stripT && openK > 0.01) {
      const [x0, y0, x1] = G.strip, u = stripT < 0 ? 1 : EASE.out(clamp((t - stripT) / 0.4));
      for (let r = 0; r < 4; r++) {
        const ya = y0 + r * 20, yb = ya + 15;
        stroke(`${k}.sb${r}`, N2.box(x0, ya, x0 + (x1 - x0) * u, yb), { z: Z.annot - 2, w: 2.5, fill: C.paper, opacity: openK });
        N2.fill(`${k}.sf${r}`, x0 + 1, ya + 1, x0 + (x1 - x0) * u - 1, yb - 1, r, { z: Z.annot - 1.9, step: 9, dot: 2, w: 1.6, opacity: openK });
        F.targets[`${k}.strip${r}`] = [(x0 + x1) / 2, (ya + yb) / 2];
        for (const [a, b, rr] of fx.stripHi || []) if (rr === r && t >= a && t < b) stroke(`${k}.sh${r}`, ringPts(`${k}.shp${r}`, (x0 + x1) / 2, (ya + yb) / 2, (x1 - x0) / 2 + 14, 16, { n: 14 }), { z: Z.annot, w: 4, color: C.red, closed: true, draw: clamp((t - a) / 0.3) });
      }
    }
    // ---- cards
    const [cw, ch] = G.cardWH;
    for (let n = 1; n <= 4; n++) {
      const ct = cardT(n), [cx, cy] = G.card(n); F.targets[`${k}.card${n}`] = [cx, cy];
      const popE = (fx.pop || []).find(([a, b, nn]) => nn === n && t >= a && t < b + 0.3);
      if (t < ct) continue;
      let vis = openK, sc = 1, glow = 0;
      if (popE) { const [a, b] = popE, pu = clamp((t - a) / 0.25) * (1 - clamp((t - b) / 0.3)); vis = Math.max(vis, pu); sc = 1 + 0.15 * pu; glow = pu; }
      for (const [ft, nn] of fx.flash || []) if (nn === n && t >= ft && t < ft + 0.7) { const q = Math.sin(Math.PI * (t - ft) / 0.7); sc = Math.max(sc, 1 + 0.15 * q); glow = Math.max(glow, q); vis = Math.max(vis, q); }
      if (vis <= 0.01) continue;
      const fin = ct < 0 ? 1 : EASE.out(clamp((t - ct) / 0.2));
      DL.save(); DL.translate(cx, cy); DL.scale(sc);
      if (glow > 0) stroke(`${k}.cg${n}`, N2.box(-cw / 2 - 6, -ch / 2 - 6, cw / 2 + 6, ch / 2 + 6), { z: Z.annot - 1.5, w: 14, color: C.hi, opacity: 0.85 * glow });
      stroke(`${k}.c${n}`, N2.box(-cw / 2, -ch / 2, cw / 2, ch / 2), { z: Z.annot - 1, w: 3, fill: '#FFFFFF', opacity: vis * fin });
      text(`${k}.cn${n}`, N2.CIRC[n - 1], -cw / 2 + 20, 1, { size: 32, color: C.red, z: Z.annot - 0.8, anchor: 'middle', opacity: vis * fin });
      text(`${k}.ct${n}`, N2.CARDS[n], -cw / 2 + 38, 1, { size: 30, z: Z.annot - 0.8, anchor: 'start', font: CFG.FONT_MIX, opacity: vis * fin });
      DL.restore();
    }
    // ---- agenda bar
    if (t >= agT) {
      const au = agT < 0 ? 1 : EASE.back(clamp((t - agT) / 0.35));
      for (let i = 0; i < 3; i++) {
        const [ax, ay] = G.ag(i); F.targets[`${k}.ag${i}`] = [ax, ay];
        const tt = tickT(i), done = t >= tt;
        stroke(`${k}.ab${i}`, ringPts(`${k}.abp${i}`, ax - 14, ay, 30 * au, 30 * au, { n: 12 }), { z: Z.annot - 1, w: 3.5, color: C.red, closed: true, fill: '#FFFFFF' });
        text(`${k}.an${i}`, String(i + 1), ax - 14, ay + 1, { size: 36, color: C.red, z: Z.annot - 0.8, anchor: 'middle', font: CFG.FONT_MIX, opacity: au });
        if (done) {
          const tu = tt < 0 ? 1 : EASE.back(clamp((t - tt - 0.4) / 0.25));
          text(`${k}.ak${i}`, '✓', ax + 34, ay - 2, { size: 50 * Math.max(0.01, tu), color: C.red, z: Z.annot - 0.7, anchor: 'middle', font: CFG.FONT_MIX });
        }
        // expanded text: on a tick (2.6 s) or an explicit open
        let ex = 0;
        if (tt >= 0 && t >= tt) ex = clamp((t - tt) / 0.25) * (1 - clamp((t - tt - 2.6) / 0.3));
        for (const [a, b, ii] of fx.open || []) if (ii === i && t >= a) ex = Math.max(ex, clamp((t - a) / 0.25) * (1 - clamp((t - b) / 0.3)));
        if (ex > 0.01) {
          const s = N2.AGENDA[i], w = textWidth(s, 36) * 0.95 + 40, x0 = 44, y0 = 178;
          stroke(`${k}.ae${i}`, N2.box(x0, y0, x0 + w, y0 + 62), { z: Z.annot + 1, w: 3, color: C.red, fill: '#FFFFFF', opacity: ex });
          text(`${k}.at${i}`, s, x0 + 20, y0 + 32, { size: 36, z: Z.annot + 1.2, anchor: 'start', font: CFG.FONT_MIX, opacity: ex });
          stroke(`${k}.al${i}`, [[ax - 14, ay + 30], [x0 + 40, y0]], { z: Z.annot + 0.9, w: 2.5, color: C.red, opacity: ex });
        }
      }
    }
    if (out > 0) N2.fadeFrom(n0, 1 - out);
  },
  cues: fx => [
    ...(fx.strip !== undefined ? [[fx.strip, 'swish']] : []),
    ...(fx.dock || []).map(([tt]) => [tt + 0.6, 'tap']),
    ...(fx.agenda !== undefined ? [[fx.agenda, 'pop']] : []),
    ...(fx.tick || []).map(([tt]) => [tt + 0.4, 'pen']),
    ...(fx.pop || []).map(([tt]) => [tt, 'plip']),
  ],
};

/* ---------------- 结论卡 n2_bigcard ----------------
   { type:'n2_bigcard', id, n,              // 卡号 1–4（左上角红色 ①…④）
     at: [cx, cy], w: 760,                  // 中心、宽（高按行数）
     lines: ['每个平方 ÷ 4：', '只余 0 或 1'], size: 52,
     t0,                                    // 开始写（白卡 0.3 秒画出，文字逐字出现，最后一行垫黄色荧光笔）
     cps: 14,                               // 每秒字数
     sub: '它给的是必须满足的条件',          // 可选：下面一行小字（36 号）
     dock: t }                              // 可选：t 起 0.6 秒飞进顶栏卡 n 的位置并缩小；之后不画（顶栏接着画，hud 的 dock 用同一个 t）
   发布命名点 <id>.c（卡中心，飞行时跟着动）、<id>.r（卡右边缘中点，钉范围卡用）。 */
COMP.n2_bigcard = {
  draw(fx, t, F) {
    if (t < fx.t0) return;
    if (fx.dock !== undefined && t >= fx.dock + 0.6) return;
    const k = fx.id, size = fx.size || 52, L = fx.lines || [], w = fx.w || 760, lh = size * 1.3;
    const h = 40 + L.length * lh + (fx.sub ? 54 : 0) + 20, lt = t - fx.t0, p = EASE.out(clamp(lt / 0.3));
    let cx = fx.at[0], cy = fx.at[1], sc = 1;
    if (fx.dock !== undefined && t > fx.dock) {
      const u = EASE.io(clamp((t - fx.dock) / 0.6)), [dx, dy] = N2.HUD_GEO.card(fx.n);
      cx = lerp(cx, dx, u); cy = lerp(cy, dy, u); sc = lerp(1, N2.HUD_GEO.cardWH[0] / w, u);
    }
    F.targets[k + '.c'] = [cx, cy]; F.targets[k + '.r'] = [cx + w / 2 * sc, cy];
    DL.save(); DL.translate(cx, cy); DL.scale(sc);
    stroke(k + '.b', N2.box(-w / 2, -h / 2, w / 2, h / 2), { z: Z.annot - 1, w: 4, fill: '#FFFFFF', draw: p });
    text(k + '.n', N2.CIRC[(fx.n || 1) - 1], -w / 2 + 34, -h / 2 + 36, { size: 48, color: C.red, z: Z.annot - 0.5, anchor: 'middle', opacity: p });
    let shown = (lt - 0.3) * (fx.cps || 14);
    L.forEach((s, i) => {
      const n = Math.max(0, Math.min(s.length, Math.floor(shown))); shown -= s.length;
      const y = -h / 2 + 40 + lh * (i + 0.5);
      if (i === L.length - 1 && n > 0) {
        const bw = textWidth(s, size) * 0.93;
        stroke(`${k}.hi${i}`, [[-bw / 2 - 10, y + 4], [bw / 2 + 10, y + 4]], { z: Z.annot - 0.9, w: size * 0.95, color: C.hi, draw: clamp(n / s.length), opacity: 0.9 });
      }
      if (n > 0) text(`${k}.l${i}`, s.slice(0, n), -textWidth(s, size) * 0.465, y, { size, z: Z.annot - 0.5, anchor: 'start', font: CFG.FONT_MIX });
    });
    if (fx.sub && shown > 0) text(k + '.sub', fx.sub, 0, h / 2 - 40, { size: 36, z: Z.annot - 0.5, anchor: 'middle', color: C.pencil, opacity: clamp(shown / 4) });
    DL.restore();
  },
  cues: fx => [[fx.t0, 'paper'], ...(fx.dock !== undefined ? [[fx.dock, 'whoosh']] : [])],
};

/* ---------------- "猜想"标签 n2_tag ----------------
   { type:'n2_tag', id, at: [x, y] 或 pos: [[t, [x, y]], …], rot: -6,
     text: '猜想', size: 40,                // 第 1 集表上的那张用 text: '猜想（还没证明）', size: 50, rot: -3
     t0,                                    // 盖上（放大落下）
     swap: t,                               // 可选：红框标签被撕下（往下掉、转、淡出），原处弹出黄底"证明了 ✓"
     t1 }                                   // 可选：0.3 秒淡出 */
COMP.n2_tag = {
  draw(fx, t, F) {
    if (t < fx.t0) return;
    const out = fx.t1 !== undefined ? clamp((t - fx.t1) / 0.3) : 0; if (out >= 1) return;
    const k = fx.id, size = fx.size || 40, [x, y] = fx.pos ? evalTrack(fx.pos, t) : fx.at, rot = fx.rot ?? -6, n0 = DL.items.length;
    const box = (key, s, color, fill, sz) => { const w = textWidth(s, sz) * 0.95 + 40, h = sz + 30; stroke(key + '.b', N2.box(-w / 2, -h / 2, w / 2, h / 2), { z: Z.annot + 1, w: 4.5, color, fill }); };
    const u = clamp((t - fx.t0) / 0.25);
    const torn = fx.swap !== undefined ? clamp((t - fx.swap) / 0.5) : 0;
    if (torn < 1) {
      DL.save(); DL.translate(x - 150 * torn, y - 30 * torn + 90 * torn * torn); DL.rotate(rot - 60 * torn);   // torn off sideways, not down over what is below DL.scale(Math.max(0.01, lerp(1.5, 1, EASE.back(u))));
      const a = n0; box(k + '.r', fx.text || '猜想', C.red, C.paper, size);
      text(k + '.rt', fx.text || '猜想', 0, 2, { size, color: C.red, z: Z.annot + 1.2, anchor: 'middle' });
      N2.fadeFrom(a, clamp(u * 3) * (1 - torn));
      DL.restore();
    }
    if (fx.swap !== undefined && t >= fx.swap + 0.15) {
      const v = EASE.back(clamp((t - fx.swap - 0.15) / 0.3)), s = '证明了 ✓', sz = Math.round(size * 0.95);
      DL.save(); DL.translate(x, y); DL.rotate(rot * 0.5); DL.scale(Math.max(0.01, v));
      const w = textWidth(s, sz) * 0.95 + 40, h = sz + 30;
      stroke(k + '.gh', [[-w / 2 + 8, 0], [w / 2 - 8, 0]], { z: Z.annot + 0.9, w: h - 6, color: C.hi, opacity: 0.95 });
      stroke(k + '.gb', N2.box(-w / 2, -h / 2, w / 2, h / 2), { z: Z.annot + 1, w: 4 });
      text(k + '.gt', s, 0, 2, { size: sz, z: Z.annot + 1.2, anchor: 'middle', font: CFG.FONT_MIX });
      DL.restore();
    }
    if (out > 0) N2.fadeFrom(n0, 1 - out);
  },
  cues: fx => [[fx.t0, 'stamp'], ...(fx.swap !== undefined ? [[fx.swap, 'swish'], [fx.swap + 0.15, 'pop']] : [])],
};

/* ---------------- 证明栈 n2_stack ----------------
   右侧一栏（x N2.STACK_X 起，宽约 380），每行一步；当前行黑墨 + 黄色荧光笔，讲过的行变灰不擦。
   { type:'n2_stack', id:'stack', x: N2.STACK_X, y: N2.STACK_Y, lh: N2.STACK_LH, size: 34,   // 位置都有默认值，四场不要改
     from: k,                 // 场景开始时已经写好的行数（前一场写过的）；配合 cur: [[0, k-1]] 让上一场最后的当前行接着高亮，切场不跳
     add: [[t, i]],           // 第 i 行写出来并成为当前行
     cur: [[t, i]],           // 第 i 行重新成为当前行（-1 = 没有当前行）
     all: t,                  // 整列一起亮（都变黑）
     stamp: t,                // 栈顶盖红章"反证法"
     box: t,                  // 所有行里的 6 被红笔改成 □（dark 场）
     glow: t,                 // "□ 在余 2"那行的"余 2"发红光
     ok: t,                   // 其余各行右边打 ✓，栏下写"对任何 □ 都成立"
     t1 }                     // 0.4 秒淡出
   行的内容固定在 N2.STACK（四场共用同一份），行号见下。发布命名点 <id>.l0 … l7（每行左端）。 */
N2.STACK = [
  '假设：a² − b² = 6',        // 0  proof
  '两个零头：0 或 1',          // 1  proof
  '相减：0、1，借一组得 3',     // 2  borrow
  '组够减',                    // 3  borrow
  '要借时，借得到',             // 4  borrow
  '相减的零头：0、1、3',        // 5  wall
  '6 在余 2，不在 0、1、3',     // 6  wall
  '撞墙：6 没有小拐角',         // 7  wall
];
COMP.n2_stack = {
  draw(fx, t, F) {
    const out = fx.t1 !== undefined ? clamp((t - fx.t1) / 0.4) : 0; if (out >= 1) return;
    const k = fx.id, x = fx.x ?? N2.STACK_X, y0 = fx.y ?? N2.STACK_Y, lh = fx.lh || N2.STACK_LH, size = fx.size || 34, n0 = DL.items.length;
    const addT = i => (i < (fx.from || 0) ? -9 : ((fx.add || []).find(a => a[1] === i) || [Infinity])[0]);
    let cur = -1; const ev = [...(fx.add || []), ...(fx.cur || [])].sort((a, b) => a[0] - b[0]);
    for (const [tt, i] of ev) if (t >= tt) cur = i;
    const all = fx.all !== undefined && t >= fx.all, boxed = fx.box !== undefined && t >= fx.box;
    let any = false;
    N2.STACK.forEach((s0, i) => {
      const at = addT(i); if (t < at) return; any = true;
      const y = y0 + i * lh, u = at < 0 ? 1 : clamp((t - at) / 0.35);
      const s = boxed && s0.includes('6') ? s0.replace(/6/g, '□') : s0;
      const isCur = i === cur && !all, col = isCur || all ? C.ink : C.pencil;
      if (isCur) stroke(`${k}.hi${i}`, [[x - 6, y + 3], [x + Math.min(380, textWidth(s, size) * 0.95) + 6, y + 3]], { z: Z.hi, w: size * 1.05, color: C.hi, draw: u, opacity: 0.9 });
      text(`${k}.t${i}`, s, x, y, { size, z: Z.annot - 1, anchor: 'start', font: CFG.FONT_MIX, color: col, opacity: u });
      if (boxed && s0.includes('6')) {   // a red ring flashes where the 6 was (CJK ≈ 0.93 em, Latin/digits ≈ 0.5 em in FONT_MIX)
        const bu = clamp((t - fx.box) / 0.4), j = s0.indexOf('6'), off = N2.mixW(s0.slice(0, j), size) + size * 0.36;
        if (bu < 1) stroke(`${k}.bx${i}`, ringPts(`${k}.bxp${i}`, x + off, y, 24, 26, { n: 10 }), { z: Z.annot, w: 3.5, color: C.red, closed: true, opacity: 1 - bu });
      }
      if (i === 6 && fx.glow !== undefined && t >= fx.glow) {
        const g = clamp((t - fx.glow) / 0.3), off = N2.mixW(s.slice(0, s.indexOf('余')), size);
        stroke(`${k}.gl`, ringPts(`${k}.glp`, x + off + 40, y, 44, 26, { n: 14 }), { z: Z.annot, w: 5, color: C.red, closed: true, draw: g });
      }
      if (fx.ok !== undefined && t >= fx.ok + i * 0.08 && !s0.includes('6')) text(`${k}.ok${i}`, '✓', x + 392, y - 2, { size: 40, color: C.red, z: Z.annot, anchor: 'middle', font: CFG.FONT_MIX });
      F.targets[`${k}.l${i}`] = [x, y];
    });
    if (fx.ok !== undefined && t >= fx.ok + 0.7) text(k + '.okt', '对任何 □ 都成立', x - 40, y0 + 3.5 * lh, { size: 36, color: C.red, z: Z.annot, anchor: 'end', font: CFG.FONT_MIX, opacity: clamp((t - fx.ok - 0.7) / 0.3) });
    if (any) stroke(k + '.rule', [[x - 24, y0 - 30], [x - 24, y0 + 7.6 * lh]], { z: Z.set, w: 2.5, color: C.pencil, opacity: 0.7 });
    if (fx.stamp !== undefined && t >= fx.stamp) {
      const su = clamp((t - fx.stamp) / 0.2), sc = 0.85 * lerp(1.8, 1, EASE.back(su));
      DL.save(); DL.translate(x + 300, y0 + 3 * lh + 2); DL.rotate(-8); DL.scale(sc);   // right of the short row 3 (组够减), clear of the scope card
      stroke(k + '.st', N2.box(-92, -34, 92, 34), { z: Z.stamp, w: 5, color: C.red, opacity: clamp(su * 3) });
      text(k + '.stt', '反证法', 0, 2, { size: 44, color: C.red, z: Z.stamp, anchor: 'middle', opacity: clamp(su * 3) });

// 第 10 场 · 上集的问题与四条跑道（lanes）
// 开场：第 1 集 1–16 的两行表缩小回来，空格 2、6、10、14 闪一下；下面是"还没找到 / 根本没有"两格，小问号站在两格中间举牌提问；
// 两格缩成一张小卡收到一边。9 个点排一行（9 = 3 × 3），红圈 4 | 4 | 1，"零头"；本子上的横式 9 ÷ 4 = 2 … 1，"余数"。
// 5 个散点：红圈抓走 4 个成一组，只剩 1 个；卡片"余数：0、1、2、3"。
// 四条跑道：数字砖 0–15 轮流落进去，每满一轮，跑道左边多一个红色 4 点小方框；9 的那排点挪到一边，和砖 9 对上；
// 红点按顺序跳过 0–15（每个数只轮到一次），砖 6 闪一下，别的三条变淡。翻页到第 1 集的地图：右门打开，门后是四条小跑道，
// 门楣写"余数门"；地图淡出，四条小跑道缩进顶栏，成了细跑道条。
// 开场：空舞台（小问号 0.1 秒弹进来）；结尾：只剩顶栏的细跑道条。
(() => {
  const FL = N2.FL, W = N2.W, F = N2.F;

  /* ---------------- the maths, checked ---------------- */
  const ways = n => { const w = []; for (let a = 1; a <= n; a++) for (let b = 0; b < a; b++) if (a * a - b * b === n) w.push([a, b]); return w; };
  const NUMS = Array.from({ length: 16 }, (_, i) => i + 1), BLANK = NUMS.filter(n => !ways(n).length);
  if (BLANK.join() !== '2,6,10,14') console.error('l2_lanes: the blanks of the 1–16 table', BLANK);
  if (3 * 3 !== 9 || 4 + 4 + 1 !== 9 || Math.floor(9 / 4) !== 2 || 9 % 4 !== 1 || 4 * 2 + 1 !== 9) console.error('l2_lanes: 9 = 3 × 3 = 4 + 4 + 1, 9 ÷ 4 = 2 … 1');

  const ways = n => { const w = []; for (let a = 1; a <= n; a++) for (let b = 0; b < a; b++) if (a * a - b * b === n) w.push([a, b]); return w; };
  const NUMS = Array.from({ length: 16 }, (_, i) => i + 1), BLANK = NUMS.filter(n => !ways(n).length);
  if (BLANK.join() !== '2,6,10,14') console.error('w2_why4: the blanks of the 1–16 table', BLANK);
  // 2, 6, 10, 14: 2 plus 0, 1, 2, 3 whole groups of 4, so the bit left over is always 2
  BLANK.forEach((n, k) => { if (n !== 2 + 4 * k || n % 4 !== 2 || (n - 2) / 4 !== k) console.error('w2_why4: blank', n, 'is 2 + 4 ×', k); });

  const EVENS = [2, 4, 6, 8, 10, 12, 14], ODDS = [1, 3, 5, 7, 9];

// 第 30 场 · 平方落进哪几条（squares）
// Jasper 走进来，右边插着他的旧牌"大的会 / 剩 2、3？"，牌杆上贴着第 1 集片尾那排 1、4、9、16、25 的小卡（下面各一块余数花纹：斜线、实心……）。

// 旁白念到哪个，哪个点亮：1²–5² 红框圈成"4 点一组 + 零头"（零头点变红），6²–10² 刷一条余数花纹、红字"÷4 余0 / 余1"，然后落进平方跑道。

// Jasper 举新牌"偶 → 余 0，/ 奇 → 余 1？"，盖红框"猜想"标签。小问号跳到余 0 跑道上举牌"第 100 个？"，跑道右端拉出省略号。
// 开场：只有顶栏 + 议程条；结尾：只剩顶栏 + 议程条（其余 0.4 秒淡出，Jasper 走出右边）。
(() => {
  const FL = N2.FL;

  /* ---------------- the maths, checked on load ---------------- */
  const K = [...Array(11).keys()];                       // side lengths 0..10
  const SQ = K.map(k => k * k), REM = SQ.map(v => v % 4);
  const LANE0 = [0, 4, 16, 36, 64, 100], LANE1 = [1, 9, 25, 49, 81];   // as the narrator reads them
  if (SQ.filter(v => v % 4 === 0).join() !== LANE0.join()) console.error('s2_squares: squares leaving 0', SQ);
  if (SQ.filter(v => v % 4 === 1).join() !== LANE1.join()) console.error('s2_squares: squares leaving 1', SQ);
  if (SQ.some(v => v % 4 > 1) || LANE0.length + LANE1.length !== 11) console.error('s2_squares: 11 squares, none in lanes 2 and 3');
  K.forEach(k => { if (REM[k] !== k % 2) console.error('s2_squares: even side → 0, odd side → 1 fails at', k); });
  // Jasper's divisions for the big ones (the red "÷4 余r" labels)
  [[36, 9, 0], [64, 16, 0], [100, 25, 0], [49, 12, 1], [81, 20, 1]].forEach(([n, q, r]) => { if (4 * q + r !== n || r !== n % 4) console.error('s2_squares:', n, '÷ 4 =', q, '…', r); });
  // the sticker from episode 1: 1, 4, 9, 16, 25 leave 1, 0, 1, 0, 1
  const STK = [1, 4, 9, 16, 25];
  if (STK.map(v => v % 4).join() !== '1,0,1,0,1') console.error('s2_squares: sticker remainders');
  // 1²–5² framed as "groups of 4 + the bit left over": every dot in exactly one group or the leftover
  const blk = (r, c) => [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]];
  const GROUPS = {
    1: { g: [], left: [[0, 0]] },
    2: { g: [blk(0, 0)], left: [] },
    3: { g: [[[0, 0], [0, 1], [0, 2], [1, 2]], blk(1, 0)], left: [[2, 2]] },
    4: { g: [blk(0, 0), blk(0, 2), blk(2, 0), blk(2, 2)], left: [] },
    5: { g: [blk(0, 0), blk(0, 2), blk(2, 0), blk(2, 2), [[0, 4], [1, 4], [2, 4], [3, 4]], [[4, 0], [4, 1], [4, 2], [4, 3]]], left: [[4, 4]] },
  };
  for (let k = 1; k <= 5; k++) {
    const G = GROUPS[k], seen = new Set(); let bad = false;
    [...G.g.flat(), ...G.left].forEach(([r, c]) => { const key = r + ',' + c; if (seen.has(key) || r >= k || c >= k) bad = true; seen.add(key); });
    if (bad || seen.size !== k * k || G.g.some(q => q.length !== 4) || G.left.length !== k * k % 4 || G.g.length !== Math.floor(k * k / 4)) console.error('s2_squares: groups of', k, '×', k);
  }

  /* ---------------- timing (scene clock) ---------------- */
  const T = {
    KID: 0.05, KID_AT: 0.65, OLD: 0.9, STICK: 1.6,
    ROW: 3.0, ROW_DT: 0.12, LANES: 4.9,
    LIT0: [6.9, 7.45, 8.0, 8.7, 9.6, 10.5],              // 0, 4, 16, 36, 64, 100
    HEAD0: 11.35,
    LIT1: [13.0, 13.5, 14.05, 14.95, 15.85],             // 1, 9, 25, 49, 81
    HEAD1: 16.65,
    ZERO2: 19.3, ZERO3: 19.9, QMARK: 20.9,
    NEW: 22.6, TAG: 25.7, QM: 27.45, QSIGN: 27.8, ELL: 29.3,

  // the temporary square lanes (no ticks, no ┐)
  const LN = { x: 150, y: 400, W: 800, H: 80, gap: 12, head: 56, cell: 112 };
  const laneY = r => LN.y + r * (LN.H + LN.gap) + LN.H / 2;

  const ITEMS = K.map(k => {
    const r = REM[k], j = r === 0 ? k / 2 : (k - 1) / 2, lit = r === 0 ? T.LIT0[j] : T.LIT1[j];

  if (ITEMS.filter(it => it.r === 0).map(it => it.n).join() !== LANE0.join() || ITEMS.filter(it => it.r === 1).map(it => it.n).join() !== LANE1.join()) console.error('s2_squares: lane order');
  // the signs (both scenes squares and odd use the same places)

  const QX = 900;   // 小问号 stands on the top edge of lane 0

  /* ---------------- helpers ---------------- */
  const dotO = (key, p, r, col, z, o = 1) => { if (r <= 0.05 || o <= 0.01) return; dot(key, p, r, col, z); if (o < 1) DL.items[DL.items.length - 1].attrs.opacity = +o.toFixed(3); };
  const dashRect = (key, x0, y0, x1, y1, o = {}) => { const P = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; P.forEach((p, i) => N2.dash(`${key}${i}`, p, P[(i + 1) % 4], { step: o.step || 10, on: o.on || 5, w: o.w || 2.4, z: o.z ?? Z.front, color: o.color })); };
  /** one little square k × k, centred at (cx, cy), dot spacing G0 × s; lit (0..1) draws its groups (k ≤ 5) or its remainder strip (k ≥ 6) */
  function drawSquare(key, it, cx, cy, s, t) {
    const k = it.k, g = G0 * s, R = 4.6 * s, z = Z.front, lit = t >= it.lit;
    const bump = lit && t < it.lit + 0.35 ? 1 + 0.3 * Math.sin(Math.PI * (t - it.lit) / 0.35) : 1;
    if (k === 0) { const h = 15 * s * bump; dashRect(key + '.z', cx - h, cy - h, cx + h, cy + h, { step: 9 * s, on: 5 * s, w: 2.6 }); return; }
    if (!it.big) {
      const off = (k - 1) / 2, P = (i, j) => [cx + (j - off) * g, cy + (i - off) * g];
      const G = GROUPS[k], left = new Set(G.left.map(([i, j]) => i + ',' + j));
      for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) dot(`${key}.d${i}_${j}`, P(i, j), R * bump, lit && left.has(i + ',' + j) ? C.red : C.ink, z);
      if (lit) G.g.forEach((cells, gi) => {
        const d = EASE.out(clamp((t - it.lit - gi * 0.06) / 0.3)), pad = g * 0.38, rw = 2.6 * Math.max(0.85, s);
        const rs = cells.map(c => c[0]), cs = cells.map(c => c[1]), i0 = Math.min(...rs), i1 = Math.max(...rs), j0 = Math.min(...cs), j1 = Math.max(...cs);
        const a = P(i0, j0), b = P(i1, j1);
        if ((i1 - i0 + 1) * (j1 - j0 + 1) === 4) stroke(`${key}.g${gi}`, superPts((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, b[0] - a[0] + 2 * pad, b[1] - a[1] + 2 * pad, 20, 5), { z: Z.annot - 3, w: rw, color: C.red, closed: true, draw: d });
        else {   // the L of 3 × 3: the top row and the dot under its right end
          const q = (i, j) => P(i, j), x0 = q(0, 0)[0] - pad, x2 = q(0, 2)[0], y0 = q(0, 0)[1] - pad, y1 = q(1, 2)[1];
          stroke(`${key}.g${gi}`, [[x0, y0], [x2 + pad, y0, 1], [x2 + pad, y1 + pad, 1], [x2 - pad, y1 + pad, 1], [x2 - pad, y0 + 2 * pad, 1], [x0, y0 + 2 * pad, 1], [x0, y0, 1]], { z: Z.annot - 3, w: rw, color: C.red, draw: d });
        }
      });
      return;
    }
    // 6²–10²: five places a side, the 4th one an ellipsis (tiny dots, so it scales with the square)
    const P = p => (p - 2) * g, e = 1.7 * s, eg = g * 0.24;
    for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
      const x = cx + P(j), y = cy + P(i);
      if (i !== 3 && j !== 3) dot(`${key}.d${i}_${j}`, [x, y], R * bump, C.ink, z);
      else if (i === 3 && j === 3) [-1, 0, 1].forEach(q => dot(`${key}.ec${q}`, [x + q * eg, y + q * eg], e, C.ink, z));
      else if (i === 3) [-1, 0, 1].forEach(q => dot(`${key}.ev${j}_${q}`, [x, y + q * eg], e, C.ink, z));
      else [-1, 0, 1].forEach(q => dot(`${key}.eh${i}_${q}`, [x + q * eg, y], e, C.ink, z));
    }
    // the remainder strip, brushed on from the left when it is read out
    if (lit) {
      const x0 = cx - 2 * g - 7 * s, x1 = cx + 2 * g + 7 * s, y0 = cy + 2 * g + 8 * s, y1 = y0 + 13 * s, d = EASE.out(clamp((t - it.lit) / 0.35));
      stroke(key + '.sb', N2.box(x0, y0, x0 + (x1 - x0) * d, y1), { z: z - 0.2, w: 2, fill: C.paper });
      N2.fill(key + '.sf', x0 + 1, y0 + 1, x1 - 1, y1 - 1, it.r, { z: z - 0.1, draw: d, step: 8 * s, w: 1.8 });

  }
  /** where an item is at time t: array centre, number centre, scale */
  function itemAt(it, t) {
    const rowC = [RX(it.k), it.k === 0 ? RB - 6 : it.big ? RB - 2 * G0 : RB - (it.k - 1) * G0 / 2], rowN = [RX(it.k), RNY];

  }

  COMP.s2_items = {

  /** a two-line wooden sign (the same drawing as in odd): board centre `at`; plant: pole down to the floor (drops in), else held (pole 300, rises in);
   *  sticker: t (the little card from episode 1 on the pole); qmark: t (a red ? hangs from the board); t1: fade */
  const SW = 300, SH = 130, SS = 42;

          if (qo > 0.01) text(`${k}.q${i}`, '？', xq, y, { size: SS, z: z + 0.2, anchor: 'start', opacity: to * qo });

      });

// 第 35 场 · 偶数边：切成 4 块（even）
// 一排边长 1–6 的小正方形，交替标红字"奇 / 偶"，后面省略号。
// 具体图先出（只有画面）：6×6 点阵横竖各一刀，分成 4 块 3×3，写"36 = 4 × 9"。
// 一般图：每边"m + m"（两块之间留一道缝，每块中间画省略号），"m = 0、1、2……都行"；横竖各一刀（黑墨），四块标"m × m"；

  /* ---------------- L4–L5: the 2×2 table ---------------- */
  const TB = { x0: 330, y0: 270, cw: 330, ch: 120 };

  COMP.b2_table = {

(() => {
  const FL = N2.FL;

  const isDiff = n => { for (let d = 1; d * d <= n; d++) if (n % d === 0 && (n / d - d) % 2 === 0) return true; return false; };
  for (let n = 1; n <= 3000; n++) if (isDiff(n) === rem2(n)) { console.error('d2_dark: "余 2 ⇔ 没有小拐角" breaks at', n); break; }
  if (!rem2(998) || rem2(999) || rem2(1000) || !(998 + 4 > 1000)) console.error('d2_dark: 998 should be the last 余 2 number below 1000');
  const countRem2 = m => { let c = 0; for (let n = 1; n <= m; n++) if (rem2(n)) c++; return c; };
  if (countRem2(998) !== 250 || countRem2(1000) !== 250) console.error('d2_dark: 余 2 numbers up to 998 should be 250, got', countRem2(998));
  if (countRem2(2026) !== 507 || !rem2(2026) || 2026 !== 4 * 506 + 2) console.error('d2_dark: 2026 should be the 507th 余 2 number, got', countRem2(2026));

    CLR1: 11.0,                                             // stack + scope card fade
    LANE: 11.6, BRICKS: 11.95, RUN: 12.9,                    // the tape; the first brick starts going out
    A: 14.6, K250: 15.9, K507: 16.7, NOTE: 18.4,             // speed-up; 998 (and the 1000 flash); 2026; "……没有尽头"

    fx: [
      F(4.6, { type: 'title', id: 'nx', text: '下集：两扇门，同一个房间', x: 800, y: 160, size: 76, t0: 0.5, color: 'red' }),
      { type: 'n2_grp', id: 'rmg', out: 4.4, inner: { type: 'prop', kind: 'h2_room', id: 'rm', at: [800, 470], t0: 0.8, drawDur: 1.0 } },
      { type: 'n2_fn', id: 'fl', t0: 2.6, cues: [[2.6, 'swish']], fn: (t, lt, k) => {
        const o = clamp(lt / 0.2) * (1 - clamp((lt - 1.2) / 0.3)); if (o <= 0) return;
        for (let r = 0; r < 4; r++) { const x0 = 1170, y0 = 330 + r * 40; stroke(`${k}.b${r}`, N2.box(x0, y0, x0 + 260, y0 + 28), { z: Z.set, w: 3, fill: C.paper, opacity: o }); N2.fill(`${k}.f${r}`, x0 + 2, y0 + 2, x0 + 258, y0 + 26, r, { z: Z.set + 0.2, step: 12, dot: 2.6, opacity: o }); }
      } },
      { type: 'title', id: 'fin', text: '《一道题长大了》', x: 800, y: 330, size: 96, t0: 4.9, sfx: 'stamp' },
      { type: 'title', id: 'fin2', text: '第二集 · 完', x: 800, y: 480, size: 72, t0: 5.3, color: 'red', rot: -2 },
    ],
    subs: [
      { t0: 0.6, t1: 4.21, text: '下集：两扇门，同一个房间。' },
      { t0: 4.91, t1: 8.45, text: '《一道题长大了》，第二集完。' },
    ],
  });
})();

/* =====================================================================
   PLAYER  — clock, controls, chapters, "think" pauses, narration sync, music
   ===================================================================== */
prepareEpisode();
const $ = id => document.getElementById(id);
const ui = { play: $('btnPlay'), restart: $('btnRestart'), scrub: $('scrub'), time: $('time'), narr: $('btnNarr'), snd: $('btnSnd'), music: $('btnMusic'),
  poster: $('poster'), think: $('think'), chapters: $('chapters'), credits: $('credits') };
const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
};
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; };
const P = { t: 0, playing: false, poster: true, waiting: null, wall0: 0, t0: 0, prev: 0, lastQ: -1, raf: 0, scene: -1, loading: false,
  narr: true, snd: true, music: true };
try { const s = JSON.parse(localStorage.getItem('taoPlayerPrefs') || 'null'); if (s) { P.narr = s.narr !== false; P.snd = s.snd !== false; P.music = s.music !== false; } } catch (e) { /* storage blocked */ }
const savePrefs = () => { try { localStorage.setItem('taoPlayerPrefs', JSON.stringify({ narr: P.narr, snd: P.snd, music: P.music })); } catch (e) { /* ignore */ } };
if (!MUSIC.available()) ui.music.hidden = true;
if (window.TAO_AUDIO && window.TAO_AUDIO.credits) { ui.credits.textContent = window.TAO_AUDIO.credits; ui.credits.hidden = false; }

ui.scrub.max = EP.dur.toFixed(2);
const CHAPS = EP.scenes.filter(sc => sc.chapter).map(sc => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'chap';
  b.innerHTML = `<span></span><span class="ct">${fmt(sc.start)}</span>`; b.firstChild.textContent = sc.chapter;
  b.addEventListener('click', () => { seek(sc.start); play(); });
  li.appendChild(b); ui.chapters.appendChild(li);
  return { sc, b };
});

/** Which music bed plays at global time t, and how far into it (beds restart at the first scene of each run). */
function musicAt(t) {
  const sc = sceneAt(Math.min(t, EP.dur - 1e-6)), key = (EP.music || {})[sc.id] || null;
  let i = sc.index;
  while (i > 0 && (EP.music || {})[EP.scenes[i - 1].id] === key) i--;
  return { key, offset: t - EP.scenes[i].start };
}
function syncMusic(force) {
  if (!P.music || !P.playing) { MUSIC.stop(); return; }
  const m = musicAt(P.t);
  if (m.key && MUSIC.ready(m.key)) MUSIC.set(m.key, m.offset, force);
}

function paint(t, force) {
  const q = Math.floor(t * CFG.FPS + 1e-6);
  if (force || q !== P.lastQ) { render(t); P.lastQ = q; }
}
function syncUI() {
  const t = P.poster ? 0 : P.t;
  ui.scrub.value = t.toFixed(2);
  ui.scrub.setAttribute('aria-valuetext', `${fmt(t)}`);
  ui.time.textContent = P.loading ? '加载声音…' : `${fmt(t)} / ${fmt(EP.dur)}`;
  ui.play.innerHTML = P.playing ? ICON.pause : ICON.play;
  ui.play.setAttribute('aria-label', P.playing ? '暂停' : '播放');
  ui.poster.hidden = !P.poster;
  ui.think.hidden = P.waiting === null || P.playing;
  ui.narr.setAttribute('aria-pressed', String(P.narr));
  ui.snd.setAttribute('aria-pressed', String(P.snd));
  ui.music.setAttribute('aria-pressed', String(P.music));
  let cur = null; for (const c of CHAPS) if (t >= c.sc.start - 1e-6) cur = c;
  CHAPS.forEach(c => c.b.setAttribute('aria-current', String(c === cur && !P.poster)));
}
function fireCues(a, b) {
  for (const c of EP.cues) {
    if (c.t <= a) continue; if (c.t > b) break;
    if (c.sfx && P.snd) SFX.play(c.sfx);
    if (c.say && P.narr) NARR.say(c);
  }
}
/** after a seek, pick up the line that is being spoken at t */
function resumeVoice(t) {
  if (!P.narr) return;
  let last = null; for (const c of EP.cues) { if (c.t > t) break; if (c.say) last = c; }
  if (last && t - last.t > 0.05) NARR.say(last, t - last.t);
}
function tick(now) {
  if (!P.playing) return;
  let t = P.t0 + (now - P.wall0) / 1000;
  // hold the picture while the voice finishes, instead of letting lines pile up
  const talking = P.narr && NARR.busy();
  if (talking) {
    const nx = EP.syncs.find(x => x > P.prev + 1e-4 && x <= t);
    if (nx !== undefined) { t = Math.max(P.prev, nx - 1e-3); P.t0 = t; P.wall0 = now; }
  }
  MUSIC.duck(talking);
  // "轮到你了" pauses: stop and wait for the child
  const pp = EP.pauses.find(x => x > P.prev && x <= t);
  if (pp !== undefined) t = pp;
  if (t >= EP.dur) t = EP.dur;
  fireCues(P.prev, t); P.prev = t; P.t = t;
  paint(t);
  const si = sceneAt(Math.min(t, EP.dur - 1e-6)).index;
  if (si !== P.scene) { P.scene = si; syncMusic(false); }
  else if (P.music && !MUSIC.current()) syncMusic(false); // bed finished decoding after play started
  if (pp !== undefined) {
    P.playing = false; P.waiting = pp;
    if (P.music && EP.think && MUSIC.ready(EP.think)) MUSIC.set(EP.think, 0, true); else MUSIC.stop();
    syncUI(); return;
  }
  if (t >= EP.dur) { P.playing = false; MUSIC.stop(1.5); syncUI(); return; }
  syncUI();
  P.raf = requestAnimationFrame(tick);
}
async function play() {
  if (P.loading) return;
  const resume = P.waiting !== null;
  if (P.poster || P.t >= EP.dur - 1e-3) P.t = 0;
  P.poster = false; P.waiting = null;
  SFX.unlock();
  if (!resume) NARR.cancel();
  if (P.narr) NARR.prime();
  // first play: decode the narration (quick) before the clock starts; music decodes alongside and joins when ready
  const voiceReady = NARR.load();
  MUSIC.load();
  if (voiceReady) { P.loading = true; paint(P.t, true); syncUI(); await voiceReady; P.loading = false; }
  P.playing = true;
  P.t0 = P.t; P.prev = resume ? P.t : P.t - 1e-4; P.wall0 = performance.now();
  if (!resume) resumeVoice(P.t);
  P.scene = sceneAt(Math.min(P.t, EP.dur - 1e-6)).index;
  syncMusic(true);
  cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick);
  paint(P.t, true); syncUI();
}
function pause() { P.playing = false; cancelAnimationFrame(P.raf); NARR.cancel(); MUSIC.stop(); syncUI(); }
function toggle() { P.playing ? pause() : play(); }
function seek(t) {
  pause(); P.poster = false; P.waiting = null;
  P.t = clamp(+t || 0, 0, EP.dur);
  paint(P.t, true); syncUI();
}
ui.play.addEventListener('click', toggle);
ui.poster.addEventListener('click', play);
ui.think.addEventListener('click', play);
ui.restart.addEventListener('click', () => { seek(0); play(); });
ui.scrub.addEventListener('input', () => seek(+ui.scrub.value));
ui.narr.addEventListener('click', () => { P.narr = !P.narr; if (!P.narr) NARR.cancel(); savePrefs(); syncUI(); });
ui.snd.addEventListener('click', () => { P.snd = !P.snd; if (P.snd) SFX.unlock(); savePrefs(); syncUI(); });
ui.music.addEventListener('click', () => { P.music = !P.music; SFX.unlock(); MUSIC.load(); syncMusic(true); savePrefs(); syncUI(); });
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  const tag = e.target && e.target.tagName;
  if (tag === 'BUTTON' || tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'range')) return;
  e.preventDefault(); toggle();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.playing) pause(); });

// reduced motion: no line boil (holds become perfectly still)
try {
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  RM.reduce = mq.matches;
  const onMQ = () => { RM.reduce = mq.matches; paint(P.poster ? EP.poster : P.t, true); };
  mq.addEventListener ? mq.addEventListener('change', onMQ) : mq.addListener(onMQ);
} catch (e) { /* ignore */ }

// test/automation hooks
window.render = render;
window.__duration = EP.dur;
window.__scenes = EP.scenes.map(s => ({ id: s.id, chapter: s.chapter || null, start: +s.start.toFixed(3), dur: s.dur }));
window.__seek = t => { seek(t); render(P.t); P.lastQ = Math.floor(P.t * CFG.FPS + 1e-6); };
// video export hooks (tools/export_video.cjs): mix the episode's sound offline, then hand it out in base64 chunks
window.__renderAudio = async (sr = 48000, holds = []) => { window.__wav = wavBytes(await renderEpisodeAudio(sr, holds)); return window.__wav.length; };
window.__pauses = EP.pauses.slice();
window.__wavChunk = (i, n) => { const a = window.__wav.subarray(i, i + n); let s = ''; for (let k = 0; k < a.length; k += 0x8000) s += String.fromCharCode.apply(null, a.subarray(k, k + 0x8000)); return btoa(s); };
window.__audio = () => ({ ctx: AUD.ctx && AUD.ctx.state, music: MUSIC.current(), talking: NARR.busy(), t: P.t, playing: P.playing, waiting: P.waiting });

paint(Math.min(EP.poster, EP.dur), true); syncUI();

</script>
</body>
